<!doctype html>
<html lang="it">
<head>

<title>Musica · Handemiyy</title>

<meta name="theme-color" content="#f6ece1">

<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<style>
/* Layout: a gold title, the player in a frame, the albums as golden records underneath. One light look, no red. */
:root { --ink: #2c2128; --muted: #7d6a62; --gold: #c9a469; --gold-d: #8f6630; --ivory: #fffaf2; --line: rgba(201, 164, 105, .45);
  --display: "Bodoni Moda", Didot, "Times New Roman", serif; --caps: Cinzel, "Bodoni Moda", serif; --ui: Jost, system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 15px/1.5 var(--ui);
  background: url(../h/silk.webp) center / 520px repeat, linear-gradient(160deg, #f8ecf6, #fbf1e6 50%, #eaf5ef); background-blend-mode: multiply; }
.wrap { max-width: 880px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 7px 14px 7px 10px; border-radius: 999px; text-decoration: none; color: var(--gold-d);
  background: rgba(255, 250, 242, .85); box-shadow: inset 0 0 0 1px var(--line), 0 8px 18px -12px rgba(110, 72, 20, .5); font: 600 13px/1 var(--ui); letter-spacing: .04em; }
.back:focus-visible, .alb:focus-visible { outline: 2px solid var(--gold-d); outline-offset: 2px; }
header { text-align: center; }
h1 { margin: 2px 0 0; font: italic 700 clamp(40px, 11vw, 64px)/1 var(--display); background: linear-gradient(100deg, #9a6d2c, #e8c784 35%, #a87a36 55%, #f1d79d 75%, #93672a); -webkit-background-clip: text; background-clip: text; color: transparent; text-wrap: balance; }
.kick { margin: 8px 0 0; font: 600 12px/1.3 var(--caps); letter-spacing: .28em; text-transform: uppercase; color: var(--ink); }
.sub { margin: 6px auto 0; max-width: 34em; color: var(--muted); font-size: 14px; }
.stage { padding: 4px; border-radius: 26px; background: linear-gradient(140deg, #f7e9c9, #c9a469 22%, #fff5dc 46%, #b98f4f 72%, #efd8a8); box-shadow: 0 26px 50px -30px rgba(72, 52, 84, .55); }
.screen { position: relative; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; background: radial-gradient(120% 90% at 50% 30%, #fff8ec, #efdcc0); display: grid; place-items: center; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.idle { text-align: center; padding: 20px; color: var(--gold-d); }
.idle b { display: block; font: italic 700 26px/1.2 var(--display); color: var(--ink); }
.now { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 22px; font: 600 12px/1.3 var(--caps); letter-spacing: .2em; text-transform: uppercase; color: var(--gold-d); }
.label { display: flex; align-items: center; gap: 12px; margin: 6px 0 0; font: 600 12.5px/1.2 var(--caps); letter-spacing: .3em; text-transform: uppercase; color: var(--ink); }
.label::before, .label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201, 164, 105, 0), var(--gold)); }
.label::after { transform: scaleX(-1); }
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.alb { position: relative; display: grid; justify-items: center; gap: 8px; padding: 14px 10px 12px; border: 0; border-radius: 20px; cursor: pointer; font: inherit; color: inherit;
  background: rgba(255, 250, 242, .9); box-shadow: inset 0 0 0 1px var(--line), 0 12px 24px -18px rgba(110, 72, 20, .55); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), box-shadow .3s; }
.alb:hover { transform: translateY(-3px); }
.alb[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold), 0 16px 30px -16px rgba(150, 100, 30, .6); background: linear-gradient(160deg, #fffaf0, #fbeccd); }
.disc { position: relative; width: 92px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .0) 0 2px, rgba(255, 255, 255, .14) 2.5px 3px), conic-gradient(from 30deg, #3d3040, #6b5a70, #2f2533, #57485c, #3d3040);
  box-shadow: 0 8px 16px -8px rgba(40, 25, 40, .6); }
.disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(120deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 40%); }
.disc i { width: 40%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font: italic 700 17px/1 var(--display); color: #5b3d14; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255, 250, 235, .7); }
.alb[aria-pressed="true"] .disc { animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.alb .n { font: italic 700 19px/1.1 var(--display); }
.alb .s { font-size: 12px; color: var(--muted); }
.note { margin: 4px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); }

.alb { padding: 10px 10px 12px; }
.cover { position: relative; width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(150deg, #f7ead2, #eadcf0); box-shadow: 0 10px 18px -12px rgba(60, 40, 50, .55); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); opacity: 0; transition: opacity .5s; }
.cover img.ok { opacity: 1; }
.cover .disc { width: 70%; }
.alb .n { text-align: center; font-size: 17px; overflow-wrap: anywhere; }
.alb[aria-pressed="true"] .disc { animation: none; }
.alb[aria-pressed="true"] .cover { box-shadow: 0 0 0 3px var(--gold), 0 12px 22px -12px rgba(150, 100, 30, .7); }
.detail { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 22px; background: rgba(255, 250, 242, .92); box-shadow: inset 0 0 0 1px var(--line), 0 16px 30px -22px rgba(110, 72, 20, .6); }
.detail .cover { width: 120px; }
.detail h2 { margin: 0; font: italic 700 24px/1.1 var(--display); overflow-wrap: anywhere; }
.detail .meta { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.all { border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; font: 600 13px/1 var(--caps); letter-spacing: .14em; text-transform: uppercase; color: #3e2a10; background: linear-gradient(135deg, #fbecc8, #d9b06a 55%, #f3dca8); box-shadow: 0 10px 20px -12px rgba(110, 72, 20, .6); }
.tracks { grid-column: 1 / -1; list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
.tracks button { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 10px 12px; border: 0; border-radius: 12px; cursor: pointer; text-align: left; font: 500 15px/1.3 var(--ui); color: var(--ink); background: transparent; }
.tracks button:hover { background: rgba(201, 164, 105, .12); }
.tracks button[aria-current="true"] { background: linear-gradient(90deg, rgba(243, 217, 154, .55), rgba(246, 201, 216, .35)); font-weight: 600; }
.tracks .k { font: italic 700 15px/1 var(--display); color: var(--gold-d); text-align: right; }
.tracks .eq { width: 16px; height: 12px; display: none; background: linear-gradient(var(--gold-d), var(--gold-d)) 0 100% / 3px 60% no-repeat, linear-gradient(var(--gold-d), var(--gold-d)) 6px 100% / 3px 100% no-repeat, linear-gradient(var(--gold-d), var(--gold-d)) 12px 100% / 3px 40% no-repeat; }
.tracks button[aria-current="true"] .eq { display: block; }
.loading { color: var(--muted); font-size: 13px; padding: 6px 12px; }
@media (max-width: 420px) { .detail { grid-template-columns: 92px minmax(0, 1fr); } .detail .cover { width: 92px; } .detail h2 { font-size: 20px; } }
.scan { position: absolute; left: -9999px; top: 0; width: 2px; height: 2px; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .alb[aria-pressed="true"] .disc { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../" id="back">‹ <span data-t="home"></span></a>
  <header>
    <h1 data-t="title"></h1>
    <p class="kick">Fabio Schettino</p>
    <p class="sub" data-t="sub"></p>
  </header>
  <div class="stage"><div class="screen" id="screen"><div class="idle"><b data-t="pick"></b><span data-t="pickSub"></span></div></div></div>
  <p class="now" id="now" aria-live="polite"></p>
  <section class="detail" id="detail" hidden aria-live="polite"></section>
  <div class="scan" aria-hidden="true"><div id="scan"></div></div>
  <p class="label" data-t="albums"></p>
  <div class="albums" id="albums"></div>
  <p class="note" data-t="note"></p>
</div>
<script>
(function () {
  'use strict';
  // the albums, in the order they were given; each is a YouTube Music album playlist
  var LISTS = ['OLAK5uy_nPjGdXrlrzhYxeyK8aU90EqUMpkFbMMeY', 'OLAK5uy_mnG-L6FDlStYx6XtRSP-jNFCDasV5U5YU', 'OLAK5uy_lj-DMnnnu-wV6QrSMLMOuf4Jl0M8uZnPQ',
    'OLAK5uy_lANK8DeEZjQUfL-32cVQ9XaXxHD1KbMSk', 'OLAK5uy_maUkfiD96fsK0kUwpqDEnf_IkxzHGWcXk', 'OLAK5uy_nL6LEBAcBU_JNsv4HcyoQaztT2jjRnQoU',
    'OLAK5uy_lSV5Gqave5vk5fGKsRQ02sOqk3M5RmE8Y', 'OLAK5uy_kHIxVKxHvM7tXupvMc_5i4wDv6IcxSto8', 'OLAK5uy_kIpqzc3YOZK_sgWwjW2rucFbDMrrqUKWw',
    'OLAK5uy_mwVkzcN86iHjSI_GcNCnnXpcf76DYd8u4', 'OLAK5uy_l7wUOl9iW_w6g2JUiGb_AliAWEsFRntRQ', 'OLAK5uy_kT4rElO-0eSGXjwMo3x82qIe1cVlLY7o8',
    'OLAK5uy_kF1I3Vgi4EwrDWRd-tmRT3S2Ypjj9LgTw'];
  // album names: fill in here when known; until then the albums are numbered
  var NAMES = [];
  var COLORS = ['#f3d99a', '#f6c9d8', '#d9cbf3', '#c9ecdc', '#fbe1c4', '#e9d3f0'];
  var T = {
    it: { home: 'Tutti i giochi', title: 'La musica di Hande', sub: 'Tutti gli album, da ascoltare qui. Scegli un album e poi il brano che vuoi, oppure ascoltalo tutto.', pick: 'Scegli un album', pickSub: 'tocca uno dei dischi qui sotto', albums: 'Gli album', album: 'Album', tracks: 'tutto l\'album', now: 'In ascolto', note: 'La musica arriva da YouTube Music. Copertine e titoli compaiono dopo la prima apertura.', songs: 'brani', song: 'Brano', playAll: 'Ascolta tutto', loading: 'Sto cercando i brani…' },
    tr: { home: 'Tüm oyunlar', title: 'Hande\'nin müziği', sub: 'Bütün albümler burada dinlenebilir. Bir albüm, sonra istediğin şarkıyı seç ya da hepsini dinle.', pick: 'Bir albüm seç', pickSub: 'aşağıdaki plaklardan birine dokun', albums: 'Albümler', album: 'Albüm', tracks: 'albümün tamamı', now: 'Çalıyor', note: 'Müzik YouTube Music\'ten geliyor. Kapaklar ve isimler ilk açılıştan sonra görünür.', songs: 'şarkı', song: 'Şarkı', playAll: 'Hepsini dinle', loading: 'Şarkılar aranıyor…' }
  };
  var lang = 'it';
  try { var sl = JSON.parse(localStorage.getItem('hm-lang')); if (sl === 'it' || sl === 'tr') lang = sl; else if (/^tr/i.test(navigator.language || '')) lang = 'tr'; } catch (e) { if (/^tr/i.test(navigator.language || '')) lang = 'tr'; }
  document.documentElement.lang = lang;
  var t = function (k) { return T[lang][k]; };
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t(el.getAttribute('data-t')); });
  var box = document.getElementById('albums'), screen = document.getElementById('screen'), now = document.getElementById('now'), detail = document.getElementById('detail');
  // what the site learns from YouTube (track ids, titles, album names), kept on this device so it is read only once
  try { localStorage.removeItem('hm-mu-meta-v1'); } catch (e) { /* nothing */ }
  var KEY = 'hm-mu-meta-v2', META = {};
  try { META = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { META = {}; }
  var saveMeta = function () { try { localStorage.setItem(KEY, JSON.stringify(META)); } catch (e) { /* not saved */ } };
  var info = function (i) { return META[LISTS[i]] || (META[LISTS[i]] = { ids: [], titles: {}, name: '' }); };
  var name = function (i) { return NAMES[i] || info(i).name || (t('album') + ' ' + (i + 1)); };
  var thumb = function (vid) { return 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg'; };
  var cards = [];
  function coverHTML(i) { return '<span class="cover"><span class="disc" aria-hidden="true"><i style="--c:' + COLORS[i % COLORS.length] + '">' + (i + 1) + '</i></span><img alt="" loading="lazy" decoding="async"></span>'; }
  function setCover(el, i) {
    var im = el.querySelector('img'), ids = info(i).ids;
    if (!ids.length || im.getAttribute('src') === thumb(ids[0])) return;
    im.onload = function () { im.className = 'ok'; }; im.src = thumb(ids[0]);
  }
  LISTS.forEach(function (id, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'alb'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = coverHTML(i) + '<span class="n"></span><span class="s"></span>';
    b.addEventListener('click', function () { openAlbum(i, true); });
    box.appendChild(b); cards.push(b);
  });
  function paintCard(i) {
    var b = cards[i], n = info(i).ids.length;
    b.querySelector('.n').textContent = name(i);
    b.querySelector('.s').textContent = n ? n + ' ' + t('songs') : t('tracks');
    setCover(b, i);
  }
  LISTS.forEach(function (id, i) { paintCard(i); });

  // the album open: cover, name, every song to pick
  var cur = -1, curTrack = -1;
  function openAlbum(i, start) {
    cur = i;
    cards.forEach(function (b, k) { b.setAttribute('aria-pressed', String(k === i)); });
    var inf = info(i);
    detail.hidden = false;
    detail.innerHTML = coverHTML(i) + '<div><h2></h2><p class="meta"></p><button type="button" class="all"></button></div><ol class="tracks"></ol>';
    detail.querySelector('h2').textContent = name(i);
    detail.querySelector('.meta').textContent = 'Fabio Schettino' + (inf.ids.length ? ' · ' + inf.ids.length + ' ' + t('songs') : '');
    detail.querySelector('.all').textContent = t('playAll');
    detail.querySelector('.all').addEventListener('click', function () { play(i, 0); });
    setCover(detail, i);
    var ol = detail.querySelector('.tracks');
    if (!inf.ids.length) { ol.innerHTML = '<li class="loading"></li>'; ol.firstChild.textContent = t('loading'); scanNow(i); }
    inf.ids.forEach(function (vid, k) {
      var li = document.createElement('li'), bt = document.createElement('button');
      bt.type = 'button'; bt.dataset.k = k;
      bt.innerHTML = '<span class="k">' + (k + 1) + '</span><span class="tt"></span><span class="eq" aria-hidden="true"></span>';
      bt.querySelector('.tt').textContent = inf.titles[vid] || (t('song') + ' ' + (k + 1));
      bt.addEventListener('click', function () { play(i, k); });
      li.appendChild(bt); ol.appendChild(li);
    });
    markTrack();
    fetchTitles(i);
    if (start) play(i, 0);
  }
  function markTrack() {
    if (!detail.hidden) Array.prototype.forEach.call(detail.querySelectorAll('.tracks button'), function (b) { b.setAttribute('aria-current', String(cur === playing && +b.dataset.k === curTrack)); });
    var inf = playing >= 0 ? info(playing) : null, vid = inf && inf.ids[curTrack];
    now.textContent = playing < 0 ? '' : t('now') + ' · ' + name(playing) + (vid && inf.titles[vid] ? ' · ' + inf.titles[vid] : '');
  }

  // song names, from YouTube's public oEmbed (noembed as a second way)
  var asked = {};
  function oembed(url) {
    return fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url)).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .catch(function () { return fetch('https://noembed.com/embed?url=' + encodeURIComponent(url)).then(function (r) { return r.json(); }); });
  }
  function fetchTitles(i) {
    var inf = info(i);
    if (!inf.name && !asked['L' + i]) {
      asked['L' + i] = 1;
      oembed('https://www.youtube.com/playlist?list=' + LISTS[i]).then(function (d) {
        var n = d && d.title ? String(d.title).replace(/^Album\s*[-–:]\s*/i, '').trim() : '';
        if (n) { inf.name = n; saveMeta(); paintCard(i); if (cur === i) { detail.querySelector('h2').textContent = name(i); } markTrack(); }
      }).catch(function () {});
    }
    inf.ids.forEach(function (vid, k) {
      if (inf.titles[vid] || asked[vid]) return;
      asked[vid] = 1;
      oembed('https://www.youtube.com/watch?v=' + vid).then(function (d) {
        if (!d || !d.title) return;
        inf.titles[vid] = String(d.title); saveMeta();
        if (cur === i) { var b = detail.querySelector('.tracks button[data-k="' + k + '"] .tt'); if (b) b.textContent = inf.titles[vid]; }
        markTrack();
      }).catch(function () {});
    });
  }

  // YouTube's player: one you see, and a hidden one that reads each album's list of songs
  var YTP = null, ready = false, wantPlay = null, playing = -1, scanner = null, scanReady = false, queue = [], scanning = -1;
  window.onYouTubeIframeAPIReady = function () {
    screen.innerHTML = '<div id="ytp"></div>';
    YTP = new YT.Player('ytp', { width: '100%', height: '100%', host: 'https://www.youtube-nocookie.com', playerVars: { rel: 0, playsinline: 1, modestbranding: 1 },
      events: {
        onReady: function () { ready = true; if (wantPlay) { play(wantPlay[0], wantPlay[1]); wantPlay = null; } },
        onStateChange: function (e) {
          if (e.data === 1 && playing >= 0) {
            curTrack = YTP.getPlaylistIndex(); markTrack();
          }
        } } });
    scanReady = true; LISTS.forEach(function (id, i) { if (!info(i).ids.length) queue.push(i); }); nextScan();
  };
  function scanNow(i) { if (queue.indexOf(i) > 0) { queue.splice(queue.indexOf(i), 1); queue.unshift(i); } else if (queue.indexOf(i) < 0 && scanning !== i) queue.unshift(i); if (scanReady && scanning < 0) nextScan(); }
  // each album is read by its own fresh player, so one album's songs can never end up under another
  var taken = {};
  function nextScan() {
    if (!queue.length) { scanning = -1; return; }
    var i = queue.shift(); scanning = i;
    if (info(i).ids.length) { nextScan(); return; }
    var host = document.getElementById('scan'), el = document.createElement('div');
    host.innerHTML = ''; host.appendChild(el);
    var done = false, tm = 0, p = null;
    var finish = function (ids) {
      if (done) return; done = true; clearInterval(tm);
      // a list already given to another album is a leftover, not this album
      if (ids && ids.length && !taken[ids[0]]) { taken[ids[0]] = 1; info(i).ids = ids.slice(); saveMeta(); paintCard(i); fetchTitles(i); if (cur === i) openAlbum(i, false); }
      try { p.destroy(); } catch (e) { /* gone */ }
      scanning = -1; setTimeout(nextScan, 150);
    };
    p = new YT.Player(el, { width: '2', height: '2', host: 'https://www.youtube-nocookie.com', playerVars: { listType: 'playlist', list: LISTS[i], autoplay: 0, mute: 1 },
      events: { onReady: function () {
        var tries = 0;
        tm = setInterval(function () { var ids = null; try { ids = p.getPlaylist(); } catch (e) { ids = null; } if ((ids && ids.length) || ++tries > 30) finish(ids); }, 300);
      }, onError: function () { finish(null); } } });
    setTimeout(function () { finish(null); }, 15000);
  }
  function play(i, k) {
    playing = i; curTrack = k;
    if (!ready) { wantPlay = [i, k]; markTrack(); return; }
    YTP.loadPlaylist({ listType: 'playlist', list: LISTS[i], index: k });
    markTrack();
    try { localStorage.setItem('hm-music-album', String(i)); } catch (e) { /* not saved */ }
    if (window.matchMedia('(max-width: 700px)').matches) screen.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  var tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
})();
</script>
