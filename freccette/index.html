<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120b07">
<title>Freccette · Handemiyy</title>
<link rel="icon" href="img/icon.webp">
<script>window.HM_ALBUM="../";</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#120b07;color:#f3e6c8;font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;display:block}
button,input{font-family:inherit}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));z-index:5;transition:opacity .35s}
.overlay.hide{opacity:0;pointer-events:none}
.panel{position:relative;width:100%;max-width:480px;max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(32,20,12,.88),rgba(18,11,7,.92));border:1px solid rgba(214,172,92,.55);border-radius:22px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,150,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;touch-action:pan-y}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;min-height:30px}
.back{color:#e9c46a;text-decoration:none;font-size:15px;padding:6px 4px}
.lang{display:flex;border:1px solid rgba(214,172,92,.55);border-radius:20px;overflow:hidden}
.lang button{background:none;border:0;color:#cdb894;padding:6px 12px;font-size:14px;cursor:pointer}
.lang button.sel{background:#d8ad55;color:#2a1606;font-weight:bold}
.logo{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:8px}
.logo img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 24px rgba(255,190,90,.35)}
.logo h1{font-size:34px;letter-spacing:1px;background:linear-gradient(180deg,#fff2c4,#e2b04a 55%,#a8761f);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:left;line-height:1}
.logo small{display:block;font-size:13px;color:#8fd3e8;letter-spacing:2px;margin-top:6px;font-style:italic}
.lbl{font-size:12px;letter-spacing:3px;color:#c9a45e;text-transform:uppercase;margin:12px 0 8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgbtn{background:none;border:0;cursor:pointer;transition:transform .15s,filter .2s,opacity .2s;display:block;width:100%}
.imgbtn img{width:100%;display:block;pointer-events:none}
.imgbtn:active{transform:scale(.95)}
.imgbtn:disabled{opacity:.45;cursor:default}
.modes .imgbtn{opacity:.55;filter:saturate(.6) brightness(.8)}
.modes .imgbtn.sel{opacity:1;filter:drop-shadow(0 0 10px rgba(255,200,90,.75));transform:scale(1.04)}
.woodbtn{aspect-ratio:842/325;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#5a3519,#2d1709 75%);border:3px solid #d1a54a;box-shadow:inset 0 0 0 2px #6d4a17,inset 0 6px 14px rgba(255,190,110,.18),0 4px 10px rgba(0,0,0,.5);color:#ffd970;font:bold 19px Georgia,serif;letter-spacing:1px;text-shadow:0 0 8px rgba(255,190,60,.7),0 2px 2px #2a1404;display:flex;align-items:center;justify-content:center}
.desc{min-height:38px;font-size:14px;color:#e8d8b4;line-height:1.35;margin-top:8px;font-style:italic}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(214,172,92,.55);border-radius:14px;overflow:hidden}
.tabs button{background:rgba(60,36,18,.5);border:0;color:#f3e6c8;padding:10px 4px;font-size:15px;cursor:pointer}
.tabs button+button{border-left:1px solid rgba(214,172,92,.35)}
.tabs button.sel{background:linear-gradient(180deg,#e9c46a,#b8862b);color:#2a1606;font-weight:bold}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.char{border:1px solid rgba(214,172,92,.45);background:rgba(60,36,18,.5);border-radius:14px;padding:8px 4px;color:#f3e6c8;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.6;transition:.2s}
.char img{width:52px;height:52px;border-radius:50%}
.char b{font-size:15px}.char small{font-size:12px;color:#a9c9d4;font-style:italic}
.char.sel{opacity:1;border-color:#ffe39a;box-shadow:0 0 14px rgba(255,200,90,.45);background:rgba(110,70,28,.55)}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}
.chip{border:1px solid rgba(214,172,92,.55);background:rgba(60,36,18,.6);color:#f3e6c8;border-radius:30px;padding:9px 16px;font-size:15px;cursor:pointer;min-width:56px}
.chip.sel{background:linear-gradient(180deg,#e9c46a,#b8862b);color:#2a1606;border-color:#ffe39a;font-weight:bold}
.note{font-size:14px;color:#e8d8b4;margin-top:10px;line-height:1.4;font-style:italic}
.toggle{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:15px;cursor:pointer}
.sw{width:46px;height:26px;border-radius:20px;background:#3b2a1d;border:1px solid #8a6a35;position:relative;transition:.2s;flex:none}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#cdb894;transition:.2s}
.toggle.on .sw{background:#2f8a8f}.toggle.on .sw:after{left:22px;background:#fff3cf}
.play{width:min(240px,68%);margin:14px auto 2px}
.rec{font-size:13px;color:#a9c9d4;margin-top:6px;font-style:italic}
.help{font-size:13px;color:#cdbf9f;margin-top:8px;line-height:1.45}
.gold{display:inline-block;border:0;border-radius:30px;padding:12px 22px;font-size:17px;font-weight:bold;cursor:pointer;background:linear-gradient(180deg,#f1d27a,#c08f2f);color:#2a1606;box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 #fff3c4}
.gold:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid rgba(214,172,92,.55);color:#f3e6c8;border-radius:30px;padding:10px 18px;font-size:15px;cursor:pointer}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:4;pointer-events:none;transition:opacity .3s}
#hud.hide{opacity:0}
#hud>*{pointer-events:auto}
#hud .imgbtn{width:96px}
.round{width:42px;height:42px;border-radius:50%;border:2px solid #c99a3e;background:radial-gradient(circle at 35% 30%,#6a4420,#2a1709);color:#ffd970;font-size:19px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#net .panel{max-width:440px}
#net input{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid #b88d3c;background:#1d130c;color:#fff3d6;margin:10px 0 14px;text-align:center}
.code{font-size:34px;letter-spacing:6px;color:#ffd970;font-weight:bold;margin:2px 0}
.link{font-size:13px;color:#a9c9d4;word-break:break-all;margin-bottom:10px}
.plist{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.plist li{display:flex;align-items:center;gap:8px;border:1px solid rgba(214,172,92,.4);border-radius:12px;padding:6px 8px;text-align:left;background:rgba(60,36,18,.45);min-height:52px}
.plist li.free{opacity:.4;border-style:dashed}.plist li.off{opacity:.55}
.plist img{width:36px;height:36px;border-radius:50%}
.plist b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}.plist small{font-size:12px;color:#a9c9d4}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4fd18b;margin-right:6px}.dot.off{background:#c9a45e}
#end{background:rgba(0,0,0,.35)}
#end .card{position:relative;width:100%;max-width:760px;aspect-ratio:1672/941;max-height:100%;border-radius:22px;overflow:hidden;background:#0b0a12 url('img/trophy.webp') center/cover;box-shadow:0 20px 70px rgba(0,0,0,.7);border:1px solid rgba(214,172,92,.5)}
#end .top{position:absolute;top:5%;left:0;right:0;text-align:center;padding:0 10px}
#end h2{font-size:clamp(28px,6.5vw,58px);letter-spacing:2px;background:linear-gradient(180deg,#fff6d0,#f0c050 50%,#b07a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,190,70,.55))}
#end p{font-size:clamp(13px,2.5vw,19px);color:#f3e6c8;margin-top:4px;font-style:italic;text-shadow:0 2px 6px #000}
#end .stats{position:absolute;left:4%;bottom:5%;width:31%;background:rgba(15,10,8,.74);border:1px solid rgba(214,172,92,.45);border-radius:14px;padding:10px 12px;font-size:clamp(11px,2vw,15px);text-align:left;line-height:1.5}
#end .stats .pk{color:#ffd970;margin-top:4px}
#end .btns{position:absolute;right:4%;bottom:5%;width:27%;display:flex;flex-direction:column;gap:8px}
#end .wait{font-size:13px;color:#f3e6c8;text-align:center;font-style:italic;text-shadow:0 2px 4px #000}
#end .ph{position:absolute;right:5%;top:22%;width:15%;aspect-ratio:3/4;border-radius:10px;border:3px solid #c99a3e;background:#222 center/cover;box-shadow:0 0 22px rgba(255,190,80,.5);display:none;transform:rotate(4deg)}
@media (max-aspect-ratio:1/1){
 #end .card{aspect-ratio:auto;height:88%;display:flex;flex-direction:column;background-size:auto 100%;background-position:50% 50%}
 #end .top{position:relative;top:auto;padding:24px 10px 0}
 #end .ph{position:relative;right:auto;top:auto;width:30%;margin:14px auto 0;transform:rotate(-3deg)}
 #end .stats{position:relative;left:auto;bottom:auto;width:auto;margin:auto 18px 12px;font-size:15px}
 #end .btns{position:relative;right:auto;bottom:auto;width:auto;margin:0 18px 20px;flex-direction:row;flex-wrap:wrap}
 #end .btns .imgbtn{flex:1}
 #end .btns .wait{width:100%}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <button class="imgbtn" id="bMenu" aria-label="Menu"><img src="img/btn_menu.webp" alt="MENU"></button>
  <button class="round" id="bSnd" aria-label="Audio">♪</button>
</div>

<div id="menu" class="overlay">
 <div class="panel">
  <div class="topbar"><a class="back" id="bHome" href="../" hidden>‹ Handemiyy</a><span></span><div class="lang"><button data-l="it">IT</button><button data-l="tr">TR</button></div></div>
  <div class="logo"><img src="img/icon.webp" alt=""><div><h1 data-t="title"></h1><small data-t="sub"></small></div></div>
  <div class="lbl" data-t="match"></div>
  <div class="modes">
    <button class="imgbtn sel" data-mode="501"><img src="img/btn_501.webp" alt="501"></button>
    <button class="imgbtn" data-mode="cricket"><img src="img/btn_cricket.webp" alt="Cricket"></button>
    <button class="imgbtn" data-mode="clock"><div class="woodbtn" data-t="mClock"></div></button>
  </div>
  <div class="desc" id="desc"></div>
  <div class="toggle" id="tDbl"><div class="sw"></div><span data-t="dbl"></span></div>
  <div class="lbl" data-t="who"></div>
  <div class="tabs" id="tabs">
    <button data-tab="bots" data-t="tabBots"></button><button data-tab="local" data-t="tabLocal"></button><button data-tab="net" data-t="tabNet"></button>
  </div>
  <div id="pBots" class="chars"></div>
  <div id="pLocal" class="chips" hidden></div>
  <div id="pNet" hidden><p class="note" id="netNote"></p></div>
  <button class="imgbtn play" id="bPlay"><img src="img/btn_gioca.webp" alt="GIOCA"></button>
  <div class="help" data-t="help"></div>
  <div class="rec" id="rec"></div>
 </div>
</div>

<div id="net" class="overlay hide">
 <div class="panel">
  <div class="topbar"><button class="ghost" id="nBack" data-t="netLeave"></button><span id="nSub" style="color:#c9a45e;font-size:14px"></span></div>
  <div id="nIntro">
    <p class="note" id="nLead"></p>
    <input id="nName" maxlength="14" autocomplete="off" data-tp="netName">
    <button class="gold" id="nGo"></button>
  </div>
  <div id="nWait" hidden><p class="note" id="nWaitT"></p></div>
  <div id="nErr" hidden><p class="note" id="nErrT"></p><div class="row"><button class="gold" id="nRetry" data-t="netRetry"></button></div></div>
  <div id="nRoom" hidden>
    <div style="font-size:13px;color:#c9a45e;letter-spacing:2px" data-t="netRoom"></div>
    <div class="code" id="nCode"></div>
    <div class="link"><span class="dot" id="nDot"></span><span id="nLink"></span></div>
    <div class="row" id="nInvite"><button class="gold" id="nShare"></button><button class="ghost" id="nCopy" data-t="netCopy"></button></div>
    <ul class="plist" id="nPlayers"></ul>
    <div id="nModes" class="row"></div>
    <p class="note" id="nStatus"></p>
    <div class="row"><button class="gold" id="nStart" data-t="netStart"></button></div>
  </div>
 </div>
</div>

<div id="end" class="overlay hide">
 <div class="card">
  <div class="top"><h2 id="eT"></h2><p id="eS"></p></div>
  <div class="ph" id="ePh"></div>
  <div class="stats" id="eSt"></div>
  <div class="btns">
    <button class="imgbtn" id="bAgain"><img src="img/btn_gioca.webp" alt=""></button>
    <button class="imgbtn" id="bBack"><img src="img/btn_menu.webp" alt=""></button>
    <div class="wait" id="eWait" hidden></div>
  </div>
 </div>
</div>

<input type="file" id="pick" accept="image/*" hidden>

/* ---------- stato di gioco ---------- */
const CR=[20,19,18,17,16,15,25];
let cfg={mode:store.get('frec_mode','501'),dbl:store.get('frec_dbl',false),tab:store.get('frec_tab','bots'),bots:store.get('frec_bots',[0]),local:store.get('frec_local',2)};
if(!Array.isArray(cfg.bots)||!cfg.bots.length)cfg.bots=[0];
let G=null,state='menu',FAST=false;
let stuck=[],flight=null,popups=[],parts=[],banner=null,shake=0,motes=[],pulling=0,cpuAim=null;
let aim={on:false,hx:-1,hy:-1,px:0,py:0,off:0,t0:0};

function newPlayer(name,av,bot,i){return{name,av,bot,img:DIMG[i%4],score:501,hist:[],marks:{20:0,19:0,18:0,17:0,16:0,15:0,25:0},pts:0,clk:1,st:{darts:0,pts:0,best:0,t180:0,bulls:0}}}
function makeGame(c){
  // c: {mode,dbl,players:[{name,av,bot}],first,online,me}
  const ps=c.players.map((p,i)=>newPlayer(p.name,p.av,p.bot,i));
  return{mode:c.mode,dbl:c.dbl,ps,cur:(c.first||0)%ps.length,left:3,turn:[],tstart:501,round:1,winner:null,first:true,online:!!c.online,me:c.me==null?0:c.me,bust:false,wasBust:false,gid:c.gid||null,turns:0};
}
function startLocal(){
  let players;
  if(cfg.tab==='local'){players=[];for(let i=0;i<cfg.local;i++)players.push({name:T('player',i+1),av:'p'+(i+1),bot:null})}
  else{players=[{name:T('you'),av:'bunny',bot:null},...cfg.bots.slice().sort().map(b=>({name:BOTS[b].name,av:BOTS[b].key,bot:b}))]}
  G=makeGame({mode:cfg.mode,dbl:cfg.mode==='501'&&cfg.dbl,players,first:0});
  enterGame();
}
function enterGame(){
  stuck=[];flight=null;popups=[];parts=[];banner=null;cpuAim=null;pulling=0;
  $('#menu').classList.add('hide');$('#end').classList.add('hide');$('#net').classList.add('hide');$('#hud').classList.remove('hide');
  state='wait';later(beginTurn,250);
}
function later(fn,ms){const g=G;if(FAST){fn();return}setTimeout(()=>{if(G&&G===g)fn()},ms)}
const P=()=>G.ps[G.cur];
const isMine=()=>!!G&&(G.online?G.cur===G.me:P().bot==null);
const shortName=p=>p.name.length>9?p.name.slice(0,8)+'…':p.name;
function beginTurn(){
  if(!G||G.winner)return;
  const p=P();G.left=3;G.turn=[];G.tstart=p.score;stuck=[];
  if(!FAST){
    const mine=isMine();const solo=!G.online&&G.ps.filter(q=>q.bot==null).length===1;
    const who=(mine&&(solo||G.online))?T('yourTurn'):T('turnOf',p.name);
    const sub=G.mode==='cricket'?T('rSub',G.round):G.mode==='clock'?T('tSub',p.clk===25?T('bullW'):p.clk):T('sSub',p.score);
    showBanner(who,sub,1100,mine?'#ffd970':'#9fdcf0');if(mine&&G.online)sfx.turn();
  }
  state='wait';
  later(()=>{if(!G||G.winner)return;if(p.bot!=null&&!G.online){state='cpu';later(cpuStep,350)}else{state=isMine()?'aim':'remote';netPump()}},FAST?0:650);
}
function showBanner(t,s,dur,col){if(FAST)return;banner={t,s,t0:now(),dur:dur||1200,col:col||'#ffd970'}}

/* ---------- lancio ---------- */
function swayAmp(t){return .011+.045*Math.max(0,1-t/.38)+Math.min(.1,Math.max(0,t-1.05)*.07)}
function swayAt(A){const s=now()/1000;return{x:A*(Math.sin(s*2.3)+.55*Math.sin(s*3.9+1.3)),y:A*(Math.cos(s*1.9)+.55*Math.sin(s*3.1+2.1))}}
const toU=(x,y)=>({x:(x-L.bx)/L.R,y:(y-L.by)/L.R});
const toS=u=>({x:L.bx+u.x*L.R,y:L.by+u.y*L.R});
function reticleS(){const t=(now()-aim.t0)/1000;const A=aim.on?swayAmp(t):.016;const s=swayAt(A);return{x:aim.px+s.x*L.R,y:aim.py+aim.off+s.y*L.R,A}}
function throwDart(u,fromX){
  const p=P();state='fly';
  if(FAST){flight={u,img:p.img,ang:-112+(Math.random()*16-8)};land();return}
  sfx.whoosh();
  flight={u,t0:now(),dur:340,fx:fromX==null?W/2:fromX,fy:H+60,img:p.img,ang:-112+(Math.random()*16-8)};
}
function addPop(p){if(FAST)return;const t=now();popups.forEach(q=>{if(t-q.t0<1100&&Math.abs(q.x-p.x)<L.R*.9&&Math.abs(q.y-p.y)<L.R*.14)q.y-=L.R*.13});popups.push(p)}
function land(){
  const f=flight;flight=null;const p=P();const u=f.u;const res=scoreAt(u);const r=Math.hypot(u.x,u.y);
  stuck.push({u,img:f.img,ang:f.ang,t:now()});
  if(!FAST){
    shake=res.ring==='db'?11:res.m===3?8:5;
    if(r>.99)sfx.wall();else sfx.thunk(res.m===0?.7:1);
    const s=toS(u);
    if(res.ring==='db'||res.ring==='t'||res.ring==='sb'){sfx.ding(res.ring==='db');burst(s.x,s.y,res.ring==='db'?46:26,res.ring==='db'?['#ffe28a','#fff','#8fe3ff']:['#ffe28a','#ffd060','#fff'])}
    let label=res.lab,col='#fff3d0',size=1;
    if(res.ring==='db'){label=T('pBull');col='#ffe07a';size=1.5}else if(res.ring==='sb'){label='25';col='#ffe07a'}
    else if(res.m===3){label=T('pT',res.n,res.v);col='#8fe3ff';size=1.25}else if(res.m===2){label=T('pD',res.n,res.v);col='#a8f0c8';size=1.15}
    else if(res.m===0){label=T(r>.99?'pWall':'pOut');col='#c9b8a0'}
    addPop({x:s.x,y:s.y-L.R*.08,t:label,c:col,s:size,t0:now()});
  }
  p.st.darts++;G.left--;G.turn.push(res);if(res.n===25)p.st.bulls++;
  if(G.mode==='501')apply501(p,res);else if(G.mode==='cricket')applyCricket(p,res);else applyClock(p,res);
  sfx.chalk();
  if(G.online)NET.applied++;
  after();
}
function after(){
  if(G.winner){state='wait';later(finish,1500);return}
  if(G.bust||G.left<=0){const b=G.bust;G.bust=false;state='wait';later(endTurn,b?1500:1150);return}
  if(P().bot!=null&&!G.online){state='cpu';later(cpuStep,520)}else{state=isMine()?'aim':'remote';netPump()}
}
function endTurn(){
  const p=P();
  if(G.mode==='501'&&!G.wasBust){const tot=G.tstart-p.score;if(tot>p.st.best)p.st.best=tot}
  G.wasBust=false;
  if(!FAST){pulling=now();sfx.pull()}
  later(()=>{stuck=[];pulling=0;G.cur=(G.cur+1)%G.ps.length;G.turns++;
    if(G.turns%G.ps.length===0){G.round++;if(G.mode==='cricket'&&G.round>20){cricketByPoints();return}}
    beginTurn()},FAST?0:380);
}
function skipTurn(){ // chi non risponde online perde il turno
  const p=P();addPop({x:L.bx,y:L.by,t:T('netKick',p.name),c:'#ffb27a',s:.9,t0:now()});
  if(G.mode==='501')p.score=G.tstart;
  G.left=0;if(G.online)NET.applied++;state='wait';later(endTurn,FAST?0:900);
}
function apply501(p,res){
  const rem=p.score-res.v;
  if(rem<0||(G.dbl&&rem===1)||(rem===0&&G.dbl&&res.m!==2)){
    p.st.pts-=(G.tstart-p.score);p.score=G.tstart;G.bust=true;G.wasBust=true;
    showBanner(T('bust'),T(G.dbl&&rem===0?'bustDbl':'bustHi'),1300,'#ffb27a');sfx.bust();if(!FAST)shake=10;return}
  p.score=rem;p.st.pts+=res.v;
  if(rem===0){p.hist.push(G.tstart);G.winner=p;showBanner(T(res.ring==='db'?'shotBull':'shot'),T('shotSub',p.name,G.tstart),1500,'#ffe07a');sfx.cheer(true);confetti(160);return}
  if(G.left===0){p.hist.push(G.tstart);const tot=G.tstart-p.score;
    if(tot===180){p.st.t180++;showBanner(T('t180'),T('t180s'),1700,'#ffe07a');sfx.cheer(true);confetti(200);if(!FAST)shake=14}
    else if(tot>=140){showBanner(`${tot}!`,T('great'),1200,'#ffe07a');sfx.cheer(false);confetti(60)}
    else if(tot>=100){showBanner(`${tot}`,T('ton'),1000,'#ffe07a');sfx.cheer(false)}}
}
function applyCricket(p,res){
  if(!CR.includes(res.n)||res.m===0)return;
  const others=G.ps.filter(q=>q!==p);let gained=0,closedNow=false;
  for(let i=0;i<res.m;i++){if(p.marks[res.n]<3){p.marks[res.n]++;if(p.marks[res.n]===3)closedNow=true}else if(others.some(o=>o.marks[res.n]<3)){p.pts+=res.n;gained+=res.n}}
  if(gained)addPop({x:L.bx,y:L.by-L.R*.5,t:T('cPts',gained),c:'#ffe07a',s:1.1,t0:now()+200});
  if(closedNow)addPop({x:L.bx,y:L.by+L.R*.45,t:T('cClosed',res.n===25?T('bull'):res.n),c:'#a8f0c8',s:1.05,t0:now()+150});
  if(CR.every(n=>p.marks[n]>=3)&&others.every(o=>p.pts>=o.pts)){G.winner=p;showBanner(T('crWin'),T('crWinS',p.name),1500,'#ffe07a');sfx.cheer(true);confetti(160)}
}
function cricketByPoints(){
  const mk=p=>CR.reduce((s,n)=>s+p.marks[n],0);
  G.winner=G.ps.slice().sort((a,b)=>b.pts-a.pts||mk(b)-mk(a))[0];
  showBanner(T('crEnd'),T('crEndS'),1500,'#ffe07a');sfx.cheer(true);confetti(140);state='wait';later(finish,1600);
}
function applyClock(p,res){
  if(res.m===0||res.n!==p.clk)return;
  if(p.clk===25){G.winner=p;showBanner(T('clWin'),T('clWinS',p.name),1500,'#ffe07a');sfx.cheer(true);confetti(160);return}
  p.clk+=res.m;if(p.clk>20)p.clk=25;
  if(res.m>1)addPop({x:L.bx,y:L.by+L.R*.45,t:T('skip',res.m),c:'#a8f0c8',s:1.05,t0:now()+150});
}

/* ---------- personaggi al lancio ---------- */
function cpuTarget(p){
  const lv=BOTS[p.bot].lv;
  if(G.mode==='501'){const s=p.score;if(s<=180){const r=route(s,3,G.dbl);if(r){const d=r[0];return targetPoint(d.n,d.m,true)}}if(s>=62)return targetPoint(20,3);return targetPoint(Math.min(20,s-(G.dbl?32:0))||1,1,true)}
  if(G.mode==='cricket'){
    const others=G.ps.filter(q=>q!==p);const best=Math.max(...others.map(o=>o.pts));
    const scoring=CR.filter(n=>p.marks[n]>=3&&others.some(o=>o.marks[n]<3));
    if(scoring.length&&p.pts<=best&&(lv>0||Math.random()<.5)){const n=scoring[0];return n===25?targetPoint(25,2):targetPoint(n,3)}
    const open=CR.filter(n=>p.marks[n]<3);const n=open.length?open[0]:(scoring[0]||20);
    return n===25?targetPoint(25,lv===2?2:1):targetPoint(n,3);
  }
  const n=p.clk;if(n===25)return targetPoint(25,2);
  return lv===2?targetPoint(n,3):targetPoint(n,1,lv===1);
}
function cpuStep(){
  if(!G||G.winner||state!=='cpu')return;
  const p=P();const tgt=cpuTarget(p);const sig=BOTS[p.bot].sig;
  const fu=toU(L.bx+(Math.random()-.5)*L.R*.9,L.by+L.R*(.3+Math.random()*.4));
  cpuAim={from:fu,to:tgt,t0:now(),dur:650+Math.random()*300};
  later(()=>{if(state!=='cpu')return;const ls={x:tgt.x+gauss()*sig,y:tgt.y+gauss()*sig};cpuAim=null;throwDart(ls,W/2+(Math.random()-.5)*W*.2)},cpuAim.dur+180);
}

/* ---------- effetti ---------- */
function burst(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=60+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5+Math.random()*.5,t:0,c:cols[i%cols.length],sz:1.5+Math.random()*2.5,k:'spark'})}}
function confetti(n){if(FAST)return;const cols=['#9fd3ff','#a8f0c8','#cfb6f5','#ffd970','#fff3d0'];for(let i=0;i<n;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*60,vy:80+Math.random()*120,life:4+Math.random()*2,t:0,c:cols[i%5],sz:5+Math.random()*6,k:'conf',r:Math.random()*6,vr:(Math.random()-.5)*8})}
for(let i=0;i<26;i++)motes.push({x:Math.random(),y:Math.random(),v:.005+Math.random()*.012,s:.6+Math.random()*1.4,p:Math.random()*6});

/* ---------- disegno ---------- */
function drawDart(k,x,y,ang,len,alpha,shadow,thick){
  const im=IM[k];if(!im)return;const h=len*(im.height/im.width)*(thick||1.7);
  ctx.save();ctx.globalAlpha=alpha;
  if(shadow&&SH[k]){const sh=SH[k];ctx.save();ctx.translate(x+len*.12,y+len*.16);ctx.rotate(ang*Math.PI/180);ctx.scale(len/im.width,h/im.height*.9);ctx.globalAlpha=alpha*.55;ctx.drawImage(sh.c,-im.width-sh.p,-im.height/2-sh.p);ctx.restore()}
  ctx.translate(x,y);ctx.rotate(ang*Math.PI/180);ctx.drawImage(im,-len,-h/2,len,h);ctx.restore();
}
function drawAv(av,x,y,r){const im=IM['av_'+av];if(!im)return;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.clip();ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();ctx.strokeStyle='rgba(233,196,106,.85)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.stroke()}
function drawFrame(){
  const f=L.frame;const ix=f.x+f.w*.09,iy=f.y+f.h*.1626,iw=f.w*.8,ih=f.h*.709;

  if(photo){const s=Math.max(iw/photo.width,ih/photo.height);const w=photo.width*s,h=photo.height*s;ctx.save();ctx.beginPath();ctx.rect(ix,iy,iw,ih);ctx.clip();ctx.drawImage(photo,ix+(iw-w)/2,iy+(ih-h)*.3,w,h);
    const g=ctx.createLinearGradient(0,iy,0,iy+ih);g.addColorStop(0,'rgba(255,210,130,.18)');g.addColorStop(.4,'rgba(255,210,130,0)');g.addColorStop(1,'rgba(0,0,0,.25)');ctx.fillStyle=g;ctx.fillRect(ix,iy,iw,ih);ctx.restore()}
  else{const g=ctx.createLinearGradient(0,iy,0,iy+ih);g.addColorStop(0,'#3a2a3e');g.addColorStop(1,'#1a1220');ctx.fillStyle=g;ctx.fillRect(ix,iy,iw,ih);
    ctx.fillStyle='#e9c46a';ctx.textAlign='center';ctx.textBaseline='middle';const fs=Math.max(10,iw*.11);ctx.font=`italic ${fs}px ${SERIF}`;
    ctx.fillText('♥',ix+iw/2,iy+ih*.32);ctx.font=`${fs*.9}px ${SERIF}`;T('photo').forEach((l,i)=>ctx.fillText(l,ix+iw/2,iy+ih*.5+fs*1.1*i,iw*.92))}
  ctx.drawImage(IM.frame,f.x,f.y,f.w,f.h);
}
function slateArea(){if(L.land){const c=L.chalk;return{x:c.x+c.w*.19,y:c.y+c.h*.19,w:c.w*.62,h:c.h*.69}}const s=L.strip;return{x:s.x+s.h*.1,y:s.y+s.h*.1,w:s.w-s.h*.2,h:s.h*.8}}
function drawBoardPanel(){

  store.set('frec_mode',cfg.mode);store.set('frec_dbl',cfg.dbl);store.set('frec_tab',cfg.tab);store.set('frec_bots',cfg.bots);store.set('frec_local',cfg.local);
}
document.querySelectorAll('.modes .imgbtn').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;sfx.click();syncMenu()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cfg.tab=b.dataset.tab;sfx.click();syncMenu()});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('frec_lang',lang);sfx.click();syncMenu();if(!$('#net').classList.contains('hide'))netRender()});
$('#tDbl').onclick=()=>{cfg.dbl=!cfg.dbl;sfx.click();syncMenu()};
$('#bPlay').onclick=()=>{ac();sfx.click();if(cfg.tab==='net'){netOpenCreate();return}startLocal()};
$('#bAgain').onclick=()=>{sfx.click();if(G&&G.online){netStartGame();return}startLocal()};
function toMenu(){G=null;state='menu';stuck=[];flight=null;cpuAim=null;banner=null;$('#end').classList.add('hide');$('#hud').classList.add('hide');$('#net').classList.add('hide');$('#menu').classList.remove('hide');syncMenu()}
$('#bBack').onclick=()=>{sfx.click();if(G&&G.online){if(NET.host){netToLobby()}else{netLeave();toMenu()}return}toMenu()};
$('#bMenu').onclick=()=>{sfx.click();if(G&&G.online){netLeave()}toMenu()};
const sb=$('#bSnd');const syncSnd=()=>{sb.textContent=sound?'♪':'✕';sb.style.opacity=sound?1:.6};syncSnd();
sb.onclick=()=>{sound=!sound;store.set('frec_snd',sound);syncSnd();if(sound){ac();sfx.click()}};

/* ---------- input ---------- */
function inFrame(x,y){const f=L.frame;return x>f.x+f.w*.05&&x<f.x+f.w*.95&&y>f.y+f.h*.12&&y<f.y+f.h*.92}
cv.addEventListener('pointerdown',e=>{
  ac();
  if(inFrame(e.clientX,e.clientY)&&state!=='fly'){$('#pick').click();return}
  if(state!=='aim'||!G||!isMine())return;
  aim.on=true;aim.t0=now();aim.px=e.clientX;aim.py=e.clientY;aim.off=e.pointerType==='mouse'?0:-Math.min(80,L.R*.4);
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{if(aim.on){aim.px=e.clientX;aim.py=e.clientY}else if(e.pointerType==='mouse'){aim.hx=e.clientX;aim.hy=e.clientY}});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')aim.hx=-1});
cv.addEventListener('pointerup',()=>{
  if(!aim.on)return;aim.on=false;if(state!=='aim'||!G||!isMine())return;
  const r=reticleS();const u=toU(r.x,r.y);u.x+=gauss()*.012;u.y+=gauss()*.012;
  u.x=Math.round(u.x*1e4)/1e4;u.y=Math.round(u.y*1e4)/1e4;
  if(G.online)netThrow(u);
  throwDart(u,clamp(aim.px,W*.2,W*.8));
});
cv.addEventListener('pointercancel',()=>{aim.on=false});
window.addEventListener('resize',layout);
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- online: stanze con gli amici ----------
   Chi crea la stanza tiene l'elenco dei lanci e lo manda a tutti; ogni telefono rigioca gli stessi lanci,
   così il punteggio è uguale per tutti. I messaggi passano dagli stessi servizi MQTT pubblici del sito. */
const NET_TOPIC='handemiyy/fr1/';
const NET_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt','wss://mqtt.eclipseprojects.io:443/mqtt'];
const NET_LIBS=['https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js'];
const NET_CODE='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NET={client:null,code:null,b:null,me:null,host:false,view:null,applied:0,gid:null,players:[],ev:[],phase:'lobby',mode:'501',dbl:false,games:0,pingT:0,tick:0,lookT:0,entered:false,prepHost:null,online:false};
function netOk(){return /^https?:$/.test(location.protocol)&&!/(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com|claude\.site)$/i.test(location.hostname)}
const netRand=(n,ch)=>Array.from({length:n},()=>ch[Math.floor(Math.random()*ch.length)]).join('');
const netClean=s=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f]/g,'').trim().slice(0,14);
function netPid(code){let id=null;try{id=sessionStorage.getItem('frec-pid-'+code)}catch(e){}if(!id||!/^[a-z0-9]{10}$/.test(id)){id=netRand(10,'abcdefghijkmnopqrstuvwxyz23456789');try{sessionStorage.setItem('frec-pid-'+code,id)}catch(e){}}return id}
let netLib=null;
function netLoadLib(){if(window.mqtt&&window.mqtt.connect)return Promise.resolve(true);if(netLib)return netLib;netLib=(async()=>{for(const src of NET_LIBS){const okk=await new Promise(res=>{const s=document.createElement('script');s.src=src;s.async=true;const tm=setTimeout(()=>res(false),12000);s.onload=()=>{clearTimeout(tm);res(true)};s.onerror=()=>{clearTimeout(tm);s.remove();res(false)};document.head.appendChild(s)});if(okk&&window.mqtt&&window.mqtt.connect)return true}netLib=null;return false})();return netLib}
async function netConnect(b,will){const order=b!=null&&NET_BROKERS[b]?[b]:NET_BROKERS.map((_,i)=>i);for(const i of order){const client=await new Promise(res=>{let done=false,c=null;const fail=()=>{if(done)return;done=true;try{c.end(true)}catch(e){}res(null)};const tm=setTimeout(fail,9000);try{c=window.mqtt.connect(NET_BROKERS[i],{clientId:'hmf_'+netRand(12,'abcdefghijklmnopqrstuvwxyz0123456789'),clean:true,keepalive:25,connectTimeout:8000,reconnectPeriod:2500,will})}catch(e){clearTimeout(tm);res(null);return}c.once('connect',()=>{if(done)return;done=true;clearTimeout(tm);res(c)})});if(client)return{client,b:i}}return null}
const netTopic=k=>NET_TOPIC+NET.code+'/'+k;
function netPub(k,obj,retain){if(!NET.client)return;try{NET.client.publish(netTopic(k),obj==null?'':JSON.stringify(obj),{qos:1,retain:!!retain})}catch(e){}}
function netShow(mode){
  $('#menu').classList.add('hide');$('#end').classList.add('hide');$('#hud').classList.add('hide');$('#net').classList.remove('hide');
  ['nIntro','nWait','nErr','nRoom'].forEach(id=>$('#'+id).hidden=id!==mode);
}
function netOpenCreate(){netLeave();NET.prep='create';netShow('nIntro');$('#nSub').textContent=T('title');$('#nLead').textContent=T('netLeadCreate',T('mName')[cfg.mode]);$('#nGo').textContent=T('netCreate');$('#nName').value=store.get('frec_name','')||store.get('hm-net-name','')||'';setTimeout(()=>$('#nName').focus({preventScroll:true}),60)}
async function netOpenJoin(code,b){
  netLeave();NET.prep='join';NET.code=code;netShow('nWait');$('#nWaitT').textContent=T('netLook');$('#nSub').textContent=T('title');
  if(!(await netLoadLib())){netFail('netLib');return}
  const pid=netPid(code);const r=await netConnect(b,{topic:NET_TOPIC+code+'/in',payload:JSON.stringify({t:'bye',pid}),qos:1,retain:false});
  if(!r){netFail('netErr');return}
  Object.assign(NET,{client:r.client,b:r.b,code,me:pid,host:false,view:null,applied:0,gid:null,entered:false,online:true});
  netWire(r.client);r.client.subscribe([netTopic('st')],{qos:1});
  NET.lookT=setTimeout(()=>{if(!NET.view)netFail('netNotFound')},7000);
}
function netFail(k){const c=NET.client;NET.client=null;clearInterval(NET.pingT);clearInterval(NET.tick);clearTimeout(NET.lookT);try{c&&c.end(true)}catch(e){}netShow('nErr');$('#nErrT').textContent=T(k);$('#nRetry').hidden=k==='netNotFound';NET.err=k}
function netWire(client){
  client.on('message',(topic,payload)=>{
    if(NET.client!==client)return;let m=null;try{m=JSON.parse(new TextDecoder().decode(payload))}catch(e){return}
    if(!m||typeof m!=='object')return;const k=topic.slice((NET_TOPIC+NET.code+'/').length);
    if(NET.host){if(k==='in')netHostMsg(m)}else if(k==='st')netGuestState(m);
  });
  client.on('connect',()=>{if(NET.client!==client)return;NET.online=true;netRenderLink();if(NET.host)netPublish();else if(NET.entered)netPub('in',{t:'hello',pid:NET.me,name:NET.name})});
  client.on('offline',()=>{if(NET.client===client){NET.online=false;netRenderLink()}});
}
async function netGo(){
  const name=netClean($('#nName').value)||T('guest');store.set('frec_name',name);ac();sfx.click();
  if(NET.prep==='join'){
    if(!NET.client){netOpenJoin(NET.code,NET.b);return}
    NET.name=name;NET.entered=true;netShow('nWait');$('#nWaitT').textContent=T('netConn');
    netPub('in',{t:'hello',pid:NET.me,name});clearInterval(NET.pingT);NET.pingT=setInterval(()=>netPub('in',{t:'ping',pid:NET.me}),10000);return;
  }
  netShow('nWait');$('#nWaitT').textContent=T('netConn');
  if(!(await netLoadLib())){netFail('netLib');return}
  const code=netRand(5,NET_CODE),pid=netPid(code);
  NET.code=code;
  const r=await netConnect(null,{topic:NET_TOPIC+code+'/st',payload:JSON.stringify({closed:true,host:name}),qos:1,retain:true});
  if(!r){netFail('netErr');return}
  if($('#net').classList.contains('hide')){r.client.end(true);return}
  Object.assign(NET,{client:r.client,b:r.b,me:pid,host:true,name,players:[{pid,name,on:true,seen:Date.now()}],ev:[],phase:'lobby',mode:cfg.mode,dbl:cfg.dbl,games:0,gid:null,applied:0,seq:0,view:null,entered:true,online:true});
  netWire(r.client);r.client.subscribe(netTopic('in'),{qos:1});
  NET.tick=setInterval(netHostTick,1000);
  try{history.replaceState(null,'',location.pathname+'?room='+code+(NET.b?'&b='+NET.b:''))}catch(e){}
  netShow('nRoom');netPublish();
}
/* chi crea la stanza */
function netHostMsg(m){
  if(typeof m.pid!=='string'||!/^[a-z0-9]{10}$/.test(m.pid)||m.pid===NET.me)return;
  let p=NET.players.find(x=>x.pid===m.pid);
  if(m.t==='hello'){const name=netClean(m.name)||T('guest');
    if(p){p.on=true;p.seen=Date.now();p.name=name;netPublish();return}
    if(NET.players.length>=4){NET.reject=m.pid;netPublish();return}
    if(NET.phase!=='lobby'){NET.reject=m.pid;netPublish();return}
    NET.players.push({pid:m.pid,name,on:true,seen:Date.now()});sfx.turn();netPublish();return}
  if(!p)return;p.seen=Date.now();
  if(m.t==='ping'){if(!p.on){p.on=true;netPublish()}return}
  if(m.t==='bye'){if(NET.phase==='lobby')NET.players=NET.players.filter(x=>x!==p);else p.on=false;netPublish();return}
  if(!p.on){p.on=true}
  if(m.t==='throw'&&NET.phase==='play'&&G&&G.gid===NET.gid){const seat=NET.players.indexOf(p);const u=m.u;
    if(!u||typeof u.x!=='number'||typeof u.y!=='number'||!isFinite(u.x)||!isFinite(u.y))return;
    if(m.i!==NET.ev.length)return; // fuori ordine o doppio
    NET.ev.push({s:seat,x:clamp(u.x,-1.5,1.5),y:clamp(u.y,-1.5,1.5)});netPublish();netPump()}
}
function netHostTick(){
  if(!NET.host)return;let ch=false;
  NET.players.forEach(p=>{if(p.pid!==NET.me&&p.on&&Date.now()-p.seen>30000){p.on=false;ch=true}});
  if(NET.phase==='play'&&G&&!G.winner&&NET.applied===NET.ev.length&&state==='remote'){
    const p=NET.players[G.cur];if(p&&!p.on){if(!NET.awayT)NET.awayT=Date.now();if(Date.now()-NET.awayT>8000){NET.awayT=0;NET.ev.push({s:G.cur,k:'skip'});ch=true;netPump()}}else NET.awayT=0;
  }
  if(ch)netPublish();
}
function netPublish(){
  if(!NET.host)return;NET.seq=(NET.seq||0)+1;
  const st={v:1,seq:NET.seq,code:NET.code,phase:NET.phase,mode:NET.mode,dbl:NET.dbl,gid:NET.gid,first:NET.first||0,host:NET.name,
    players:NET.players.map(p=>({pid:p.pid,name:p.name,on:p.on})),ev:NET.ev,reject:NET.reject||null};
  netPub('st',st,true);NET.reject=null;
  netHostView(st);
}
function netHostView(st){NET.view=st;if(NET.phase==='lobby'&&!$('#net').classList.contains('hide'))netRender();}
function netStartGame(){
  if(!NET.host)return;
  NET.players=NET.players.filter(p=>p.on||p.pid===NET.me);
  if(NET.players.length<2){netToLobby();return}
  NET.games++;NET.gid=netRand(6,NET_CODE);NET.first=(NET.games-1)%NET.players.length;NET.ev=[];NET.phase='play';
  netPublish();netBeginLocal(NET.view);
}
function netToLobby(){if(!NET.host)return;NET.phase='lobby';NET.gid=null;NET.ev=[];netPublish();G=null;netShow('nRoom');netRender()}
/* tutti: dalla stanza alla partita */
function netBeginLocal(st){
  const me=st.players.findIndex(p=>p.pid===NET.me);
  G=makeGame({mode:st.mode,dbl:st.mode==='501'&&st.dbl,players:st.players.map((p,i)=>({name:p.name,av:'p'+(i+1),bot:null})),first:st.first,online:true,me,gid:st.gid});
  NET.applied=0;NET.gid=st.gid;
  enterGame();
}
function netGuestState(st){
  clearTimeout(NET.lookT);
  if(st.closed){if(NET.view||NET.entered){netGoneMsg(st.host||'')}else netFail('netNotFound');return}
  if(typeof st.seq!=='number')return;
  const first=!NET.view;NET.view=st;
  const inRoom=st.players.some(p=>p.pid===NET.me);
  if(!NET.entered){
    if(inRoom){NET.entered=true;NET.name=st.players.find(p=>p.pid===NET.me).name;clearInterval(NET.pingT);NET.pingT=setInterval(()=>netPub('in',{t:'ping',pid:NET.me}),10000);netPub('in',{t:'hello',pid:NET.me,name:NET.name})}
    else{if(first){netShow('nIntro');$('#nLead').textContent=T('netLeadJoin',st.host,NET.code);$('#nGo').textContent=T('netEnter');$('#nName').value=store.get('frec_name','')||store.get('hm-net-name','')||''}return}
  }
  if(!inRoom){if(st.reject===NET.me||st.phase!=='lobby'){netFail(st.players.length>=4?'netFull':'netStarted')}return}
  if(st.phase==='lobby'){if(G){G=null;state='menu'}netShow('nRoom');netRender();return}
  if(st.phase==='play'){
    if(!G||G.gid!==st.gid){FAST=true;netBeginLocal(st);FAST=false;state=isMine()?'aim':'remote'}
    netPump();
  }
}
function netGoneMsg(name){netLeave();toMenu();banner=null;setTimeout(()=>{$('#menu').classList.add('hide');netShow('nErr');$('#nErrT').textContent=T('netGone',name);$('#nRetry').hidden=true},50)}
function netThrow(u){
  if(NET.host){NET.ev.push({s:G.cur,x:u.x,y:u.y});netPublish();return}
  netPub('in',{t:'throw',pid:NET.me,i:NET.applied,u});
  NET.ev=(NET.view&&NET.view.ev||[]).slice(0,NET.applied).concat([{s:G.cur,x:u.x,y:u.y}]);
}
// rigioca i lanci arrivati: all'istante se siamo indietro, con l'animazione se è l'ultimo
let PUMPING=false;
function netPump(){
  if(PUMPING||!G||!G.online||G.winner)return;
  const ev=NET.host?NET.ev:((NET.view&&NET.view.ev)||[]);
  if(NET.applied>=ev.length)return;
  if(!(state==='remote'||state==='aim'))return;
  const behind=ev.length-NET.applied;
  PUMPING=true;
  if(behind>1){const wasFast=FAST;FAST=true;let guard=600;while(G&&!G.winner&&NET.applied<ev.length-1&&guard--){netDo(ev[NET.applied])}FAST=wasFast;stuck=[];banner=null;popups=[];
    if(G&&G.winner){PUMPING=false;state='wait';if(!FAST)finish();return}
    if(G)state=isMine()?'aim':'remote'}
  PUMPING=false;
  if(!G||G.winner||NET.applied>=ev.length||FAST)return;
  netDo(ev[NET.applied]);
}
function netDo(e){
  if(e.s!==G.cur){NET.applied++;return}
  if(e.k==='skip'){skipTurn();return}
  throwDart({x:e.x,y:e.y},W/2);
}
function netLeave(){
  const c=NET.client;if(!c){NET.code=null;return}
  clearInterval(NET.pingT);clearInterval(NET.tick);clearTimeout(NET.lookT);
  try{if(NET.host)c.publish(netTopic('st'),JSON.stringify({closed:true,host:NET.name}),{qos:1,retain:true});else if(NET.entered)c.publish(netTopic('in'),JSON.stringify({t:'bye',pid:NET.me}),{qos:1})}catch(e){}
  setTimeout(()=>{try{c.end()}catch(e){}},500);
  Object.assign(NET,{client:null,host:false,view:null,entered:false,code:null,players:[],ev:[],gid:null});
  try{if(/[?&]room=/.test(location.search))history.replaceState(null,'',location.pathname)}catch(e){}
}
function netLink(){return location.origin+location.pathname+'?room='+NET.code+(NET.b?'&b='+NET.b:'')}
function netRenderLink(){if(!NET.code)return;$('#nLink').textContent=netLink().replace(/^https?:\/\//,'');$('#nCode').textContent=NET.code;$('#nDot').classList.toggle('off',!NET.online)}
function netRender(){
  const v=NET.view;if(!v)return;netRenderLink();
  $('#nSub').textContent=T('title')+' · '+T('mName')[v.mode]+(v.mode==='501'&&v.dbl?' · D':'');
  $('#nInvite').hidden=!NET.host;$('#nShare').textContent=navigator.share?T('netShare'):T('netCopy');$('#nCopy').hidden=!navigator.share;
  const ul=$('#nPlayers');ul.textContent='';
  for(let i=0;i<4;i++){const p=v.players[i];const li=document.createElement('li');li.className=p?(p.on?'':'off'):'free';
    li.innerHTML=(p?`<img src="${AV['p'+(i+1)]}" alt="">`:'<span style="width:36px"></span>')+'<span><b></b><small></small></span>';
    li.querySelector('b').textContent=p?p.name:T('netFree');
    const tags=[];if(p&&p.pid===NET.me)tags.push(T('netYou'));if(p&&i===0)tags.push(T('netHostTag'));if(p&&!p.on)tags.push(T('netOff'));li.querySelector('small').textContent=tags.join(' · ');ul.appendChild(li)}
  const mb=$('#nModes');mb.textContent='';
  if(NET.host){['501','cricket','clock'].forEach(m=>{const b=document.createElement('button');b.className='chip'+(NET.mode===m?' sel':'');b.textContent=T('mName')[m];b.onclick=()=>{NET.mode=m;cfg.mode=m;sfx.click();netPublish()};mb.appendChild(b)});
    const d=document.createElement('button');d.className='chip'+(NET.dbl?' sel':'');d.textContent=T('dbl');d.hidden=NET.mode!=='501';d.onclick=()=>{NET.dbl=!NET.dbl;cfg.dbl=NET.dbl;sfx.click();netPublish()};mb.appendChild(d)}
  const enough=v.players.filter(p=>p.on).length>=2;
  $('#nStart').hidden=!NET.host;$('#nStart').disabled=!enough;
  $('#nStatus').textContent=NET.host?T(enough?'netReady':'netNeed2'):T('netWaitHost',v.host||'');
}
$('#nGo').onclick=netGo;
$('#nName').addEventListener('keydown',e=>{if(e.key==='Enter')netGo()});
$('#nBack').onclick=()=>{sfx.click();netLeave();toMenu()};
$('#nRetry').onclick=()=>{if(NET.prep==='join'&&NET.code)netOpenJoin(NET.code,NET.b);else netOpenCreate()};
$('#nStart').onclick=()=>{ac();sfx.click();netStartGame()};
async function netCopy(){const url=netLink();let okk=false;try{await navigator.clipboard.writeText(url);okk=true}catch(e){const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{okk=document.execCommand('copy')}catch(err){}ta.remove()}if(okk){$('#nStatus').textContent=T('netCopied');sfx.ding(false)}}
$('#nCopy').onclick=netCopy;
$('#nShare').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Handemiyy',text:T('netShareText'),url:netLink()});return}catch(e){if(e&&e.name==='AbortError')return}}netCopy()};
window.addEventListener('pagehide',()=>{if(NET.client)netLeave()});

/* ---------- avvio ---------- */
let loaded=0;const keys=Object.keys(SRC);
keys.forEach(k=>{const im=new Image();im.onload=im.onerror=()=>{if(++loaded===keys.length)boot()};im.src=SRC[k];IM[k]=im});
function boot(){
  makeShadows();layout();syncMenu();requestAnimationFrame(frame);
  const q=new URLSearchParams(location.search);const room=(q.get('room')||'').toUpperCase();
  if(room&&/^[A-Z0-9]{5}$/.test(room)&&netOk()){const b=parseInt(q.get('b'),10);netOpenJoin(room,isNaN(b)?null:b)}
}
window.__dbg={get G(){return G},get state(){return state},scoreAt,targetPoint,throwDart:u=>throwDart(u),route,L:()=>L,cfg,NET};
}
