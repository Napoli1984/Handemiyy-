<title>Crucimondo · Handemiyy</title>

<style>
/* Layout: a one-screen game over an illustrated scene that changes with each world. Home scrolls one column
   (logo, daily card, special games, world cards); a world is a climbing path of six levels; play stacks header,
   secret word, board, clue bar and keyboard, with the clue list beside the board on wide screens. One light look, by choice. */
:root {
  --ink: #1c2541; --ink-2: #4b5675; --ink-3: #8b93aa;
  --tile: #fffcf5; --tile-2: #efe6d6; --edge: rgba(96, 74, 40, .17);
  --glass: rgba(255, 255, 255, .82); --glass-2: rgba(255, 255, 255, .5); --line: rgba(255, 255, 255, .9);
  --gold: #f3b931; --gold-2: #ffe7a6; --gold-d: #875700; --warn: #f29b38; --warn-l: #ffe3c2;
  --acc: #4d7de0; --acc-d: #3460c0; --acc-l: #e2eaff;
  --sh: 28 37 65;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; background: #fbeee6; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { height: 100%; margin: 0; overflow: hidden; background: #fbeee6; color: var(--ink); font: 500 15px/1.4 var(--f-ui); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, .cell:focus-visible { outline: 3px solid var(--acc-d); outline-offset: 2px; }
.i { width: 22px; height: 22px; flex: none; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#app { position: relative; z-index: 1; height: 100%; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shared pieces ---------- */
.chip { height: 40px; min-width: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 16px/1 var(--f-display); color: var(--ink); box-shadow: 0 8px 18px -12px rgba(var(--sh) / .5); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip .i { width: 21px; height: 21px; }
.chip.coins { cursor: default; }
#play .chip.coins { padding: 0 11px 0 8px; gap: 5px; }
.chip.bump { animation: bump .45s ease; }
@keyframes bump { 35% { transform: scale(1.14); } }
.icon-btn { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: grid; place-items: center; color: var(--ink); box-shadow: 0 8px 18px -12px rgba(var(--sh) / .5); cursor: pointer; position: relative; }
.bar { flex: none; display: flex; align-items: center; gap: 10px; padding-block: 12px 8px; }
.titles { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.titles b { font: 600 20px/1.15 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titles small { font: 600 13px/1.3 var(--f-ui); color: var(--ink-2); display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.titles small .i { width: 16px; height: 16px; }
#pSubL { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pClock { flex: none; }
.btn { border: 0; border-radius: 999px; padding: 13px 22px; font: 600 17px/1 var(--f-display); cursor: pointer; background: linear-gradient(180deg, var(--acc), var(--acc-d)); color: #fff; box-shadow: 0 4px 0 rgba(var(--sh) / .22), 0 12px 22px -12px var(--acc-d); touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(var(--sh) / .22); }
.btn.soft { background: var(--acc-l); color: var(--acc-d); box-shadow: 0 3px 0 rgba(var(--sh) / .12); }
.btn.gold { background: linear-gradient(180deg, #ffd765, var(--gold)); color: var(--gold-d); box-shadow: 0 4px 0 #c98b12, 0 12px 22px -12px #c98b12; }

/* ---------- home ---------- */
#home { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 14px 30px; }
.wrap { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; flex-direction: column; gap: 5px; padding-top: 2px; }
.logo .lr { display: flex; gap: 4px; }
.logo .lr + .lr { margin-left: 24px; }
.lt { --r: 0deg; width: 33px; height: 37px; border-radius: 9px; display: grid; place-items: center; font: 600 22px/1 var(--f-display); color: var(--ink); background: linear-gradient(180deg, #fff, var(--tile) 55%, var(--tile-2)); box-shadow: inset 0 -3px 0 var(--edge), 0 3px 0 rgba(120, 96, 60, .2), 0 8px 14px -8px rgba(var(--sh) / .5); transform: rotate(var(--r)); animation: bob 4s ease-in-out infinite; }
.lt.g { background: linear-gradient(180deg, #fff3cc, var(--gold-2) 45%, var(--gold)); color: var(--gold-d); }
.lt.a { background: linear-gradient(180deg, #8fb2ff, var(--acc)); color: #fff; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(var(--r)); } }
.chips { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.tagline { margin: -4px 0 0; max-width: 34em; font: 600 16px/1.45 var(--f-ui); color: var(--ink-2); text-wrap: pretty; }
.sec-t { margin: 4px 0 -6px; font: 600 21px/1.2 var(--f-display); color: var(--ink); text-wrap: balance; }

.daily { width: 100%; border: 1px solid var(--line); border-radius: 26px; padding: 14px; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; background: linear-gradient(135deg, rgba(255, 255, 255, .93), rgba(255, 246, 228, .9)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 22px 40px -26px rgba(var(--sh) / .65); }
.cal { flex: none; width: 66px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 2px 0 rgba(120, 96, 60, .18), 0 10px 18px -10px rgba(var(--sh) / .5); text-align: center; }
.cal i { display: block; font: 700 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: #fff; padding: 6px 0 5px; background: linear-gradient(180deg, #f8b84a, #e28e1c); font-style: normal; }
.cal b { display: block; font: 600 34px/1 var(--f-display); padding: 7px 0 9px; color: var(--ink); font-variant-numeric: tabular-nums; }
.d-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.d-txt b { font: 600 19px/1.15 var(--f-display); }
.d-txt small { font: 600 13px/1.3 var(--f-ui); color: var(--ink-2); }
.week { display: flex; gap: 5px; }
.week span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 10.5px/1 var(--f-ui); color: var(--ink-3); background: rgba(28, 37, 65, .06); }
.week span.on { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-d); }
.week span.now { box-shadow: 0 0 0 2px #e28e1c; color: var(--ink); }
.d-go { flex: none; align-self: center; padding: 11px 16px; border-radius: 999px; font: 600 16px/1 var(--f-display); color: #fff; background: linear-gradient(180deg, #f8b84a, #e28e1c); box-shadow: 0 3px 0 #b86d12; white-space: nowrap; }
.d-go.done { background: #eef0f4; color: var(--ink-2); box-shadow: none; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mode { border: 1px solid var(--line); border-radius: 22px; padding: 12px 11px 11px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; cursor: pointer; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 16px 30px -24px rgba(var(--sh) / .7); min-width: 0; }
.mode svg { width: 42px; height: 42px; }
.mode b { font: 600 16px/1.15 var(--f-display); }
.mode small { font: 500 12.5px/1.3 var(--f-ui); color: var(--ink-2); }
.mode em { margin-top: auto; font: 700 11.5px/1 var(--f-ui); font-style: normal; color: var(--ink-3); letter-spacing: .02em; }

.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
.wcard { --c: var(--acc); --cd: var(--acc-d); position: relative; border: 0; padding: 0; border-radius: 22px; overflow: hidden; background: #fff; text-align: left; cursor: pointer; box-shadow: 0 0 0 1px rgba(255, 255, 255, .9), 0 16px 30px -22px rgba(var(--sh) / .75); display: flex; flex-direction: column; }
.wcard canvas { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; }
.wcard .wt { padding: 9px 12px 12px; display: flex; flex-direction: column; gap: 7px; }
.wcard b { font: 600 17px/1.15 var(--f-display); color: var(--ink); }
.wmeta { display: flex; align-items: center; gap: 5px; font: 700 12.5px/1 var(--f-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wmeta .i { width: 15px; height: 15px; }
.wmeta .cr { margin-left: auto; color: var(--gold-d); }
.wbar { height: 6px; border-radius: 9px; background: #eef0f4; overflow: hidden; }
.wbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--c), var(--cd)); }
.backlink { align-self: flex-start; display: inline-flex; align-items: center; gap: 3px; margin-bottom: -6px; padding: 6px 13px 6px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 8px 18px -12px rgba(var(--sh) / .5); font: 600 14px/1 var(--f-ui); color: var(--ink-2); text-decoration: none; }
.backlink .i { width: 18px; height: 18px; }
.packlink { width: 100%; display: flex; align-items: center; gap: 13px; padding: 10px 14px; border-radius: 18px; text-align: left; text-decoration: none; background: linear-gradient(135deg, #fff8e2, #ffe6a6); box-shadow: inset 0 0 0 1.5px #efc35a, 0 12px 22px -16px #c98b12; animation: rise .5s .5s cubic-bezier(.2, .9, .3, 1.25) both; }
.packlink .pk-ic { flex: none; width: 38px; height: 46px; border-radius: 7px; display: grid; place-items: center; transform: rotate(-7deg); font: italic 700 22px/1 Georgia, 'Times New Roman', serif; color: #a87412; background: linear-gradient(160deg, #fffdf6, #f3d993); box-shadow: inset 0 0 0 1.5px #dcae48, 0 4px 8px -4px rgba(150, 100, 20, .6); }
.packlink .pk-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.packlink b { font: 600 17px/1.15 var(--f-display); color: var(--ink); }
.packlink small { font: 700 12.5px/1.2 var(--f-ui); color: var(--gold-d); }
.foot { margin: 6px 0 0; font: 500 12.5px/1.5 var(--f-ui); color: var(--ink-2); max-width: 40em; }

/* ---------- world: a path of six levels ---------- */
.wscroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
.path { position: relative; width: min(420px, 100%); margin: 0 auto; }
.trail { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.node { position: absolute; width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; color: #fff; background: radial-gradient(ellipse 46% 34% at 38% 24%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0)), linear-gradient(180deg, var(--acc), var(--acc-d)); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .12), 0 0 0 6px rgba(255, 255, 255, .9), 0 16px 26px -12px var(--acc-d); }
.node b { font: 700 34px/1 var(--f-display); text-shadow: 0 2px 0 var(--acc-d), 0 0 10px rgba(0, 0, 0, .12); }
.node.done { background: radial-gradient(ellipse 46% 34% at 38% 24%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0)), linear-gradient(180deg, #ffd45e, #e3a01c); }
.node.done b { color: #fff; text-shadow: 0 2px 0 #a86f05, 0 0 10px rgba(120, 70, 0, .2); }
.node.lock { cursor: default; color: var(--ink-3); background: radial-gradient(circle at 34% 28%, #fff, #eceaf1 60%, #d9d6e2); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .06), 0 0 0 6px rgba(255, 255, 255, .75); }
.node.lock .i { width: 26px; height: 26px; }
.node.next::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 3px solid var(--acc); opacity: .6; animation: ring 1.8s ease-out infinite; }
@keyframes ring { 0% { transform: scale(.82); opacity: .7; } 100% { transform: scale(1.12); opacity: 0; } }
.node .st { position: absolute; top: 100%; left: 50%; transform: translate(-50%, 12px); display: flex; gap: 1px; }
.node .st .i { width: 19px; height: 19px; }
.node .tag { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 6px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font: 700 12.5px/1 var(--f-ui); color: var(--ink-2); box-shadow: 0 8px 16px -12px rgba(var(--sh) / .6); }
.node .tag.r { left: calc(100% + 16px); }
.node .tag.l { right: calc(100% + 16px); }
.node .tag em { font-style: normal; color: var(--acc-d); }

/* ---------- play ---------- */
.pbody { flex: 1; min-height: 0; display: flex; gap: 22px; justify-content: center; }
.pmain { flex: 1; min-width: 0; max-width: 600px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; }
.pside { display: none; width: 330px; flex: none; align-self: flex-start; max-height: calc(100% - 14px); overflow-y: auto; padding: 8px 8px 14px; border-radius: 24px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 18px 36px -26px rgba(var(--sh) / .6); }
.hintbtn { color: #9a6400; background: linear-gradient(180deg, #fff8dd, #ffe7a3); }
.hintbtn .badge { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--acc); color: #fff; font: 700 11px/19px var(--f-ui); text-align: center; font-style: normal; box-shadow: 0 0 0 2px #fff; }

.secret { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 13px; border-radius: 18px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 10px 22px -18px rgba(var(--sh) / .6); cursor: pointer; text-align: left; width: 100%; }
.sx-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sx-l b { font: 700 11.5px/1.2 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--acc-d); }
.sx-l span { font: 600 13px/1.25 var(--f-ui); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sx-l span.emo { font-size: 20px; line-height: 1.15; }
.sx-s { flex: none; display: flex; gap: 4px; }
.sx-s i { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; font: 600 15px/1 var(--f-display); font-style: normal; color: var(--ink); background: #fff; box-shadow: inset 0 0 0 2px var(--acc-l), 0 2px 0 rgba(var(--sh) / .08); }
.sx-s i.ok { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-d); box-shadow: 0 2px 0 #c98b12; }
.sx-s i.cur { box-shadow: inset 0 0 0 2px var(--acc); }
.secret.long .sx-s { gap: 3px; }
.secret.long .sx-s i { width: 24px; height: 24px; font-size: 13.5px; }
.secret.guess { box-shadow: 0 0 0 3px var(--acc), 0 10px 22px -18px rgba(var(--sh) / .6); }
.secret.won .sx-l b { color: var(--gold-d); }
.secret.no { animation: shake .45s; }

.stage { flex: 1; min-height: 0; position: relative; }
.board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 22px; background: rgba(255, 255, 255, .3); border: 1px solid rgba(255, 255, 255, .78); -webkit-backdrop-filter: blur(8px) saturate(1.15); backdrop-filter: blur(8px) saturate(1.15); box-shadow: 0 26px 50px -32px rgba(var(--sh) / .7), inset 0 1px 0 rgba(255, 255, 255, .6); touch-action: manipulation; }
.cell { --t: 32px; position: absolute; width: var(--t); height: var(--t); border-radius: calc(var(--t) * .22); display: grid; place-items: center; cursor: pointer; user-select: none; -webkit-user-select: none; font: 600 calc(var(--t) * .56)/1 var(--f-display); color: var(--ink); background: linear-gradient(180deg, #fff 0%, var(--tile) 55%, var(--tile-2) 100%); box-shadow: inset 0 -2px 0 var(--edge), 0 2px 0 rgba(120, 96, 60, .2), 0 7px 10px -7px rgba(var(--sh) / .5); transition: transform .14s ease, background .18s ease, color .18s ease; }
.cell .n { position: absolute; left: 11%; top: 8%; font: 800 calc(var(--t) * .2)/1 var(--f-ui); color: rgba(28, 37, 65, .48); }
.cell .l { display: block; }
.cell.giv { color: var(--ink-2); background: linear-gradient(180deg, #fbf8f2, #ece4d4); }
.cell.hin { color: var(--acc-d); }
.cell.w { background: linear-gradient(180deg, #fff, var(--acc-l)); }
.cell.ok { color: var(--gold-d); background: linear-gradient(180deg, #fff5d6 0%, var(--gold-2) 48%, var(--gold) 100%); box-shadow: inset 0 -2px 0 rgba(150, 92, 0, .25), 0 2px 0 rgba(160, 104, 10, .35), 0 7px 10px -7px rgba(160, 104, 10, .6); }
.cell.ok .n { color: rgba(135, 87, 0, .6); }
.cell.w.ok { box-shadow: 0 0 0 2px var(--acc), 0 2px 0 rgba(160, 104, 10, .35); }
.cell.c { z-index: 2; color: #fff; transform: translateY(-2px) scale(1.06); background: linear-gradient(180deg, var(--acc), var(--acc-d)); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .14), 0 3px 0 rgba(var(--sh) / .2), 0 10px 16px -8px var(--acc-d); }
.cell.c .n { color: rgba(255, 255, 255, .78); }
.cell.c.ok { color: var(--gold-d); background: linear-gradient(180deg, #fff5d6, var(--gold-2) 48%, var(--gold)); box-shadow: 0 0 0 3px var(--acc), 0 10px 16px -8px var(--acc-d); }
.cell.sec::before { content: ""; position: absolute; inset: 10%; border-radius: 50%; border: 2px solid var(--acc); opacity: .5; pointer-events: none; }
.cell.c.sec::before { border-color: #fff; opacity: .75; }
.cell.ok.sec::before { border-color: var(--gold-d); opacity: .45; }
.cell.bad { animation: shake .45s ease; color: #8a4b00; background: linear-gradient(180deg, #fff, var(--warn-l)); box-shadow: 0 0 0 2px var(--warn), 0 7px 10px -7px rgba(var(--sh) / .5); }
.cell.bad .n { color: rgba(138, 75, 0, .55); }
.cell.pop .l { animation: pop .22s ease; }
.cell.flip { animation: flip .5s ease both; }
.plus { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); font: 700 19px/1 var(--f-display); color: var(--gold-d); text-shadow: 0 1px 0 #fff, 0 0 8px #fff; white-space: nowrap; animation: plus 1s ease-out forwards; }
@keyframes plus { 0% { transform: translate(-50%, -30%) scale(.5); opacity: 0; } 20% { transform: translate(-50%, -90%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg) scale(.96); } 100% { transform: rotateX(0); } }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

.cluebar { flex: none; display: flex; align-items: stretch; gap: 6px; min-height: 58px; }
.cb-nav { width: 40px; flex: none; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: grid; place-items: center; cursor: pointer; color: var(--acc-d); }
.cb-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 10px 22px -18px rgba(var(--sh) / .6); text-align: left; cursor: pointer; }
.cb-tag { flex: none; padding: 5px 8px; border-radius: 10px; background: linear-gradient(180deg, var(--acc), var(--acc-d)); color: #fff; font: 600 15px/1 var(--f-display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cluebar.done .cb-tag { background: linear-gradient(180deg, #ffd765, var(--gold)); color: var(--gold-d); }
.cb-txt { min-width: 0; font: 600 15.5px/1.28 var(--f-ui); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    st.forEach((s0, j) => { if (j < stars) setTimeout(() => { s0.classList.add('on'); SFX.star(j); }, 260 + j * 300); else s0.classList.add('on'); });
    setTimeout(() => { const f = $('.btn', bx); if (f) f.focus({ preventScroll: true }); }, 60);
  }
  function startMode(kind) {
    const key = lang + ':' + kind;
    let cur = S.cur[key];
    if (!cur || typeof cur.seed !== 'number') {
      cur = { seed: Math.floor(Math.random() * 2147483000) + 1 };
      if (kind === 'quick') cur.theme = CM_THEMES[Math.floor(Math.random() * CM_THEMES.length)].id;
      S.cur[key] = cur; save();
    }
    if (kind === 'quick' && !TH[cur.theme]) cur.theme = CM_THEMES[0].id;
    startPlay({ kind, seed: cur.seed, theme: cur.theme });
  }

  /* ---------- small overlays ---------- */
  let toastT = 0;
  function toast(msg, kind) {
    const e = $('#toast'); e.textContent = msg; e.className = 'toast ' + (kind || ''); void e.offsetWidth; e.className = 'toast on ' + (kind || '');
    clearTimeout(toastT); toastT = setTimeout(() => { e.className = 'toast ' + (kind || ''); }, 1900);
  }
  function closePops() { $('#hintPop').hidden = true; $('#sheet').hidden = true; }
  function openList() { if (!G) return; $('#shTitle').textContent = t('clues'); renderList($('#clList')); $('#sheet').hidden = false; }
  function showCoach() {
    const art = $('#coachArt'); art.innerHTML = '';
    const word = lang === 'tr' ? 'SELAM' : 'CIAO';
    Array.from(word).forEach((c, i) => { const s = el('span', 'lt' + (i >= word.length - 2 ? ' g' : ''), c); s.style.setProperty('--r', (i % 2 ? 3 : -3) + 'deg'); s.style.animationDelay = -i * 0.4 + 's'; art.appendChild(s); });
    $('#coachTxt').textContent = t('coach'); $('#coachOk').textContent = t('coachOk');
    $('#coach').hidden = false;
  }
  const fx = $('#fx');
  let parts = [], fxOn = false;
  function burst(k) {
    if (RM.matches) return;
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = Math.round(w * dpr); fx.height = Math.round(h * dpr);
    const acc = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#4d7de0';
    const cols = ['#f5bd3c', '#ffe08a', '#f58fc0', '#b49cf5', '#6cc3f2', '#7ed9b0', acc];
    for (let i = 0, n = Math.round(150 * k); i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9, v = 380 + Math.random() * 540;
      parts.push({ x: w / 2 + (Math.random() - 0.5) * w * 0.3, y: h * 0.62, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, s: 5 + Math.random() * 6, c: cols[i % cols.length], life: 1 + Math.random() * 0.6 });
    }
    if (fxOn) return;
    fxOn = true;
    const g = fx.getContext('2d');
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
      parts = parts.filter((p) => p.life > 0 && p.y < h + 40);
      parts.forEach((p) => { p.vy += 900 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt * 0.55; g.save(); g.globalAlpha = Math.min(1, p.life); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6); g.restore(); });
      if (parts.length) requestAnimationFrame(loop); else { g.clearRect(0, 0, w, h); fxOn = false; }
    };
    requestAnimationFrame(loop);
  }

  /* ---------- wiring ---------- */
  $('#board').addEventListener('pointerdown', (e) => { const d = e.target.closest('.cell'); if (!d || !G) return; e.preventDefault(); audio(); tap(+d.dataset.i); });
  $('#kb').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.key'); if (!b) return;
    e.preventDefault(); audio();
    const k = b.dataset.k; b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 110);
    if (k === 'del') back(); else if (k === 'swap') swapDir(); else typeCh(k);
  });
  function normKey(k, L) {
    if (L === 'tr') { const u = k.toLocaleUpperCase('tr-TR'); return /^[ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ]$/.test(u) ? u : null; }
    const u = k.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase(); return /^[A-Z]$/.test(u) ? u : null;
  }
  document.addEventListener('keydown', (e) => {
    if (screen !== 'play' || !G || !$('#end').hidden || !$('#coach').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'Escape') { if (G.guess != null) { G.guess = null; render(); } closePops(); return; }
    if (!$('#sheet').hidden) return;
    if (k === 'Backspace') { e.preventDefault(); back(); return; }
    if (k.indexOf('Arrow') === 0) { e.preventDefault(); arrow(k); return; }
    if (k === 'Tab' || k === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); return; }
    if (k === ' ') { e.preventDefault(); swapDir(); return; }
    if (k.length === 1) { const ch = normKey(k, G.o.ansLang); if (ch) { e.preventDefault(); typeCh(ch); } }
  });
  $('#pSecret').addEventListener('click', startGuess);
  $('#cPrev').addEventListener('click', () => { SFX.tap(); step(-1); });
  $('#cNext').addEventListener('click', () => { SFX.tap(); step(1); });
  $('#cMain').addEventListener('click', () => { SFX.tap(); openList(); });
  $('#shClose').addEventListener('click', () => { $('#sheet').hidden = true; });
  $('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
  $('#pHint').addEventListener('click', () => {
    const p = $('#hintPop');
    if (!p.hidden) { p.hidden = true; return; }
    if (!G || G.over) return;
    clearTimeout(toastT); $('#toast').className = 'toast';
    $('#hLetterT').textContent = t('hLetter'); $('#hWordT').textContent = t('hWord'); $('#hListT').textContent = t('hList');
    const lc = $('#hLetterC'); if (G.free > 0) { lc.textContent = t('free'); lc.classList.add('free'); } else { lc.innerHTML = ico('coin') + COST.letter; lc.classList.remove('free'); }
    $('#hWordC').innerHTML = ico('coin') + COST.word; $('#hNote').textContent = t('hNote');
    p.hidden = false; SFX.tap();
  });
  $('#hLetter').addEventListener('click', hintLetter);
  $('#hWord').addEventListener('click', hintWord);
  $('#hList').addEventListener('click', () => { closePops(); openList(); });
  document.addEventListener('pointerdown', (e) => { const p = $('#hintPop'); if (!p.hidden && !p.contains(e.target) && !e.target.closest('#pHint')) p.hidden = true; });
  $('#pBack').addEventListener('click', () => { SFX.tap(); const sp = G && G.spec; stopPlay(); if (sp && sp.kind === 'level') openWorld(sp.theme); else renderHome(); });
  $('#wBack').addEventListener('click', () => { SFX.tap(); renderHome(); });
  $('#daily').addEventListener('click', () => { const k = dkey(new Date()); if ((S.daily[lang] || {})[k] != null) { toast(t('tomorrow')); return; } audio(); SFX.tap(); startPlay({ kind: 'daily', date: k }); });
  $('#mEmoji').addEventListener('click', () => { audio(); SFX.tap(); startMode('emoji'); });
  $('#mBi').addEventListener('click', () => { audio(); SFX.tap(); startMode('bi'); });
  $('#mQuick').addEventListener('click', () => { audio(); SFX.tap(); startMode('quick'); });
  $('#hLang').addEventListener('click', () => { lang = lang === 'it' ? 'tr' : 'it'; S.lang = lang; save(); SFX.tap(); renderHome(); });
  $('#hSound').addEventListener('click', () => { S.sound = !S.sound; save(); soundUi(); if (S.sound) SFX.tap(); });
  $('#coachOk').addEventListener('click', () => { $('#coach').hidden = true; S.coach = true; save(); SFX.tap(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseClock(); persist(); save(true); } else if (G && !G.over && G.t0 == null && screen === 'play') G.t0 = performance.now(); });
  let rzT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => { scene(skyName, true); if (screen === 'play') { layout(); render(); } else if (screen === 'world' && worldId) openWorld(worldId); else paintCards(); }, 150);
  });

  // the board refits whenever the space between the secret word and the clue bar changes
  if (window.ResizeObserver) { try { new ResizeObserver(() => { if (screen === 'play' && G) layout(); }).observe($('#stage')); } catch (e) { /* window resizes still refit it */ } }

  /* ---------- start ---------- */
  function dailyBonus() {
    const k = dkey(new Date());
    if (S.bonus === k) return;
    const first = !S.bonus; S.bonus = k;
    if (!first) { S.coins += 30; setTimeout(() => { toast(t('bonus', 30), 'gold'); coinsUi(true); }, 700); }
    save();
  }
  function boot(data) {
    dailyBonus();
    renderHome();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { scene(skyName, true); if (screen === 'home') paintCards(); if (screen === 'play') { layout(); render(); } });
    try { if (data && data.spec) startPlay(data.spec); else if (data && data.world && TH[data.world]) openWorld(data.world); } catch (e) { renderHome(); }
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => { if (G) { persist(); save(true); } return { spec: G && !G.over ? G.spec : null, world: screen === 'world' ? worldId : null }; }); } catch (e) { /* not in a viewer */ }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});

  /* for automated checks */
  window.__crucimondo = { get G() { return G; }, get S() { return S; }, typeCh, startPlay, startMode, renderHome, openWorld, hintLetter, hintWord, startGuess, setLang(l) { lang = l; S.lang = l; renderHome(); } };
})();
</script>
</body>
