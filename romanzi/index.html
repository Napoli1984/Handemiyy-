/* One light look, like the rest of Handemiyy: pearl and champagne, a photo of Hande behind the book, the cover in front.
   The page has two views on the same scroll: the book (cover, actions, story, contents) and the reader (one chapter).
   The narration is recorded (Suno), a few minutes per part; the paragraph being heard is lit in the text. */
:root {
  --bg: #f6f1ea; --paper: #fbf7f0; --surface: #fffdf9;
  --ink: #2a211e; --ink-2: #4b3e37; --muted: #7b6d65; --line: rgba(66, 48, 36, .12);
  --gold: #c39a55; --gold-soft: #e6cd98; --accent-ink: #8f6630; --plum: #5b4868;
  --glass: rgba(255, 253, 249, .74); --glass-line: rgba(255, 255, 255, .85);
  --champ: linear-gradient(180deg, #f4e4c0 0%, #dcbf86 46%, #c49f60 100%);
  --shadow: 74 54 38;
  --nb-paper: #f2f6fc; --nb-edge: #d6e1f1; --nb-ink: #2c3446; --nb-label: #64789c; --nb-margin: #a5badc;
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-ui: "Jost", Futura, "Century Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-caps: "Cinzel", "Trajan Pro", Optima, "Times New Roman", serif;
  --font-text: "Lora", Georgia, "Times New Roman", serif;
  --banner: min(58svh, 600px);
  --fs: 18px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100svh; color: var(--ink); font: 400 16px/1.5 var(--font-ui);
  background:
    radial-gradient(46% 30% at 0% 64%, rgba(232, 220, 248, .7), rgba(232, 220, 248, 0) 72%),
    radial-gradient(40% 26% at 100% 82%, rgba(214, 241, 231, .65), rgba(214, 241, 231, 0) 72%),
    radial-gradient(52% 30% at 30% 100%, rgba(252, 228, 213, .7), rgba(252, 228, 213, 0) 72%),
    var(--bg);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
body.reading { background: var(--paper); }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.f { fill: currentColor; stroke: none; }

/* ---------- the photo behind the book ---------- */
.bg { position: absolute; top: 0; left: 0; right: 0; height: var(--banner); z-index: 0; overflow: hidden; pointer-events: none; }
.bg img {
  width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; display: block; filter: saturate(.95); transform-origin: 50% 30%; animation: bgZoom 28s ease-out both;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 50%, rgba(0, 0, 0, .55) 72%, transparent 96%); mask-image: linear-gradient(180deg, #000 0%, #000 50%, rgba(0, 0, 0, .55) 72%, transparent 96%);
}
@keyframes bgZoom { from { transform: scale(1.02); } to { transform: scale(1.1); } }
.bg::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(246, 241, 234, .66) 0%, rgba(246, 241, 234, .14) 15%, rgba(246, 241, 234, 0) 27%);
}
body.reading .bg { display: none; }

/* ---------- shared pieces ---------- */
.chip {
  height: 42px; min-width: 42px; padding: 0 15px 0 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  box-shadow: 0 10px 22px -16px rgb(var(--shadow) / .7); font: 500 15px/1 var(--font-ui); text-decoration: none; color: var(--ink);
}

.lang button { height: 34px; min-width: 44px; padding: 0 10px; border-radius: 999px; border: 0; background: none; font: 600 13px/1 var(--font-ui); letter-spacing: .08em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--champ); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 4px 10px -6px rgba(150, 108, 48, .8); }

  display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 52px; padding: 0 20px; border-radius: 999px;
  font: 600 16px/1.1 var(--font-ui); letter-spacing: .01em; color: var(--ink); text-decoration: none; text-align: center;
  background: rgba(255, 253, 249, .9); border: 1px solid rgba(201, 164, 105, .55); box-shadow: 0 10px 20px -16px rgb(var(--shadow) / .7);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--champ); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), 0 16px 28px -16px rgba(150, 108, 48, .95); }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--ink); }
.card {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px;
  -webkit-backdrop-filter: blur(22px) saturate(1.35); backdrop-filter: blur(22px) saturate(1.35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 18px 40px -26px rgb(var(--shadow) / .55);
}
.sec-title { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; font: 600 12px/1.2 var(--font-caps); letter-spacing: .22em; text-transform: uppercase; color: var(--accent-ink); }
.sec-title::before, .sec-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(195, 154, 85, 0), rgba(195, 154, 85, .65)); }
.sec-title::after { transform: scaleX(-1); }
.diamond { display: inline-block; width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); }

/* ---------- the book ---------- */
.wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.topbar .where { font: italic 500 22px/1 var(--font-display); color: var(--ink); text-shadow: 0 1px 12px rgba(255, 250, 240, .9); }
.book { display: grid; justify-items: center; margin-top: calc(var(--banner) * .62 - 58px); }
.cover {
  position: relative; z-index: 2; display: block; width: min(54vw, 260px); aspect-ratio: 2 / 3; padding: 0; border: 0; background: #1b2433; border-radius: 3px 9px 9px 3px;
  box-shadow: 0 34px 50px -30px rgba(30, 22, 18, .85), 0 18px 26px -18px rgb(var(--shadow) / .6), 0 0 0 1px rgba(255, 255, 255, .25);
  transform: perspective(1100px) rotateY(-7deg) rotateX(1deg); transition: transform .5s cubic-bezier(.2, .8, .2, 1);
}
.cover:hover { transform: perspective(1100px) rotateY(-2deg); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
.cover::before { /* the spine and a little shine */
  content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none;
  background: linear-gradient(90deg, rgba(0, 0, 0, .38) 0, rgba(255, 255, 255, .2) 1.6%, rgba(0, 0, 0, .14) 3.4%, rgba(0, 0, 0, 0) 8%),
              linear-gradient(115deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, 0) 32%);
}
.cover::after { /* the pages on the side */
  content: ""; position: absolute; top: 1.8%; bottom: 1.8%; right: -6px; width: 7px; z-index: -1; border-radius: 0 3px 3px 0;
  background: repeating-linear-gradient(90deg, #fbf6ec 0 1px, #e2d6c1 1px 2px);
}
.book-card { width: 100%; margin-top: -58px; padding: 76px 20px 22px; text-align: center; }
.meta { margin: 0; font: 600 11.5px/1.3 var(--font-caps); letter-spacing: .22em; text-transform: uppercase; color: var(--accent-ink); }
.b-title { margin: 8px 0 0; font: 500 clamp(32px, 9vw, 44px)/1.08 var(--font-display); letter-spacing: -.01em; }
.b-sub { margin: 8px 0 0; font: italic 400 18px/1.35 var(--font-text); color: var(--ink-2); }
.prog { margin: 18px auto 0; max-width: 340px; }
.prog-bar { height: 5px; border-radius: 3px; background: rgba(66, 48, 36, .1); overflow: hidden; }
.prog-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #e6cd98, #c39a55); }
.prog p { margin: 7px 0 0; font: 500 13.5px/1.3 var(--font-ui); color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.actions .primary { grid-column: 1 / -1; }
.actions.solo #b-dl { grid-column: 1 / -1; }
.ch-tt .au { white-space: nowrap; }
.ch-tt .au svg.i { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; color: var(--accent-ink); }
.times { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.times li { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 9px; border-radius: 999px; background: rgba(255, 253, 249, .7); border: 1px solid var(--line); font: 500 13px/1.2 var(--font-ui); color: var(--ink-2); }
.times svg.i { width: 17px; height: 17px; color: var(--accent-ink); }
.block { margin-top: 14px; padding: 22px 20px; }
.blurb { margin: 0; font: 400 17px/1.65 var(--font-text); color: var(--ink-2); text-wrap: pretty; }
.blurb::first-letter { font-family: var(--font-display); font-size: 2.6em; float: left; line-height: .9; margin: .04em .08em 0 0; color: var(--accent-ink); }
.toc { margin: 0; padding: 0; list-style: none; }
.toc li + li { border-top: 1px solid var(--line); }
.ch-row { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) 24px; align-items: center; gap: 12px; padding: 11px 4px; border: 0; background: none; text-align: left; border-radius: 12px; }
.ch-row:hover { background: rgba(255, 255, 255, .5); }
.ch-no { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: italic 500 16px/1 var(--font-display); color: var(--accent-ink); border: 1px solid rgba(201, 164, 105, .55); background: rgba(255, 253, 249, .8); }
.ch-tt b { display: block; font: 500 16.5px/1.3 var(--font-text); color: var(--ink); }
.ch-tt small { display: block; margin-top: 2px; font: 400 13px/1.3 var(--font-ui); color: var(--muted); }
.ch-ic { color: var(--gold); display: grid; place-items: center; }
.ch-row.done .ch-no { background: var(--champ); border-color: transparent; color: var(--ink); }
.ch-row.cur .ch-no { background: var(--plum); border-color: var(--plum); color: #fff; }
.ch-row.cur small { color: var(--plum); font-weight: 500; }
.note { margin: 0; font: 400 15.5px/1.6 var(--font-ui); color: var(--ink-2); }
.note + .note { margin-top: 8px; }
.note.soft { color: var(--muted); font-size: 14.5px; }
.foot { margin: 22px 0 0; text-align: center; font: 400 12.5px/1.5 var(--font-ui); color: var(--muted); }

/* wide screens: the photo stays on the left, the book on the right */
@media (min-width: 900px) {
  .bg { position: fixed; top: 0; bottom: 0; height: auto; right: auto; width: 46vw; }
  .bg img { object-position: 50% 18%; -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 55%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, #000 55%, transparent 100%); }
  .bg::after { background: linear-gradient(180deg, rgba(246, 241, 234, .35), rgba(246, 241, 234, 0) 18%); }
  .wrap { max-width: none; margin: 0 0 0 38vw; padding: 26px clamp(28px, 4vw, 64px) 140px; }
  .wrap > * { max-width: 780px; }
  .book { grid-template-columns: auto minmax(0, 1fr); align-items: center; justify-items: stretch; margin-top: 46px; }
  .cover { width: 250px; margin-right: -54px; }
  .book-card { margin-top: 0; padding: 30px 28px 26px 84px; text-align: left; }
  .prog { margin-left: 0; }
  .times { justify-content: flex-start; }
}

/* ---------- the reader ---------- */
.r-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 4px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(6px, env(safe-area-inset-right, 0px)) 6px max(6px, env(safe-area-inset-left, 0px));
  background: rgba(251, 247, 240, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  transition: transform .3s ease;
}
.r-bar.away { transform: translateY(-105%); }
.r-where { opacity: 0; transition: opacity .25s ease; }
.r-bar.titled .r-where { opacity: 1; }
.r-where { flex: 1; min-width: 0; text-align: center; padding: 0 4px; }
.r-where span { display: block; font: 600 10.5px/1.3 var(--font-caps); letter-spacing: .2em; text-transform: uppercase; color: var(--accent-ink); }
.r-where b { display: block; font: italic 500 16.5px/1.3 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; }
.r-prog i { display: block; height: 100%; background: linear-gradient(90deg, #e6cd98, #c39a55); transform-origin: 0 50%; transform: scaleX(0); }
.reader { padding: calc(env(safe-area-inset-top, 0px) + 66px) 0 calc(150px + env(safe-area-inset-bottom, 0px)); }
.text {
  max-width: 35em; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  font: 400 var(--fs)/1.7 var(--font-text); color: #2b2420; text-align: left; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word;
}
@media (min-width: 700px) { .text { text-align: justify; } }
.text p { margin: 0; text-indent: 1.4em; }
.text p.first { text-indent: 0; }
.text p.lead + * { clear: left; }   /* a one-line opening paragraph does not let the big letter push into the next one */
.text p.lead:not(.nolead)::first-letter { float: left; font-family: var(--font-display); font-weight: 500; font-size: 3.3em; line-height: .84; margin: .07em .1em 0 0; color: var(--accent-ink); }
.ch-head { text-align: center; padding: clamp(26px, 7vh, 64px) 0 1.7em; }
.ch-num { margin: 0 0 14px; font: 600 12px/1 var(--font-caps); letter-spacing: .26em; text-transform: uppercase; color: var(--accent-ink); text-indent: 0; }
.ch-title { margin: 0; font: italic 500 clamp(30px, 7.6vw, 42px)/1.12 var(--font-display); color: var(--ink); text-wrap: balance; -webkit-hyphens: manual; hyphens: manual; }
.orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px auto 0; width: 150px; }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(195, 154, 85, 0), rgba(195, 154, 85, .8)); }
.orn::after { transform: scaleX(-1); }
.brk { display: flex; justify-content: center; gap: 14px; margin: 1.35em 0; }
.brk i { width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); opacity: .85; }
.nb {
  position: relative; margin: 1.5em 0 1.8em; padding: 1.05em 1.1em .7em 1.55em; border-radius: 5px 16px 16px 5px;
  background: linear-gradient(180deg, #f7f9fd, var(--nb-paper)); border: 1px solid var(--nb-edge); color: var(--nb-ink);
  font-style: italic; text-align: left; box-shadow: 0 14px 26px -22px rgba(44, 52, 70, .55);
}
.nb::before { content: ""; position: absolute; top: 10px; bottom: 10px; left: .72em; width: 1.5px; border-radius: 1px; background: var(--nb-margin); }
.text .nb p { text-indent: 0; margin: 0 0 .55em; }
.text .nb p.nb-label { margin-bottom: .85em; font: 600 .62em/1.3 var(--font-caps); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--nb-label); }
.nb.nb-final { margin-top: 2.6em; }
.text p.u.on { background: rgba(236, 211, 152, .34); border-radius: 6px; box-shadow: 0 0 0 7px rgba(236, 211, 152, .34); transition: background .4s ease, box-shadow .4s ease; }
.text .nb p.u.on { background: rgba(165, 186, 220, .26); box-shadow: 0 0 0 7px rgba(165, 186, 220, .26); }
.ch-head.on .ch-title { color: var(--accent-ink); }
.audio-on .text .u { cursor: pointer; }
.ch-end { margin: 2.6em auto 0; max-width: 35em; padding: 0 20px; text-align: center; }
.ch-end .end-t { margin: 16px 0 0; font: italic 500 18px/1.3 var(--font-display); color: var(--ink-2); }
.ch-end .end-big { margin: 18px 0 0; font: italic 500 46px/1 var(--font-display); }
.ch-end .end-note { margin: 10px auto 0; max-width: 26em; font: 400 15.5px/1.55 var(--font-ui); color: var(--muted); }
.ch-end .end-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
.r-msg { max-width: 30em; margin: 30vh auto 0; padding: 0 24px; text-align: center; font: 400 16px/1.6 var(--font-ui); color: var(--muted); }
.r-msg .btn { margin-top: 16px; }
.spin { width: 30px; height: 30px; margin: 0 auto 14px; border-radius: 50%; border: 2px solid rgba(195, 154, 85, .25); border-top-color: var(--gold); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.fab {
  position: fixed; z-index: 25; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 22px 0 17px; border-radius: 999px; border: 0;
  background: var(--champ); color: var(--ink); font: 600 16px/1 var(--font-ui);

}

/* ---------- the player ---------- */
.player {
  position: fixed; z-index: 30; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(560px, calc(100% - 20px)); padding: 8px 12px 12px; border-radius: 26px;
  background: rgba(255, 252, 246, .92); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  border: 1px solid rgba(201, 164, 105, .5); box-shadow: 0 24px 44px -24px rgba(60, 44, 32, .7), 0 4px 14px -8px rgba(60, 44, 32, .35);
}
.pl-head { display: flex; align-items: center; gap: 6px; }
.pl-where { flex: 1; min-width: 0; padding: 6px 4px; border: 0; background: none; text-align: left; font: 500 13.5px/1.3 var(--font-ui); color: var(--ink-2); }
.pl-where b, .pl-where small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-where b { font: italic 500 15.5px/1.3 var(--font-display); color: var(--ink); }
.pl-where small { font-size: 12.5px; color: var(--muted); }
.pl-ctl { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
.pl-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); position: relative; }
.pl-btn.rate { font: 600 14.5px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.pl-btn .badge { position: absolute; top: -4px; right: -6px; padding: 2px 6px; border-radius: 999px; background: var(--plum); color: #fff; font: 600 10px/1.2 var(--font-ui); }

  /* ---------- the narration: recordings of a few minutes each, played one after the other in one audio element

    const p = pos();
    let ci = p && !p.done ? p.ch : 0, u = p && !p.done ? p.u : 0;
    if (!recorded(lang, ci)) { ci = 0; u = 0; }
    if (!recorded(lang, ci)) { toast(t('chNoAudio')); return; }
    prime(ci, u);
    goRead(ci, u, true);
  });
  $('#b-dl').addEventListener('click', () => { renderDownloads(); openSheet('sh-dl'); });
  $('#b-toc').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ch]');
    if (!b) return;
    const ci = +b.dataset.ch, p = pos();
    goRead(ci, p && p.ch === ci && !p.done ? p.u : 0);   // the chapter with the bookmark opens at the bookmark
  });
  $('#sh-toc-list').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ch]');
    if (!b) return;
    closeSheet($('#sh-toc'));
    const ci = +b.dataset.ch;
    history.replaceState(null, '', '#/leggi/' + (ci + 1));
    showChapter(ci, 0);
  });
  $('#r-back').addEventListener('click', backToBook);
  $('#r-toc').addEventListener('click', () => { renderToc($('#sh-toc-list')); openSheet('sh-toc'); });
  $('#r-textset').addEventListener('click', () => { $('#fs-out').style.fontSize = ST.fs + 'px'; openSheet('sh-text'); });
  $('#fs-dn').addEventListener('click', () => setFont(ST.fs - 1));
  $('#fs-up').addEventListener('click', () => setFont(ST.fs + 1));
  $('#r-end').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (!b) return;
    const go = b.dataset.go;
    if (go === 'book') { backToBook(); return; }
    if (go === 'dl') { renderDownloads(); openSheet('sh-dl'); return; }
    const ci = R.ch + (go === 'next' ? 1 : -1);
    if (ci < 0 || ci >= NCH) return;
    history.replaceState(null, '', '#/leggi/' + (ci + 1));
    showChapter(ci, 0);
  });
  $('#r-listen').addEventListener('click', () => { lastUser = 0; listenAt(topUnit(), true); });
  $('#r-text').addEventListener('click', (e) => {   // while listening, a tap on a paragraph reads from there
    const sel = window.getSelection && String(window.getSelection());
    if (sel) return;
    if (!A.active) { if (scrollY > 160) uiAway(!$('#r-bar').classList.contains('away')); return; }
    const un = e.target.closest('.u');
    if (!un) return;
    let u = +un.dataset.u;
    while (u < R.units.length - 1 && !R.w[u]) u++;   // a scene break reads from the next paragraph
    lastUser = 0;
    if (A.ch === R.ch && A.lg === R.lang) {
      const pi = A.parts.findIndex((p) => u >= p.u0 && u <= p.u1);
      if (pi >= 0) { loadPart(pi, -1, u, true); markUnit(u, false); return; }
    }
    listenAt(u, true);
  });
  $('#pl-play').addEventListener('click', () => { if (A.playing) AU.pause(); else { lastUser = 0; resume(); } });
  $('#pl-back').addEventListener('click', () => skipBy(-15));
  $('#pl-fwd').addEventListener('click', () => skipBy(15));
  $('#pl-close').addEventListener('click', closeAudio);
  $('#pl-rate').addEventListener('click', () => setRate(RATES[(RATES.indexOf(ST.rate) + 1) % RATES.length]));
  $('#pl-more').addEventListener('click', () => { renderMoreSheet(); openSheet('sh-more'); });
  $('#pl-where').addEventListener('click', () => {   // back to the paragraph being read
    if (view === 'book') { goRead(A.ch, A.u >= 0 ? A.u : 0); return; }
    lastUser = 0;
    if (A.u >= 0) markUnit(A.u, true);
  });
  const seekEl = $('#pl-seek');
  seekEl.addEventListener('input', () => {
    seeking = true;
    const tot = chapterTotal();
    $('#pl-cur').textContent = clock(seekEl.value / 1000 * tot);
    seekEl.style.setProperty('--p', seekEl.value / 10 + '%');
  });
  seekEl.addEventListener('change', () => { seeking = false; lastUser = 0; seekChapter(seekEl.value / 1000 * chapterTotal()); });
  $('#vo-rate').addEventListener('click', (e) => {
    const b = e.target.closest('[data-r]');
    if (!b) return;
    setRate(+b.dataset.r);
    renderMoreSheet();
  });
  $('#vo-timer').addEventListener('click', (e) => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const m = b.dataset.m === 'end' ? 'end' : +b.dataset.m;
    A.timer = { mode: m, until: typeof m === 'number' && m ? Date.now() + m * 60000 : 0 };
    renderMoreSheet();
    renderPlayer();
  });

  // the bar steps aside while reading down and comes back when going up; the place is kept as the page moves
  let lastY = 0, posT = 0;
  addEventListener('scroll', () => {
    if (view !== 'read') return;
    readProgress();
    const y = scrollY;
    if (Date.now() - ownScroll > 900) {
      if (y > lastY + 8 && y > 160 && !A.active) uiAway(true);
      else if (y < lastY - 8 || y < 160) uiAway(false);
    }
    $('#r-bar').classList.toggle('titled', y > 150);
    lastY = y;
    if (A.active && A.playing) return;
    clearTimeout(posT);
    posT = setTimeout(() => {
      if (R.ch < 0 || !R.units.length) return;
      const endSeen = $('#r-end').getBoundingClientRect().top < innerHeight;
      savePos(R.ch, topUnit(), endSeen && R.ch === NCH - 1);
    }, 300);
  }, { passive: true });
  ['wheel', 'touchmove', 'keydown'].forEach((ev) => addEventListener(ev, () => { lastUser = Date.now(); }, { passive: true }));
  addEventListener('hashchange', route);
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  document.documentElement.style.setProperty('--fs', ST.fs + 'px');
  applyLang();
  route();
  // the text of the book's language comes in the background, so «Read» opens at once
  setTimeout(() => { loadText(lang).catch(() => {}); }, 900);
})();
</script>
</body>
</html>
