    const quad = (xa, xb, ya, yb, fill) => { bwPath(g, [bwP(c, xa, ya), bwP(c, xb, ya), bwP(c, xb, yb), bwP(c, xa, yb)]); g.fillStyle = fill; g.fill(); };
    const [, yFar] = bwP(c, 0, y1), [, yNear] = bwP(c, 0, y0), [, yPit] = bwP(c, 0, BW.Y_PIT + 60);
    // the pit behind the deck
    const pit = g.createLinearGradient(0, yPit - 40 * c.F / (BW.Y_PIT + c.D0 - c.cz), 0, yFar);
    pit.addColorStop(0, 'rgba(58,44,34,.1)'); pit.addColorStop(1, 'rgba(58,44,34,.34)');
    quad(-C, C, y1, YB, pit);
    // the floor beside the lane: polished stone that mirrors the boiserie, with fine joints
    const cap = g.createLinearGradient(0, yFar, 0, yNear); cap.addColorStop(0, '#e6dccd'); cap.addColorStop(1, '#f6efe5');
    quad(-C, -G, y0, y1, cap); quad(G, C, y0, y1, cap);
    const yA = Math.max(y0, c.cz - c.D0 + 40);
    for (const sgn of [-1, 1]) {
      const mir = (za, zb, fill) => { bwPath(g, [bwP(c, sgn * C, yA, -za), bwP(c, sgn * C, YB, -za), bwP(c, sgn * C, YB, -zb), bwP(c, sgn * C, yA, -zb)]); g.fillStyle = fill; g.fill(); };
      g.save(); bwPath(g, [bwP(c, sgn * G, y0), bwP(c, sgn * C, y0), bwP(c, sgn * C, YB), bwP(c, sgn * G, YB)]); g.clip();
      mir(0, 98, 'rgba(214,195,165,.32)'); mir(0, 13, 'rgba(190,160,120,.18)'); mir(90, 98, 'rgba(201,164,105,.3)');
      g.restore();
      quad(sgn * (C - 5), sgn * C, y0, YB, 'rgba(110,80,40,.07)');
      g.strokeStyle = 'rgba(150,118,76,.1)';
      for (let ty = Math.ceil(y0 / 70) * 70; ty < y1; ty += 70) {
        const a = bwP(c, sgn * G, ty), b = bwP(c, sgn * C, ty); g.lineWidth = Math.max(.5, Math.min(1.6, a[2] * .9));
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      }
      const m0 = bwP(c, sgn * (G + BW.CAP / 2), y0), m1 = bwP(c, sgn * (G + BW.CAP / 2), y1);
      g.lineWidth = 1; g.beginPath(); g.moveTo(m0[0], m0[1]); g.lineTo(m1[0], m1[1]); g.stroke();
    }
    // gutters, rounded
    for (const sgn of [-1, 1]) {
      const a = bwP(c, sgn * L, y0), b = bwP(c, sgn * G, y0), d = bwP(c, sgn * G, y1), e = bwP(c, sgn * L, y1);
      const gr = g.createLinearGradient(a[0], 0, b[0] + .01, 0);
      gr.addColorStop(0, '#cdbfa9'); gr.addColorStop(.45, '#ece3d4'); gr.addColorStop(1, '#c2b29a');
      bwPath(g, [a, b, d, e]); g.fillStyle = gr; g.fill();
      g.strokeStyle = 'rgba(201,164,105,.85)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(d[0], d[1]); g.stroke();
    }
    // the lane: light maple boards
    const wood = g.createLinearGradient(0, yFar, 0, yNear); wood.addColorStop(0, '#dcbd8c'); wood.addColorStop(.55, '#e9cfa2'); wood.addColorStop(1, '#f0dbb4');
    quad(-L, L, y0, y1, wood);
    const N = 39, bw = BW.LANE / N;
    for (let i = 0; i < N; i++) {
      const tone = (i * 7919 % 13) / 13;
      quad(-L + i * bw, -L + (i + 1) * bw, y0, BW.PIN_Y - 40, 'rgba(' + (i % 2 ? '110,70,20' : '255,240,210') + ',' + (.03 + tone * .045).toFixed(3) + ')');
    }
    g.strokeStyle = 'rgba(120,84,40,.12)'; g.lineWidth = .6;
    for (let i = 1; i < N; i++) { const a = bwP(c, -L + i * bw, y0), b = bwP(c, -L + i * bw, BW.PIN_Y - 40); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    quad(-L, L, BW.PIN_Y - 40, y1, 'rgba(250,236,206,.55)');
    // varnish: the lights of the room glide on the lane
    const gl = bwP(c, 0, 0), gl2 = bwP(c, 0, BW.PIN_Y);
    const sheen = g.createLinearGradient(0, gl2[1], 0, gl[1] + .01); sheen.addColorStop(0, 'rgba(255,255,255,.35)'); sheen.addColorStop(.35, 'rgba(255,255,255,0)'); sheen.addColorStop(.7, 'rgba(255,255,255,.18)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
    quad(-L * .55, L * .55, y0, y1, sheen);
    // the photo, faintly mirrored in the varnish near the pins
    if (photo && photo.complete && photo.naturalWidth && pk > .02) {
      const a = bwP(c, -L, BW.PIN_Y - 260), b = bwP(c, L, y1);
      g.save();
      bwPath(g, [bwP(c, -L, y0), bwP(c, L, y0), bwP(c, L, y1), bwP(c, -L, y1)]); g.clip();
      g.globalAlpha = .1 * pk; g.translate(0, b[1]); g.scale(1, -1);
      const wImg = b[0] - a[0], hImg = (a[1] - b[1]) * 1.2;
      g.drawImage(photo, a[0], -hImg * .05, wImg, hImg);
      g.restore();
    }
    // foul line, approach dots, arrows, pin spots
    const f1 = bwP(c, -L, 0), f2 = bwP(c, L, 0);
    g.strokeStyle = 'rgba(70,52,38,.75)'; g.lineWidth = Math.max(1, 2.2 * f1[2]); g.beginPath(); g.moveTo(f1[0], f1[1]); g.lineTo(f2[0], f2[1]); g.stroke();
    for (const bx of [-30, -15, 0, 15, 30]) { const [x, y, s] = bwP(c, bx, -38); g.fillStyle = 'rgba(122,90,46,.55)'; g.beginPath(); g.ellipse(x, y, 1.6 * s, .8 * s, 0, 0, 7); g.fill(); }
    const ay = BW.PIN_Y * .27;
    for (let k = 1; k <= 7; k++) {
      const bx = -L + k * 5 * bw - bw / 2, back = ay - Math.abs(k - 4) * 9;
      const tp = bwP(c, bx, back + 22), l = bwP(c, bx - 2.2, back), r = bwP(c, bx + 2.2, back);
      g.fillStyle = 'rgba(167,128,63,.85)'; bwPath(g, [tp, l, r]); g.fill();
    }
    for (const [cx0, r0] of BW_RACK) { const [x, y, s] = bwP(c, cx0 * BW.SP, BW.PIN_Y + r0 * BW.ROW); g.fillStyle = 'rgba(122,90,46,.28)'; g.beginPath(); g.ellipse(x, y, 2.2 * s, 1.1 * s, 0, 0, 7); g.fill(); }
    // warm light on the pin deck
    const dk = bwP(c, 0, BW.PIN_Y + 40), dr = 120 * dk[2];
    const pool = g.createRadialGradient(dk[0], dk[1], 0, dk[0], dk[1], dr);
    pool.addColorStop(0, 'rgba(255,246,224,.42)'); pool.addColorStop(1, 'rgba(255,246,224,0)');
    g.save(); g.translate(dk[0], dk[1]); g.scale(1, .32); g.translate(-dk[0], -dk[1]);
    g.fillStyle = pool; g.beginPath(); g.arc(dk[0], dk[1], dr, 0, 7); g.fill(); g.restore();
    // the kickbacks: ivory side boards with a gold top that send the pins back onto the deck
    const yk = BW.PIN_Y - 45, ze = 62, th = 7;
    for (const sgn of [-1, 1]) {
      const x = sgn * G, xo = sgn * (G + th);
      const n0 = bwP(c, x, yk, 0), n1 = bwP(c, x, yk, ze), f0 = bwP(c, x, YB, 0), fz = bwP(c, x, YB, ze);
      const face = g.createLinearGradient(n0[0], 0, f0[0] + .01, 0);
      face.addColorStop(0, '#f7efe3'); face.addColorStop(1, '#e3d5c1');
      bwPath(g, [n0, f0, fz, n1]); g.fillStyle = face; g.fill();
      bwPath(g, [bwP(c, x, yk + 12, 12), bwP(c, x, YB - 10, 12), bwP(c, x, YB - 10, ze - 12), bwP(c, x, yk + 12, ze - 12)]);
      g.strokeStyle = 'rgba(184,145,78,.75)'; g.lineWidth = Math.max(.6, n0[2] * .8); g.stroke();
      bwPath(g, [n0, bwP(c, xo, yk, 0), bwP(c, xo, yk, ze), n1]); g.fillStyle = '#ece0cf'; g.fill();
      const top = g.createLinearGradient(n1[0], n1[1], fz[0] + .01, fz[1] + .01);
      top.addColorStop(0, '#e2c68c'); top.addColorStop(1, '#b8914e');
      bwPath(g, [n1, bwP(c, xo, yk, ze), bwP(c, xo, YB, ze), fz]); g.fillStyle = top; g.fill();
    }
  }

  /* the room: ivory walls with champagne boiserie, framed photos of Hande, sconces and a coffered ceiling. It has its own
     canvas behind the photo at the end of the lane; the lane, the pins and the ball are drawn in front of the photo. */
  function bwDrawRoom(g, c, photos) {
    const XW = BW.XW, HW = BW.HW, YB = BW.Y_BACK, G = BW.LANE / 2 + BW.GUT, BAY = BW.BAY, yN = c.cz - c.D0 + 40;
    const fill = (a, f) => { bwPath(g, a); g.fillStyle = f; g.fill(); };
    const side = (x, ya, yb, za, zb) => [bwP(c, x, ya, za), bwP(c, x, yb, za), bwP(c, x, yb, zb), bwP(c, x, ya, zb)];
    const roof = (xa, xb, ya, yb) => [bwP(c, xa, ya, HW), bwP(c, xb, ya, HW), bwP(c, xb, yb, HW), bwP(c, xa, yb, HW)];
    const seg = (a, b, col, w) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
    const lw = (s, k) => Math.max(.5, Math.min(2.4, s * k));
    // a glow on a wall: an ellipse of light, rx and ry in pixels
    const glow = (x, y, rx, ry, a) => {
      if (rx < .5 || ry < .5) return;
      g.save(); g.translate(x, y); g.scale(rx / ry, 1);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, ry);
      gr.addColorStop(0, 'rgba(255,247,226,' + a + ')'); gr.addColorStop(.35, 'rgba(255,238,200,' + (a * .55).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(255,238,200,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, ry, 0, 7); g.fill(); g.restore();
    };
    g.clearRect(0, 0, c.W, c.H);
    // ceiling: ivory coffers with a row of downlights over the lane
    const cf = bwP(c, 0, YB, HW);
    if (cf[1] > 0) {
      const cg = g.createLinearGradient(0, cf[1], 0, 0);
      cg.addColorStop(0, '#f6efe3'); cg.addColorStop(1, '#e9dfcf');
      fill(roof(-XW, XW, yN, YB), cg);
      for (const bx of [-XW / 3, XW / 3]) {
        fill(roof(bx - 7, bx + 7, yN, YB), 'rgba(255,252,246,.45)');
        seg(bwP(c, bx - 7, yN, HW), bwP(c, bx - 7, YB, HW), 'rgba(140,105,60,.1)', 1);
        seg(bwP(c, bx + 7, yN, HW), bwP(c, bx + 7, YB, HW), 'rgba(140,105,60,.1)', 1);
      }
      for (let y1 = YB; y1 > yN; y1 -= BAY) {
        const y0 = Math.max(yN, y1 - BAY), yb = Math.min(YB, y1 + 8);
        fill(roof(-XW, XW, Math.max(yN, y1 - 8), yb), 'rgba(255,252,246,.5)');
        seg(bwP(c, -XW, yb, HW), bwP(c, XW, yb, HW), 'rgba(140,105,60,.12)', 1);
        const yc = (y0 + y1) / 2; if (yc < yN + 30) continue;
        const [lx, ly, s] = bwP(c, 0, yc, HW), dy = Math.abs(bwP(c, 0, yc + 9, HW)[1] - bwP(c, 0, yc - 9, HW)[1]) / 2;
        if (ly < -40) continue;
        glow(lx, ly, 46 * s, Math.max(1, dy * 46 / 9), .55);
        g.fillStyle = '#fffdf6'; g.beginPath(); g.ellipse(lx, ly, 9 * s, Math.max(.6, dy), 0, 0, 7); g.fill();
        g.strokeStyle = 'rgba(184,145,78,.6)'; g.lineWidth = lw(s, .6); g.stroke();
      }
    }
    // side walls
    for (const sg of [-1, 1]) {
      const x = sg * XW, edge = sg > 0 ? c.W : 0, far = bwP(c, x, YB, 0);
      if (sg > 0 ? far[0] >= c.W : far[0] <= 0) continue;
      const off = (p) => (sg > 0 ? p[0] > c.W + 2 : p[0] < -2);
      const wg = g.createLinearGradient(far[0], 0, edge + sg * .01, 0);
      wg.addColorStop(0, '#f5eee3'); wg.addColorStop(1, '#ebdfcc');
      fill(side(x, yN, YB, 98, HW), wg);
      const bg = g.createLinearGradient(far[0], 0, edge + sg * .01, 0);
      bg.addColorStop(0, '#e7d9c3'); bg.addColorStop(1, '#d9c6a8');
      fill(side(x, yN, YB, 0, 98), bg);
      fill(side(x, yN, YB, 0, 13), '#ccb593');
      fill(side(x, yN, YB, 90, 98), '#dcc189');
      seg(bwP(c, x, yN, 97.5), bwP(c, x, YB, 97.5), 'rgba(255,248,228,.9)', 1);
      seg(bwP(c, x, yN, 90), bwP(c, x, YB, 90), 'rgba(120,86,40,.35)', 1);
      seg(bwP(c, x, yN, 13), bwP(c, x, YB, 13), 'rgba(201,164,105,.9)', 1);
      fill(side(x, yN, YB, HW - 16, HW), '#faf5ed');
      seg(bwP(c, x, yN, HW - 16), bwP(c, x, YB, HW - 16), 'rgba(184,145,78,.6)', 1);
      // the corner with the back wall is a little in shadow
      const ca = bwP(c, x, YB - 70, 150), cs = g.createLinearGradient(ca[0], 0, far[0] + .01, 0);
      cs.addColorStop(0, 'rgba(120,90,50,0)'); cs.addColorStop(1, 'rgba(120,90,50,.1)');
      fill(side(x, YB - 70, YB, 0, HW), cs);
      // bays from the far end towards the camera: panels, a framed photo, a pilaster with a sconce
      for (let k = 0; ; k++) {
        const y1 = YB - k * BAY, y0 = y1 - BAY;
        if (y1 <= yN + 20 || off(bwP(c, x, y1, 150))) break;
        const s1 = bwP(c, x, y1, 150)[2], sMid = bwP(c, x, Math.max(yN + 10, (y0 + y1) / 2), 150)[2];
        for (const [a, b] of [[y0 + 14, (y0 + y1) / 2 - 7], [(y0 + y1) / 2 + 7, y1 - 14]]) {
          if (b < yN + 10) continue;
          const aa = Math.max(a, yN + 10);
          bwPath(g, side(x, aa, b, 24, 76)); g.strokeStyle = 'rgba(130,95,50,.3)'; g.lineWidth = lw(sMid, .9); g.stroke();
          bwPath(g, side(x, aa, b, 25.5, 77.5)); g.strokeStyle = 'rgba(255,250,240,.55)'; g.lineWidth = lw(sMid, .7); g.stroke();
        }
        if (y1 - 30 > yN + 10) { bwPath(g, side(x, Math.max(y0 + 30, yN + 10), y1 - 30, 118, HW - 40)); g.strokeStyle = 'rgba(184,145,78,.5)'; g.lineWidth = lw(sMid, .9); g.stroke(); }
        const yc = (y0 + y1) / 2, fa = yc - 38, fb = yc + 38;
        if (fa > yN + 10) {
          const fr = side(x, fa, fb, 140, 244), fp = bwP(c, x, yc, 240);
          const gold = g.createLinearGradient(0, fr[3][1], 0, fr[0][1] + .01);
          gold.addColorStop(0, '#f1dca8'); gold.addColorStop(.5, '#c9a469'); gold.addColorStop(1, '#9c7638');
          fill(fr, gold);
          fill(side(x, fa + 5, fb - 5, 145, 239), '#fffaf2');
          const img = photos && photos.length ? photos[(k * 2 + (sg > 0 ? 1 : 0)) % photos.length] : null;
          if (img && img.complete && img.naturalWidth) bwWallImage(g, c, img, x, sg, fa + 11, fb - 11, 151, 233);
          else fill(side(x, fa + 11, fb - 11, 151, 233), '#eadfce');
          fill(side(x, yc - 20, yc + 20, 250, 254), '#c49f60');
          glow(fp[0], fp[1] - 6 * fp[2], Math.abs(bwP(c, x, yc - 44, 0)[0] - bwP(c, x, yc + 44, 0)[0]) / 2, 34 * fp[2], .5);
        }
        if (y0 > yN + 20) {
          const pa = y0 - 11, pb = y0 + 11;
          fill(side(x, pa, pb, 98, HW - 16), '#f8f2e8');
          seg(bwP(c, x, pa, 98), bwP(c, x, pa, HW - 16), 'rgba(184,145,78,.45)', lw(s1, .8));
          seg(bwP(c, x, pb, 98), bwP(c, x, pb, HW - 16), 'rgba(184,145,78,.45)', lw(s1, .8));
          const sp = bwP(c, x, y0, 205), sx = Math.abs(bwP(c, x, y0 - 70, 205)[0] - bwP(c, x, y0 + 70, 205)[0]) / 2;
          glow(sp[0], sp[1], Math.max(1, sx), 95 * sp[2], .7);
          const sh = bwP(c, x - sg * 10, y0, 205), k2 = sh[2];
          g.fillStyle = '#b8914e'; g.fillRect(sp[0] - 1.5 * sp[2], sp[1] - 9 * sp[2], 3 * sp[2], 18 * sp[2]);
          seg(bwP(c, x, y0, 198), [sh[0], sh[1] + 7 * k2], '#b8914e', lw(k2, 1.6));
          const cup = g.createLinearGradient(0, sh[1] - 10 * k2, 0, sh[1] + 7 * k2 + .01);
          cup.addColorStop(0, 'rgba(255,253,246,.95)'); cup.addColorStop(1, 'rgba(241,220,172,.95)');
          g.fillStyle = cup; bwPath(g, [[sh[0] - 6 * k2, sh[1] - 10 * k2], [sh[0] + 6 * k2, sh[1] - 10 * k2], [sh[0] + 4 * k2, sh[1] + 7 * k2], [sh[0] - 4 * k2, sh[1] + 7 * k2]]); g.fill();
          g.strokeStyle = 'rgba(184,145,78,.8)'; g.lineWidth = lw(k2, .7); g.stroke();
          g.fillStyle = '#c39a55'; g.fillRect(sh[0] - 4.5 * k2, sh[1] + 7 * k2, 9 * k2, 2 * k2);
        }
      }
    }
    // the back wall faces the camera: drawn in world units (x to the right, z up)
    const b0 = bwP(c, 0, YB, 0), s = b0[2], PIT = G + 10;
    g.save(); g.translate(b0[0], b0[1]); g.scale(s, -s);
    g.fillStyle = '#efe5d5'; g.fillRect(-XW, 0, 2 * XW, HW);
    const wash = g.createRadialGradient(0, 150, 0, 0, 150, 230);
    wash.addColorStop(0, 'rgba(255,251,240,.95)'); wash.addColorStop(.55, 'rgba(255,248,232,.5)'); wash.addColorStop(1, 'rgba(255,248,232,0)');
    g.fillStyle = wash; g.fillRect(-XW, 0, 2 * XW, HW);
    for (const sg of [-1, 1]) {
      const xa = sg > 0 ? PIT : -XW, w = XW - PIT;
      g.fillStyle = '#e3d3ba'; g.fillRect(xa, 0, w, 98);
      g.fillStyle = '#ccb593'; g.fillRect(xa, 0, w, 13);
      g.fillStyle = '#dcc189'; g.fillRect(xa, 90, w, 8);
      g.strokeStyle = 'rgba(130,95,50,.3)'; g.lineWidth = 1.1; g.strokeRect(xa + 10, 24, w - 20, 52);
      g.strokeStyle = 'rgba(255,250,240,.6)'; g.strokeRect(xa + 11.5, 25.5, w - 20, 52);
      g.strokeStyle = 'rgba(184,145,78,.5)'; g.lineWidth = 1.2; g.strokeRect(xa + 12, 118, w - 24, HW - 160);
      g.save(); g.translate(sg * (PIT + w / 2), 205); g.scale(1, -1);
      const gl = g.createRadialGradient(0, 0, 0, 0, 0, 95);
      gl.addColorStop(0, 'rgba(255,247,226,.8)'); gl.addColorStop(.35, 'rgba(255,238,200,.42)'); gl.addColorStop(1, 'rgba(255,238,200,0)');
      g.fillStyle = gl; g.beginPath(); g.ellipse(0, 0, 60, 95, 0, 0, 7); g.fill();
      g.fillStyle = '#b8914e'; g.fillRect(-4, -12, 8, 24);
      const cup = g.createLinearGradient(0, -14, 0, 12); cup.addColorStop(0, '#fffdf6'); cup.addColorStop(1, '#f1dcac');
      g.fillStyle = cup; bwPath(g, [[-8, -13], [8, -13], [5.5, 10], [-5.5, 10]]); g.fill();
      g.strokeStyle = 'rgba(184,145,78,.85)'; g.lineWidth = 1; g.stroke();
      g.restore();
    }
    g.fillStyle = '#faf5ed'; g.fillRect(-XW, HW - 16, 2 * XW, 16);
    g.fillStyle = 'rgba(184,145,78,.6)'; g.fillRect(-XW, HW - 16, 2 * XW, 1.2);
    // the pit: a soft champagne curtain under a brass rail
    const cur = g.createLinearGradient(0, 40, 0, 0); cur.addColorStop(0, '#cdbba2'); cur.addColorStop(1, '#a8937a');
    g.fillStyle = cur; g.fillRect(-PIT, 0, 2 * PIT, 40);
    for (let fx = -PIT; fx < PIT; fx += 12) {
      const fg = g.createLinearGradient(fx, 0, fx + 12, 0);
      fg.addColorStop(0, 'rgba(70,50,30,.1)'); fg.addColorStop(.5, 'rgba(255,248,236,.12)'); fg.addColorStop(1, 'rgba(70,50,30,.1)');
      g.fillStyle = fg; g.fillRect(fx, 0, 12, 40);
    }

        if (e.p === v.you) {
          g.mine = null; clearInterval(g.resendT);
          if (e.a.seed === m.seed) { if (res && res.after.join('.') !== e.after.join('.')) g.mismatch++; g.en = e.n; continue; }
        }
      }
      // a ball thrown on another device: the lane as it was, then the ball
      const photo = gv.photos[e.p][Math.min(9, e.f)];
      g.cur = e.p;
      if (g.photoId !== photo || g.standing.join('.') !== e.before.join('.') || g.phase === 'show') {
        await bwReset(g, { standing: e.before.slice(), newRack: e.before.length === 10, photo, reveal: e.lv });
        if (BG !== g) return;
      } else g.target = e.lv;
      g.photoRack = e.pr;
      const who = v.players[e.p];
      bwHint(g, t('netTurnOf', { name: who ? who.name : '' }), '');
      const res = await bwAnimate(g, e.a, e.before);
      if (BG !== g) return;
      if (res && res.after.join('.') !== e.after.join('.')) g.mismatch++; // the same numbers always give the same roll
      g.standing = e.after.slice();
      g.en = e.n;
    }
    g.en = Math.max(g.en, gv.en);
    bwnState(g, v);
    if (g.mine) { bwRenderHud(g); return; } // the room has not counted this device's ball yet
    // then the lane as the room has it
    const key = bwnKey(gv);
    if (!gv.over && (key !== g.sceneKey || g.phase === 'show')) {
      g.sceneKey = key;
      await bwReset(g, { standing: gv.standing.slice(), newRack: gv.k === 0 || gv.standing.length === 10, photo: gv.photos[gv.turn][Math.min(9, gv.f)], reveal: bwnReveal(gv) });
      if (BG !== g) return;
      g.standing = gv.standing.slice();
    }
    bwRenderHud(g);
    if (gv.over) {
      g.phase = 'over'; g.dirty = true; bwHint(g, ''); bwRenderHud(g);
      if (!g.overShown) { g.overShown = true; bwLater(g, 900, () => { if (N && N.view) bwnResult(N.view); }); }
      return;
    }
    const pl = v.players[gv.turn];
    if (gv.turn === v.you) {
      if (g.phase !== 'aim') { bwBeginAim(g); bwHint(g, t('netYourTurn'), t(bwFine() ? 'bwHowKeys' : 'bwHow')); buzz(15); announce(t('netYourTurn')); }
    } else {
      if (g.phase === 'aim') g.drag = null;
      g.phase = 'wait'; g.aim.show = false; g.power = null; $('#bw-power').hidden = true; g.dirty = true;
      bwHint(g, t('netTurnOf', { name: pl ? pl.name : '' }), pl && !pl.on ? t('netAway', { name: pl.name }) : '');
    }
  }
  function bwnResult(v) {
    const gv = v.g, me = v.you, tot = gv.rolls.map((r) => bwTotal(r)), best = Math.max(...tot);
    const win = tot.map((x, i) => (x === best ? i : -1)).filter((i) => i >= 0), tie = win.length > 1;
    const g = BG;
    if (g) {
      const p = g.players[me];
      g.found = p ? p.level.map((lv, i) => (lv >= 1 ? PHOTO_BY_ID.get(p.photos[i]) : null)).filter(Boolean) : [];
    }
    const rows = v.players.map((p, i) => [p.name + (i === me ? ' (' + t('netYou') + ')' : ''), ptsText(tot[i])]);
    if (gv.round > 1) rows.push([t('bwRowWins'), t('ucWinsOf', { w: gv.wins[me] || 0, n: gv.round })]);
    const host = N && N.host, hostName = v.players[0] ? v.players[0].name : '';
    showResult({
      kicker: t('netKicker', { game: t('gameBw') }), title: tie ? t('tie') : win[0] === me ? t('netYouWin') : t('wins', { name: v.players[win[0]].name }),
      stars: null, score: tot[me], record: false, photos: !!(g && g.found && g.found.length), photosLabel: t('bwSeePhotos'),
      again: host ? t('netAgain') : t('netWaitAgain', { name: hostName }), againOff: !host, action: 'net', rows, menuLabel: t('netLeave'),
      strip: g && g.players[me] ? g.players[me].photos.map((id, i) => ({ id, open: g.players[me].level[i] >= 1 })) : null,
    });
    if (!tie && win[0] === me) celebrate(); else if (!tie) Sound.lose(); else celebrate();
  }

  /* ---------- navigation ---------- */
  function closeOverlays() {
    if (ucPickDone) ucPickDone(null);
    ['#result', '#confirm', '#gallery', '#lightbox', '#finale', '#uc-pick', '#deck-pick'].forEach((id) => { $(id).hidden = true; }); $('#countdown').hidden = true;
  }
  function goHome() {
    if (N) netLeave();
    onlineEl.hidden = true; $('#net-gone').hidden = true;
    if (S) { stopClock(); if (S.pending) clearTimeout(S.pending.t); }
    S = null;
    closeOverlays(); ucStop(); pzStop(); bwStop(); FX.clear(); Music.setEnergy(false);
    board.textContent = ''; boardMsg.hidden = true;
    game.hidden = true; mapEl.hidden = true; home.hidden = false;
    renderCount(); renderHuntCard(); ucRenderSetup(); pzRenderSetup(); bwRenderSetup();
    $(gameSel === 'uc' ? '#btn-uc-play' : gameSel === 'pz' ? '#btn-pz-play' : gameSel === 'bw' ? '#btn-bw-play' : '#btn-play').focus({ preventScroll: true });
  }
  function leaveGame() { if (N || !ucEl.hidden || !pzEl.hidden || !bwEl.hidden) { goHome(); return; } if (S && S.cfg.hunt) showMap(); else goHome(); }
  function openConfirm(online) {
    $('#cf-title').textContent = t(online ? 'netCfTitle' : 'cfTitle');
    $('#confirm .cf-text').textContent = t(online ? (N && N.host ? 'netCfTextHost' : 'netCfText') : 'cfText');
    lastFocus = document.activeElement; $('#confirm').hidden = false; $('#cf-stay').focus();
  }
  function requestExit() {
    if (S && S.online) { openConfirm(true); return; }
    if (S && S.phase === 'play' && S.started) openConfirm(false);
    else leaveGame();
  }

  /* ---------- gallery & lightbox ---------- */
  let lbIndex = 0, lbList = [];
  function openGallery() {
    if (!pzEl.hidden && P) { lbList = [P.photo]; openLightbox(0); return; }
    const list = !bwEl.hidden && BG ? BG.found : !ucEl.hidden && U ? U.photos : S ? S.photos : null;
    if (!list) return;
    lbList = list.slice();
    const grid = $('#gal-grid'); grid.textContent = '';
    lbList.forEach((p, i) => {
      const b = document.createElement('button'); b.type = 'button';
      b.setAttribute('aria-label', t('openPhoto', { i: i + 1, n: lbList.length }));
      const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; img.src = cardSrc(p);
      b.appendChild(img); b.addEventListener('click', () => openLightbox(i));
      grid.appendChild(b);
    });
    $('#gallery').hidden = false; $('#gal-close').focus();
  }
  function openLightbox(i) { lbIndex = i; renderLb(); lastFocus = document.activeElement; $('#lightbox').hidden = false; $('#lb-close').focus(); }
  function renderLb() {
    const p = lbList[lbIndex], img = $('#lb-img');
    img.src = fullSrc(p); img.width = p.fw; img.height = p.fh;
    $('#lb-count').textContent = (lbIndex + 1) + ' / ' + lbList.length;
  }
  function lbNav(d) { const n = lbList.length; lbIndex = (lbIndex + d + n) % n; renderLb(); }
  function closeLightbox() { $('#lightbox').hidden = true; if (lastFocus) lastFocus.focus({ preventScroll: true }); }

  /* ---------- wiring ---------- */
  document.addEventListener('pointerdown', () => { AudioCore.get(); Music.start(); }, { once: true });
  document.addEventListener('keydown', () => { AudioCore.get(); Music.start(); }, { once: true });
  $$('.seg button').forEach((b) => b.addEventListener('click', () => { setMode(b.dataset.mode); Sound.flip(); }));
  $$('.lang button').forEach((b) => b.addEventListener('click', () => { setLang(b.dataset.lang); Sound.flip(); }));
  $('#count').addEventListener('input', (e) => { const before = cards; setCards(e.target.value); if (cards !== before) Sound.tick2(); });
  $('#count-minus').addEventListener('click', () => { setCards(cards - 2); Sound.tick2(); });
  $('#count-plus').addEventListener('click', () => { setCards(cards + 2); Sound.tick2(); });
  $('#timed').checked = timed;
  $('#timed').addEventListener('change', (e) => { timed = e.target.checked; store.set('hm-timed', timed); renderRecordLine(); Sound.flip(); });
  $('#specials').checked = specialsOn;
  $('#specials').addEventListener('change', (e) => { specialsOn = e.target.checked; store.set('hm-specials', specialsOn); Sound.flip(); });
  $$('.deck-row .dk-f img').forEach((img) => { img.src = cardSrc(deckPhoto('029')); });
  $$('.deck-row').forEach((r) => r.addEventListener('click', () => { AudioCore.get(); Sound.tick2(); openDeckPick(r); }));
  $('#dp-close').addEventListener('click', closeDeckPick);
  $('#dp-done').addEventListener('click', () => { Sound.tick2(); closeDeckPick(); });
  $('#deck-pick').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeDeckPick(); });
  $('#btn-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); startGame(makeConfig(cards, timed, mode === 'duo', specialsOn)); });
  $('#btn-hunt').addEventListener('click', () => { AudioCore.get(); Sound.flip(); if (!hunt || hunt.done) newHunt(); showMap(); });
  const savedNames = store.get('hm-names', ['', '']);
  $('#p1').value = savedNames[0] || ''; $('#p2').value = savedNames[1] || '';
  $('#bw-p1').value = savedNames[0] || ''; $('#bw-p2').value = savedNames[1] || '';
  ['#bw-p1', '#bw-p2'].forEach((id) => $(id).addEventListener('input', () => { const v = [$('#bw-p1').value, $('#bw-p2').value]; store.set('hm-names', v); $('#p1').value = v[0]; $('#p2').value = v[1]; }));
  ['#p1', '#p2'].forEach((id) => $(id).addEventListener('input', () => { $('#bw-p1').value = $('#p1').value; $('#bw-p2').value = $('#p2').value; }));
  ['#p1', '#p2'].forEach((id) => $(id).addEventListener('input', () => store.set('hm-names', [$('#p1').value, $('#p2').value])));
  $('#fan').addEventListener('click', () => { Sound.flip(); fillFan(true); });
  $('#sfx-home').addEventListener('click', () => { Sound.setOn(!Sound.on); renderAudio(); });
  $('#music-home').addEventListener('click', () => { Music.setOn(!Music.on); renderAudio(); });
  $$('.audio-btn').forEach((b) => b.addEventListener('click', toggleAll));
  $('#btn-exit').addEventListener('click', requestExit);
  $('#btn-peek').addEventListener('click', peek);
  $('#cf-stay').addEventListener('click', () => { $('#confirm').hidden = true; if (lastFocus) lastFocus.focus({ preventScroll: true }); });
  $('#cf-leave').addEventListener('click', leaveGame);
  $('#btn-again').addEventListener('click', () => {
    if (resultAction === 'net') { if (N && N.host) netStartGame(); return; }
    if (resultAction === 'uc') { ucStart(false); return; }
    if (resultAction === 'pz') { pzStart(pzSurprise(P && P.photo)); return; }
    if (resultAction === 'bw') { bwStart(BG && BG.cfg ? BG.cfg : { duo: mode === 'duo', names: [$('#bw-p1').value, $('#bw-p2').value] }); return; }
    if (resultAction === 'map') { showMap(); return; }
    if (S) startGame(S.cfg);
  });
  $('#btn-menu').addEventListener('click', goHome);
  $('#btn-photos').addEventListener('click', openGallery);
  $('#gal-close').addEventListener('click', () => { $('#gallery').hidden = true; $('#btn-photos').focus({ preventScroll: true }); });
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-prev').addEventListener('click', () => lbNav(-1));
  $('#lb-next').addEventListener('click', () => lbNav(1));
  $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
  $('#map-back').addEventListener('click', goHome);
  $('#btn-stop-play').addEventListener('click', () => { if (!hunt) return; if (hunt.done) { newHunt(); renderMap(false); return; } startHuntStop(); });
  $('#fin-try').addEventListener('click', () => { closeOverlays(); startGame(makeConfig(cards, false, false, specialsOn)); });
  $('#fin-new').addEventListener('click', () => { newHunt(); showMap(); });
  $('#fin-menu').addEventListener('click', goHome);
  $$('.gp-tile').forEach((b) => b.addEventListener('click', () => { if (b.dataset.game !== gameSel) { setGameSel(b.dataset.game); Sound.flip(); } }));
  $$('.uc-opp-pick button').forEach((b) => b.addEventListener('click', () => { ucOpp = +b.dataset.opp; store.set('hm-uc-opp', ucOpp); ucRenderSetup(); Sound.tick2(); }));
  $('#btn-uc-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); ucStart(true); });
  $('#uc-exit').addEventListener('click', ucRequestExit);
  $('#btn-bw-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); bwStart({ duo: mode === 'duo', names: [$('#bw-p1').value, $('#bw-p2').value] }); });
  $('#bw-exit').addEventListener('click', bwRequestExit);
  bwStage.addEventListener('pointerdown', bwPointerDown);
  bwStage.addEventListener('pointermove', bwPointerMove);
  bwStage.addEventListener('pointerup', bwPointerUp);
  bwStage.addEventListener('pointercancel', bwPointerUp);
  bwEl.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => { if (bwKey(e)) e.preventDefault(); });
  $('#btn-pz-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); pzStart(pzSel === 'surprise' ? pzSurprise() : PHOTOS.find((p) => p.id === pzSel)); });
  $('#pz-more').addEventListener('click', () => { pzChoices = pzPickChoices(pzChoices ? pzChoices.map((p) => p.id) : []); if (pzSel !== 'surprise') pzSel = pzChoices[0].id; pzRenderSetup(); Sound.flip(); });
  $('#pz-exit').addEventListener('click', pzRequestExit);
  $('#pz-edges').addEventListener('click', () => pzToggle('edges'));
  $('#pz-guide').addEventListener('click', () => pzToggle('guide'));
  $('#pz-tidy').addEventListener('click', pzTidy);
  pzStage.addEventListener('pointerdown', pzPointerDown);
  pzTray.addEventListener('pointerdown', pzPointerDown);
  window.addEventListener('pointermove', pzPointerMove);
  window.addEventListener('pointerup', pzPointerUp);
  window.addEventListener('pointercancel', pzPointerCancel);
  pzEl.addEventListener('touchmove', (e) => { if (P && P.drag && P.drag.started) e.preventDefault(); }, { passive: false });
  pzTray.addEventListener('scroll', pzTrayEdge, { passive: true });
  pzTray.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { pzTray.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  pzEl.addEventListener('contextmenu', (e) => { if (e.target.closest('.pz-stage, .pz-tray')) e.preventDefault(); });
  $('#uc-draw').addEventListener('click', ucDrawBtn);
  $('#uc-draw-btn').addEventListener('click', ucDrawBtn);
  $('#uc-call').addEventListener('click', ucCall);
  $('#uc-catch').addEventListener('click', ucCatch);
  $$('.ucp-btn').forEach((b) => b.addEventListener('click', () => { if (ucPickDone) ucPickDone(b.dataset.suit); Sound.flip(); }));
  $('#ucp-cancel').addEventListener('click', () => { if (ucPickDone) ucPickDone(null); });
  (() => {
    let x0 = null;
    const lb = $('#lightbox');
    lb.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
    lb.addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1); });
  })();
  document.addEventListener('keydown', (e) => {
    if (!$('#lightbox').hidden) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') lbNav(-1);
      else if (e.key === 'ArrowRight') lbNav(1);
      return;
    }
    if (e.key !== 'Escape') return;
    if (!$('#deck-pick').hidden) { closeDeckPick(); return; }
    if (!$('#uc-pick').hidden) { if (ucPickDone) ucPickDone(null); return; }
    if (!$('#gallery').hidden) { $('#gallery').hidden = true; $('#btn-photos').focus({ preventScroll: true }); }
    else if (!$('#confirm').hidden) $('#cf-stay').click();
  });
  let rsz = 0;
  window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { layoutBoard(); ucLayout(); if (BG) bwResize(); if (!pzEl.hidden) pzLayout(); if (!home.hidden) { renderCount(); pzRenderSetup(); } }, 80); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) AudioCore.suspend(); else AudioCore.resume();
    if (P && P.phase === 'play') {
      if (document.hidden) { if (P.running) { pzStopClock(); P.autoPaused = true; } }
      else if (P.autoPaused) { P.autoPaused = false; pzStartClock(); }
    }
    if (!S || S.phase !== 'play') return;
    if (document.hidden) { if (S.running) { stopClock(); S.autoPaused = true; } }
    else if (S.autoPaused) { S.autoPaused = false; startClock(); }
  });

  $$('.online-btn').forEach((b) => b.addEventListener('click', () => { AudioCore.get(); Sound.flip(); netOpenCreate(b.dataset.netGame); }));
  $('#onl-go').addEventListener('click', netGo);
  $('#onl-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); netGo(); } });
  $('#onl-back').addEventListener('click', goHome);
  $('#onl-leave').addEventListener('click', goHome);
  $('#onl-retry').addEventListener('click', () => { if (netPrep.mode === 'join' && netPrep.code) netOpenJoin(netPrep.code, netPrep.b); else netOpenCreate(netPrep.game || gameSel); });
  $('#onl-start').addEventListener('click', () => { AudioCore.get(); Sound.flip(); netStartGame(); });
  $('#onl-share').addEventListener('click', netShare);
  $('#onl-copy').addEventListener('click', netCopy);
  $('#net-gone-ok').addEventListener('click', goHome);

  /* ---------- boot ---------- */
  buildMap();
  applyDeck();
  hbStart();
  applyLang();
  setMode(mode);
  setGameSel(gameSel);
  $$('.online-btn').forEach((b) => { b.hidden = !netOk(); });
  (() => {
    // an invite link: ?room=CODE (and the relay it uses)
    const q = new URLSearchParams(location.search), code = (q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    if (code && netOk()) { const b = q.get('b'); netOpenJoin(code, b != null && /^[0-9]$/.test(b) ? +b : null); }
  })();
  fillFan(false);
  requestAnimationFrame(() => setTimeout(() => $('#fan').classList.remove('closed'), reduceMotion.matches ? 0 : 250));
})();
</script>
</body>
</html>
