<style>
/* Layout: one-screen game. Home = fashion-magazine masthead + a fanned hand of photo cards beside the treasure hunt and
   free-play setup (stacked on phones). Game = HUD on top, board sized by JS to fit the screen. Map = illustrated treasure
   map beside the clue letter (clue on top on phones). */
:root {
  --bg: #f8f0ed;
  --bg-glow: #f1d9dc;
  --surface: #fffaf8;
  --surface-2: #f3e7e3;
  --ink: #2a1219;
  --muted: #7a5c64;
  --line: rgba(42, 18, 25, .14);
  --line-strong: rgba(42, 18, 25, .3);
  --wine: #6e1129;
  --wine-deep: #4a0a1b;
  --wine-ink: #fff4ee;
  --accent-ink: #8a1733;
  --gold: #a8781c;
  --gold-soft: #e2bf6c;
  --on-gold: #2a1219;
  --pattern: rgba(226, 191, 108, .24);
  --sheen-lo: #9a6a14;
  --sheen-hi: #fff1bf;
  --shadow-color: 42 18 25;
  --overlay: rgba(32, 10, 18, .55);
  --lb-bg: rgba(12, 5, 8, .96);
  --lb-ink: #fff4ee;
  --danger: #b42232;
  --map-paper: #f3e5cf;
  --map-sea: #e9d8bd;
  --map-land: #f9efdf;
  --map-ink: #6e1129;
  --map-line: rgba(110, 17, 41, .5);
  --goldback: #17110a;
  --goldback-ink: #f1d27f;
  --goldback-pattern: rgba(241, 210, 127, .26);

  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-ui: "Jost", Futura, "Century Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-num: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150910; --bg-glow: #3b1121; --surface: #231019; --surface-2: #2d1520;
    --ink: #f7e9e2; --muted: #bf9da5; --line: rgba(247, 233, 226, .15); --line-strong: rgba(247, 233, 226, .32);
    --wine: #7c1631; --wine-deep: #520c20; --wine-ink: #fff4ee; --accent-ink: #f2a7b6;
    --gold: #e2b95c; --gold-soft: #ebc877; --on-gold: #1c0a10; --pattern: rgba(235, 200, 119, .2);
    --shadow-color: 0 0 0; --overlay: rgba(6, 2, 4, .72); --danger: #ff7380;
    --map-paper: #22121a; --map-sea: #1b0f16; --map-land: #2e1824; --map-ink: #ebc877; --map-line: rgba(235, 200, 119, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150910; --bg-glow: #3b1121; --surface: #231019; --surface-2: #2d1520;
  --ink: #f7e9e2; --muted: #bf9da5; --line: rgba(247, 233, 226, .15); --line-strong: rgba(247, 233, 226, .32);
  --wine: #7c1631; --wine-deep: #520c20; --wine-ink: #fff4ee; --accent-ink: #f2a7b6;
  --gold: #e2b95c; --gold-soft: #ebc877; --on-gold: #1c0a10; --pattern: rgba(235, 200, 119, .2);
  --shadow-color: 0 0 0; --overlay: rgba(6, 2, 4, .72); --danger: #ff7380;
  --map-paper: #22121a; --map-sea: #1b0f16; --map-land: #2e1824; --map-ink: #ebc877; --map-line: rgba(235, 200, 119, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { position: relative; height: 100%; }
.screen { position: absolute; inset: 0; }

/* ---------- card back (shared by board, fan and finale) ---------- */
.back {
  background-color: var(--wine);
  background-image:
    linear-gradient(135deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, .18)),
    radial-gradient(circle, var(--pattern) 0 .9cqw, transparent 1.15cqw),
    radial-gradient(circle, var(--pattern) 0 .9cqw, transparent 1.15cqw);
  background-size: 100% 100%, 11cqw 11cqw, 11cqw 11cqw;
  background-position: 0 0, 0 0, 5.5cqw 5.5cqw;
}
.back::before {
  content: ""; position: absolute; inset: 5cqw;
  border: 1px solid var(--gold-soft); border-radius: 4cqw; opacity: .75;
}
.mono {
  font-family: var(--font-display); font-style: italic; font-weight: 700;
  font-size: 40px; font-size: 54cqw; line-height: 1;
  color: var(--gold-soft); text-shadow: 0 .6cqw 0 rgba(0, 0, 0, .3);
  transform: translateY(-3%);
  font-variation-settings: "opsz" 96;
}
.gold-backs .back, .back.gold { background-color: var(--goldback); --pattern: var(--goldback-pattern); }
.gold-backs .back::before, .back.gold::before { border-color: var(--goldback-ink); opacity: .9; }
.gold-backs .mono, .back.gold .mono { color: var(--goldback-ink); text-shadow: 0 .6cqw 0 rgba(0, 0, 0, .5), 0 0 6cqw rgba(241, 210, 127, .35); }

/* ---------- home ---------- */
.home {
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding-inline: clamp(16px, 5vw, 64px);
  background: radial-gradient(ellipse 75% 55% at 26% 24%, var(--bg-glow), transparent 72%), var(--bg);
}
.home-inner {
  max-width: 1140px; min-height: 100%; margin-inline: auto;
  display: grid; align-content: center; gap: clamp(20px, 5vw, 72px);
  padding-block: clamp(22px, 5vh, 56px);
}
@media (min-width: 920px) {
  .home-inner { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); align-items: center; }
}
.cover { display: grid; justify-items: center; text-align: center; min-width: 0; }
.masthead { margin: 0; line-height: .9; }
.mh-1 {
  display: block; font-family: var(--font-display); font-style: italic; font-weight: 700;
  font-size: clamp(54px, 12.5vw, 118px); letter-spacing: -.015em; color: var(--ink);
  font-variation-settings: "opsz" 96;
}
.fan {
  position: relative; display: block; width: min(100%, 520px);
  height: clamp(178px, 34vw, 320px); margin-block: clamp(10px, 2.5vw, 26px) 6px;
  padding: 0; border: 0; background: none; cursor: pointer; border-radius: 24px;
}
.fan-card {
  position: absolute; left: 50%; bottom: 16%;
  width: clamp(92px, 16vw, 150px); aspect-ratio: 3 / 4;
  container-type: inline-size;
  transform-origin: 50% 140%;
  transform: translateX(-50%) rotate(var(--r));
  transition: transform .7s cubic-bezier(.2, .9, .3, 1.15);
}
.fan.closed .fan-card { transform: translateX(-50%) rotate(0deg); }
.fan-inner {
  position: absolute; inset: 0; display: block; overflow: hidden;
  border-radius: 7cqw;
  box-shadow: 0 2px 4px rgb(var(--shadow-color) / .18), 0 20px 34px -16px rgb(var(--shadow-color) / .6);
}
.fan-inner:not(.back) { background-color: var(--surface-2); }
.fan-inner.back { display: grid; place-items: center; }
.fan-inner img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
.fan-card.top { z-index: 2; }
@media (hover: hover) {
  .fan:hover .fan-card:not(.top) { transform: translateX(-50%) rotate(calc(var(--r) * 1.18)); }
}
.lede { margin: 0; max-width: 34ch; color: var(--muted); font-size: 17px; text-wrap: balance; }

.setup { display: grid; gap: 14px; width: 100%; max-width: 500px; justify-self: center; min-width: 0; }
.hunt-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px 16px;
  padding: 16px; border-radius: 20px; border: 1px solid var(--line);
  background: linear-gradient(135deg, var(--map-paper), var(--surface) 70%);
  box-shadow: 0 16px 30px -24px rgb(var(--shadow-color) / .9);
}
.hunt-art { width: 66px; height: 66px; color: var(--map-ink); }
.hunt-art svg { width: 100%; height: 100%; display: block; }
.hunt-text { display: grid; gap: 3px; min-width: 0; }
.hunt-title { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 25px; line-height: 1.1; }
.hunt-sub { font-size: 14px; color: var(--muted); }
.hunt-bar { height: 6px; margin-top: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.hunt-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--gold); transition: width .6s ease; }
.hunt-card .btn { grid-column: 1 / -1; }
.divider { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.seg {
  display: grid; grid-template-columns: 1fr 1fr; padding: 4px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
}
.seg button {
  border: 0; background: transparent; border-radius: 999px; padding: 10px 12px;
  font-weight: 500; font-size: 15px; letter-spacing: .02em; color: var(--muted); cursor: pointer;
  transition: background-color .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--wine); color: var(--wine-ink); box-shadow: 0 6px 16px -10px rgb(var(--shadow-color) / .7); }
.duo-setup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.field input {
  min-width: 0; width: 100%; font: 500 16px var(--font-ui); padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
.duo-setup .hint { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--muted); }

.count-box, .opts { border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
.count-box { display: grid; gap: 12px; padding: 14px 18px 16px; }
.count-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.count-label { font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.count-tag { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 20px; line-height: 1; color: var(--accent-ink); }
.count-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.step {
  width: 46px; height: 46px; padding: 0; display: grid; place-items: center; cursor: pointer;
  border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  transition: transform .12s ease, opacity .2s;
}
.step:not(:disabled):active { transform: scale(.92); }
.step:disabled { opacity: .3; cursor: default; }
.count-out { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 8px; text-align: center; }
.count-num { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 48px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.count-unit { font-size: 18px; font-weight: 500; }
.count-pairs { flex-basis: 100%; font-size: 13px; color: var(--muted); }
#count { width: 100%; margin: 0; accent-color: var(--wine); cursor: pointer; }
.mini-board { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-height: 12px; }
.mini-board i { width: 9px; height: 12px; border-radius: 2px; background: var(--wine); box-shadow: inset 0 0 0 1px var(--gold-soft); animation: miniIn .25s ease backwards; }

.opt-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; cursor: pointer; }
.opt-row + .opt-row { border-top: 1px solid var(--line); }
.sw-text { display: grid; gap: 2px; min-width: 0; }
.sw-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 21px; line-height: 1.15; }
.sw-title svg.i { width: 19px; height: 19px; color: var(--accent-ink); }
.sw-sub { font-size: 14px; color: var(--muted); }
.sw-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.switch { position: relative; flex: none; width: 52px; height: 30px; border-radius: 999px; background: var(--line-strong); transition: background-color .2s; }
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--wine-ink); box-shadow: 0 1px 3px rgb(var(--shadow-color) / .35);
  transition: transform .25s cubic-bezier(.3, 1.4, .5, 1);
}
.sw-input:checked + .switch { background: var(--wine); }
.sw-input:checked + .switch::after { transform: translateX(22px); }
.sw-input:focus-visible + .switch { outline: 3px solid var(--gold); outline-offset: 2px; }

.play-btn { min-height: 58px; font-size: 19px; letter-spacing: .05em; }
.record-line { margin: -2px 0 0; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; font: 400 13px var(--font-num); color: var(--muted); text-align: center; }
.mini-stars { display: inline-flex; gap: 1px; }
.mini-stars svg { width: 11px; height: 11px; fill: var(--line-strong); }
.mini-stars svg.on { fill: var(--gold); }
.home-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; padding-top: 4px; }
.foot-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill-toggle {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 14px; cursor: pointer;
}
.pill-toggle[aria-pressed="false"] { color: var(--muted); }
.pill-toggle svg.i { width: 18px; height: 18px; }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--wine); color: var(--wine-ink); }
.fanline { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- game ---------- */
.game {
  display: flex; flex-direction: column; gap: 10px;
  padding-inline: clamp(16px, 3vw, 32px); padding-block: 10px 14px;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
}
.hud {
  display: grid; align-items: center; gap: 8px 10px;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "exit level peek sound" "stats stats stats stats";
}
@media (max-width: 359px) { .peek-btn > span:not(.badge) { display: none; } .peek-btn { padding: 0 8px 0 10px; } }
@media (min-width: 760px) {
  .hud { grid-template-columns: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "exit level stats peek sound"; gap: 10px 16px; }
}
#btn-exit { grid-area: exit; }
.hud-level { grid-area: level; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#btn-peek { grid-area: peek; }
#audio-game { grid-area: sound; }
.hud-stats, .duo-bar { grid-area: stats; display: flex; justify-content: center; align-items: center; gap: clamp(16px, 4vw, 38px); min-width: 0; }
.stat { display: grid; justify-items: center; gap: 2px; }
.st-label { font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.st-val { display: flex; align-items: center; gap: 6px; font-family: var(--font-num); font-size: 19px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
.st-val.urgent { color: var(--danger); }
.combo { font: 600 11px/1 var(--font-ui); letter-spacing: .06em; padding: 3px 7px; border-radius: 999px; background: var(--wine); color: var(--wine-ink); }
.combo.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
.icon-btn {
  width: 42px; height: 42px; display: inline-grid; place-items: center; padding: 0;
  border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.peek-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 12px 0 14px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 15px; cursor: pointer; transition: opacity .2s, transform .15s;
}
.peek-btn:not(:disabled):active { transform: scale(.96); }
.peek-btn:disabled { opacity: .4; cursor: default; }
.peek-btn.bump { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
.badge { min-width: 22px; height: 22px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--wine); color: var(--wine-ink); font: 500 12px var(--font-num); }
.pchip {
  display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 48%;
  padding: 6px 8px 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  transition: background-color .25s, color .25s, box-shadow .25s;
}
.pchip .pname { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pchip .ppairs { font: 500 15px var(--font-num); min-width: 28px; height: 28px; display: grid; place-items: center; border-radius: 999px; background: var(--surface-2); }
.pchip.active { background: var(--wine); color: var(--wine-ink); border-color: transparent; box-shadow: 0 0 0 3px var(--gold-soft); }
.pchip.active .ppairs { background: rgba(255, 255, 255, .16); }
.timebar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; flex: none; }
#timebar-fill { display: block; height: 100%; background: var(--gold); transform-origin: left center; transition: transform .25s linear, background-color .3s; }
.timebar.urgent #timebar-fill { background: var(--danger); }
.board-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
.board { position: absolute; inset: 0; }
.board-msg { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); font-size: 15px; letter-spacing: .04em; }
.shuffle { position: relative; width: 70px; height: 56px; }
.shuffle i {
  position: absolute; top: 0; left: 50%; width: 42px; height: 56px; margin-left: -21px; border-radius: 6px;
  background: var(--wine); border: 1px solid var(--gold-soft); animation: shuffle 1s ease-in-out infinite;
}
.shuffle i:nth-child(2) { animation-delay: .33s; }
.shuffle i:nth-child(3) { animation-delay: .66s; }

/* board cards */
.card {
  position: absolute; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
  container-type: inline-size; border-radius: 7%;
  -webkit-user-select: none; user-select: none;
  transition: left .3s ease, top .3s ease, width .3s ease, height .3s ease;
}
.card.dealing { transition: none; }
.board.shuffling .card { transition: left .62s cubic-bezier(.5, 0, .2, 1), top .62s cubic-bezier(.5, 0, .2, 1); }
.card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.lift { position: absolute; inset: 0; display: block; perspective: 900px; transition: transform .2s ease; }
.inner { position: absolute; inset: 0; display: block; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, 1.35, .5, 1); }
.card.up .inner, .card.matched .inner, .card.peek .inner, .card.used .inner { transform: rotateY(180deg); }
.card.peek .inner { transition-duration: .4s; }
.face {
  position: absolute; inset: 0; display: block; overflow: hidden;
  border-radius: 8px; border-radius: 7cqw;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;

}
.card .back { transform: rotateY(0deg); display: grid; place-items: center; }
.card .front { transform: rotateY(180deg); background: var(--surface-2); }
.front img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.front::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3); pointer-events: none; }
@media (hover: hover) {

}
.card.matched, .card.used { cursor: default; }
.card.matched .front { box-shadow: 0 0 0 2px var(--gold), 0 0 0 1.2cqw rgba(226, 191, 108, .35), 0 10px 20px -10px rgb(var(--shadow-color) / .55); }
.card.flash .front::before {
  content: ""; position: absolute; inset: 0; z-index: 2;

}

.card.shake .lift { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
.card .front.special {
  display: grid; place-items: center;
  background: radial-gradient(circle at 50% 42%, var(--sheen-hi) 0, var(--gold-soft) 24%, var(--wine) 64%, var(--wine-deep) 100%);
}
.sp-rays { position: absolute; inset: -25%; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .16) 0 8deg, rgba(255, 255, 255, 0) 8deg 24deg); animation: spin 14s linear infinite; }
.sp-icon { position: relative; width: 44cqw; height: 44cqw; color: var(--wine-deep); transform: translateY(-6%); }
.sp-icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sp-name {
  position: absolute; left: 4%; right: 4%; bottom: 8cqw; text-align: center; line-height: 1.1;
  font-family: var(--font-ui); font-weight: 600; font-size: 10px; font-size: max(8px, 10.5cqw); letter-spacing: .06em; text-transform: uppercase;

.card.used .front { filter: saturate(.35) brightness(.85); opacity: .5; }
.card.used .sp-rays { animation: none; }

/* ---------- treasure map ---------- */
.mapscreen {
  display: flex; flex-direction: column; gap: 12px; overflow-y: auto; overflow-x: hidden;
  padding-inline: clamp(16px, 3vw, 32px); padding-block: 10px 18px;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
}
.map-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.map-titles { display: grid; gap: 1px; min-width: 0; }
.map-title { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-progress { font: 500 12px var(--font-num); letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.map-body { flex: 1 0 auto; display: grid; gap: 16px; align-content: center; }
.map-wrap {
  position: relative; width: 100%; max-width: min(100%, max(280px, calc(100vh - 330px))); max-width: min(100%, max(280px, calc(100dvh - 330px)));
  aspect-ratio: 1; margin-inline: auto; container-type: inline-size;

}
@media (min-width: 900px), (min-width: 600px) and (orientation: landscape) {
  .map-body { grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); align-items: center; gap: clamp(16px, 3vw, 40px); }
  .map-wrap { max-width: min(100%, calc(100vh - 90px)); max-width: min(100%, calc(100dvh - 90px)); }
}
#map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.m-sea { fill: var(--map-sea); }
.m-land { fill: var(--map-land); stroke: var(--map-ink); stroke-width: 2.4; stroke-linejoin: round; }
.m-coast { fill: none; stroke: var(--map-line); stroke-width: 1.4; stroke-dasharray: 3 7; }
.m-ink { fill: none; stroke: var(--map-line); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.m-wave { fill: none; stroke: var(--map-line); stroke-width: 1.8; stroke-linecap: round; opacity: .7; }
.m-fill { fill: var(--map-ink); }
.m-soft { fill: var(--map-line); }
.m-frame { fill: none; stroke: var(--map-ink); stroke-width: 3; }
.m-frame2 { fill: none; stroke: var(--map-line); stroke-width: 1.2; }
.m-text { fill: var(--map-ink); font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 26px; }
.m-x { fill: none; stroke: var(--accent-ink); stroke-width: 7; stroke-linecap: round; }
.m-path { fill: none; stroke: var(--gold); stroke-width: 7; stroke-linecap: round; stroke-dasharray: .1 17; }
.m-mask { fill: none; stroke: #fff; stroke-width: 30; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.m-mask.draw { stroke-dashoffset: 1; animation: drawPath 1.4s ease forwards; }
.map-stops { position: absolute; inset: 0; }
.stop {
  position: absolute; transform: translate(-50%, -24%); width: 20%;
  display: grid; justify-items: center; gap: 3px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--map-ink);
}
.medal {
  width: 40px; height: 40px; width: max(38px, 8.6cqw); height: max(38px, 8.6cqw);
  display: grid; place-items: center; border-radius: 50%;
  background: var(--map-land); color: var(--map-ink); border: 2px solid var(--map-line);
  box-shadow: 0 6px 14px -8px rgb(var(--shadow-color) / .9);
  transition: transform .2s ease, background-color .3s, color .3s;
}
.medal svg { width: 54%; height: 54%; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.stop-name {
  font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 11px; font-size: max(11px, 2.45cqw); line-height: 1.1;
  text-align: center; color: var(--map-ink);
  text-shadow: 0 0 3px var(--map-paper), 0 0 3px var(--map-paper), 0 0 6px var(--map-paper);
}
.stop-stars:empty { display: none; }
@media (hover: hover) { .stop:hover .medal { transform: scale(1.1); } }
.stop.done .medal { background: var(--gold-soft); color: var(--on-gold); border-color: var(--gold); }
.stop.current .medal { background: var(--wine); color: var(--wine-ink); border-color: var(--gold-soft); animation: pulse 1.4s ease-in-out infinite; }
.stop.hint .medal { animation: pulse 1.1s ease-in-out infinite; box-shadow: 0 0 0 4px var(--gold-soft), 0 0 26px 8px var(--gold-soft); }
.stop.treasure .medal { background: var(--wine); color: var(--gold-soft); border-color: var(--gold-soft); }
.stop.wrong .medal { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
.clue { order: -1; display: grid; gap: 14px; align-content: start; }
.letter {
  position: relative; margin-top: 16px; padding: 30px 20px 18px; text-align: center;
  border-radius: 16px; border: 1px solid var(--line); background: var(--map-paper);
  box-shadow: 0 18px 34px -26px rgb(var(--shadow-color) / .9); transform-origin: top center;
}
.letter.unfold { animation: unfold .85s cubic-bezier(.2, .9, .3, 1.1); }
.seal {
  position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, var(--accent-ink), var(--wine) 60%, var(--wine-deep));
  color: var(--gold-soft); font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 21px;
  box-shadow: 0 5px 12px -5px rgb(var(--shadow-color) / .9);
}
.clue-kicker { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.clue-text { margin: 8px 0 0; font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(19px, 2.4vw, 23px); line-height: 1.35; color: var(--ink); text-wrap: balance; }
.clue-help { margin: 12px 0 0; font-size: 14px; color: var(--muted); min-height: 1.45em; }
.clue-help.bad { color: var(--danger); }
.found-card { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 20px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.found-kicker { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

.found-card .btn { width: 100%; margin-top: 8px; }

/* ---------- effects ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 56; overflow: hidden; }
#fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.float {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font: 500 17px var(--font-num); color: var(--accent-ink); background: var(--surface);
  padding: 3px 11px; border-radius: 999px; box-shadow: 0 8px 20px -10px rgb(var(--shadow-color) / .6);
  animation: floatUp 1s ease-out forwards;
}
.float.gold, .float.time { color: var(--on-gold); background: var(--gold-soft); }
.banner {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  max-width: calc(100% - 32px); text-align: center;
  background: var(--surface); border-radius: 20px; padding: 10px 24px 13px;
  box-shadow: 0 18px 40px -18px rgb(var(--shadow-color) / .7), 0 0 0 1px var(--line);

}
.banner.long { animation-duration: 1.9s; }
.b-title { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: clamp(30px, 7vw, 52px); line-height: 1.05; color: var(--accent-ink); }
.b-sub { margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.banner.gold { background: linear-gradient(120deg, var(--sheen-lo), var(--gold-soft) 40%, var(--sheen-hi) 55%, var(--gold-soft) 70%, var(--sheen-lo)); }
.banner.gold .b-title, .banner.gold .b-sub { color: var(--on-gold); }
.countdown { position: fixed; inset: 0; display: grid; place-items: center; z-index: 57; pointer-events: none; }
.countdown span {
  font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: clamp(96px, 24vw, 200px); line-height: 1;
  color: var(--accent-ink); text-shadow: 0 0 40px var(--bg), 0 0 12px var(--bg);
  animation: count .7s cubic-bezier(.2, .9, .3, 1.2) forwards;
}

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  background: var(--overlay);
  animation: fadeIn .25s ease;
}
#confirm { z-index: 66; }
.panel {
  width: 100%; max-width: 430px; max-height: 100%; overflow-y: auto;
  background: var(--surface); color: var(--ink); border-radius: 24px;
  padding: 26px 22px 22px; box-shadow: 0 30px 60px -24px rgb(var(--shadow-color) / .8);
  animation: panelIn .45s cubic-bezier(.2, .9, .3, 1.15);
}
.result { display: grid; justify-items: center; gap: 10px; text-align: center; }
.res-kicker { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.res-title { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: clamp(34px, 9vw, 46px); line-height: 1.05; color: var(--accent-ink); text-wrap: balance; }
.stars { display: flex; gap: 8px; }
.stars svg { width: 40px; height: 40px; fill: var(--line-strong); transition: fill .2s; }
.stars .on svg { fill: var(--gold); animation: starPop .5s cubic-bezier(.3, 1.7, .5, 1); }
.res-score { margin: 0; display: flex; align-items: baseline; gap: 8px; }
#res-score { font: 500 44px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.res-unit { font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.res-record { margin: 0; padding: 4px 12px; border-radius: 999px; background: var(--gold-soft); color: var(--on-gold); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; animation: pop .5s .9s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.res-stats { width: 100%; margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 16px; text-align: left; font-size: 15px; }
.res-stats dt { color: var(--muted); }
.res-stats dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.res-actions { width: 100%; display: grid; gap: 8px; margin-top: 8px; }
.btn {
  min-height: 48px; padding: 12px 18px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 16px; letter-spacing: .02em;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--wine); color: var(--wine-ink); border-color: transparent; box-shadow: 0 10px 22px -14px rgb(var(--shadow-color) / .9); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.panel.small { max-width: 380px; text-align: center; }
.cf-title { margin: 0 0 6px; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.1; }
.cf-text { margin: 0; color: var(--muted); }

.finale { z-index: 52; }
.finale-panel { display: grid; justify-items: center; gap: 10px; text-align: center; max-width: 460px; overflow-x: hidden; }
.chest-stage { position: relative; width: 230px; height: 190px; display: grid; place-items: center; }
.rays {
  position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--gold-soft) 0 6deg, rgba(0, 0, 0, 0) 6deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 66%); mask: radial-gradient(circle, #000 18%, transparent 66%);
  opacity: 0; transition: opacity .9s ease; animation: spin 18s linear infinite;
}

.chest { position: relative; width: 210px; height: auto; display: block; overflow: visible; }
.c-wood { fill: var(--wine); }
.c-wood-dark { fill: var(--wine-deep); }
.c-gold { fill: var(--gold-soft); }
.c-gold-dark { fill: var(--gold); }

.chest .spark { transform-box: fill-box; transform-origin: center; }

.chest .lid-open, .chest .coins { opacity: 0; }

.finale.open .chest .lid-open { opacity: 1; animation: lidPop .55s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 105px 92px; }
.finale.open .chest .coins { opacity: 1; animation: pop .5s .12s cubic-bezier(.3, 1.6, .5, 1) backwards; transform-origin: 105px 92px; }
.fin-text { margin: 0; color: var(--muted); max-width: 32ch; text-wrap: balance; }
.fin-reward { display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border-radius: 16px; background: var(--surface-2); text-align: left; }
.gold-sample { position: relative; width: 52px; aspect-ratio: 3 / 4; flex: none; container-type: inline-size; }
.gold-sample .face { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: 7cqw; }
.fin-reward strong { display: block; font-family: var(--font-display); font-style: italic; font-size: 19px; }
.fin-reward span { font-size: 14px; color: var(--muted); }

.gallery { z-index: 65; }
.gal-panel {
  width: 100%; max-width: 980px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); border-radius: 22px; box-shadow: 0 30px 60px -24px rgb(var(--shadow-color) / .8);
  animation: panelIn .4s cubic-bezier(.2, .9, .3, 1.1);
}
.gal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 14px 20px; border-bottom: 1px solid var(--line); }
.gal-head h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 24px; }
.gal-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(140px, 42%), 1fr)); gap: 10px; align-content: start; }
.gal-grid button { padding: 0; border: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; background: var(--surface-2); cursor: zoom-in; max-width: 100%; }
.gal-grid img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; transition: transform .3s ease; }
@media (hover: hover) { .gal-grid button:hover img { transform: scale(1.04); } }
.lightbox { position: fixed; inset: 0; z-index: 70; background: var(--lb-bg); display: grid; place-items: center; touch-action: pan-y; animation: fadeIn .2s ease; }
.lightbox img { max-width: calc(100vw - 24px); max-height: calc(100vh - 130px); max-height: calc(100dvh - 130px); width: auto; height: auto; object-fit: contain; border-radius: 10px; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .8); user-select: none; -webkit-user-drag: none; }
.lb-btn { position: absolute; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: var(--lb-ink); cursor: pointer; }
.lb-btn svg.i { width: 24px; height: 24px; }
.lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
.lb-close { right: 12px; top: max(12px, env(safe-area-inset-top, 0px)); }
.lb-count { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center; color: var(--lb-ink); font: 400 14px var(--font-num); opacity: .8; }

/* ---------- game switch (home) ---------- */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.game-pick { width: min(100%, 540px); margin-top: clamp(14px, 2.2vw, 24px); display: grid; gap: 9px; }
.gp-label { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.gp-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.gp-tile {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: start; gap: 7px;
  padding: 12px 8px 13px; border-radius: 20px; cursor: pointer; text-align: center; color: var(--ink);
  border: 2px solid var(--line-strong); background: var(--surface);
  box-shadow: 0 12px 26px -20px rgb(var(--shadow-color) / .9);
  transition: transform .15s ease, background-color .25s, border-color .25s, color .25s, box-shadow .25s;
}
.gp-tile:active { transform: scale(.98); }
@media (hover: hover) { .gp-tile[aria-pressed="false"]:hover { border-color: var(--accent-ink); transform: translateY(-2px); } }
.gp-tile[aria-pressed="true"] {
  color: #fff4ee; border-color: var(--gold-soft);
  background: linear-gradient(150deg, #9b1b3b, #6e1129 55%, #4a0a1b);

.gp-name { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: clamp(18px, 2vw, 23px); line-height: 1.05; text-wrap: balance; }
.gp-tag { font-size: 13px; line-height: 1.3; color: var(--muted); text-wrap: balance; }

.gp-check {
  position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; border: 2px solid var(--line-strong); transition: background-color .25s, border-color .25s;
}
.gp-check svg { width: 12px; height: 12px; fill: none; stroke: #2a1219; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s; }
.gp-tile[aria-pressed="true"] .gp-check { background: var(--gold-soft); border-color: var(--gold-soft); }
.gp-tile[aria-pressed="true"] .gp-check svg { opacity: 1; }
.gp-art { position: relative; width: 64px; height: 62px; flex: none; }

.gp-art .uc-card, .gp-art .uc-back { --cw: 36px; }

.pz-hero { width: min(100%, 360px); margin-block: clamp(10px, 2.2vw, 22px) 4px; }
.pz-hero canvas { display: block; width: 100%; height: auto; aspect-ratio: 360 / 290; }
.pz-mini { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--wine); color: var(--gold-soft); flex: none; }
.pz-mini svg { width: 38px; height: 38px; fill: currentColor; }
.more-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 2px 0; color: var(--accent-ink); font: 500 14px var(--font-ui); cursor: pointer; }
.more-btn svg.i { width: 16px; height: 16px; }
.pz-photos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.th { position: relative; aspect-ratio: 3 / 4; min-width: 0; padding: 0; border: 0; border-radius: 10px; background: var(--surface-2); cursor: pointer; transition: box-shadow .2s, transform .15s; }
.th:active { transform: scale(.97); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 10px; max-width: none; }
.th[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--gold-soft); }
.th-check { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold-soft); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.th-check svg { width: 13px; height: 13px; fill: none; stroke: #2a1219; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

.th.surprise { display: grid; place-content: center; justify-items: center; gap: 4px; padding: 4px; border: 1.5px dashed var(--line-strong); background: transparent; color: var(--ink); font: 500 11.5px/1.15 var(--font-ui); text-align: center; }
.th.surprise svg.i { width: 24px; height: 24px; color: var(--accent-ink); }

.pz-sizes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pz-sizes button {

@media (max-width: 460px) { .pz-photos { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
.setup-part { display: grid; gap: 14px; min-width: 0; }
.fan.uc-style .fan-card[data-photo] .fan-inner::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 4.5cqw var(--fc); }

.uc-intro {

.uc-opp-pick .n { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 24px; line-height: 1; }

}

/* ---------- Ultima carta: cards ---------- */
:root {
  --uc-rubino: #b3173f; --uc-rubino-hi: #e9577b; --uc-rubino-lo: #5c0a1e;
  --uc-zaffiro: #1f55c4; --uc-zaffiro-hi: #5d93f0; --uc-zaffiro-lo: #0d2563;
  --uc-smeraldo: #0e8a5d; --uc-smeraldo-hi: #3fc690; --uc-smeraldo-lo: #05442d;
  --uc-ambra: #d4950f; --uc-ambra-hi: #f7cd55; --uc-ambra-lo: #7d5104;
  --felt: #efe2dc; --felt-ink: rgba(110, 17, 41, .10);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --felt: #1d0d15; --felt-ink: rgba(235, 200, 119, .07); } }
:root[data-theme="dark"] { --felt: #1d0d15; --felt-ink: rgba(235, 200, 119, .07); }
.uc-card {
  --s: var(--uc-rubino); --s-hi: var(--uc-rubino-hi); --s-lo: var(--uc-rubino-lo);
  position: relative; display: block; width: var(--cw, 90px); aspect-ratio: 5 / 7; flex: none; padding: 0; margin: 0;
  container-type: inline-size; border: 0; border-radius: calc(var(--cw, 90px) * .075); overflow: hidden; isolation: isolate;
  background: linear-gradient(155deg, var(--s-hi), var(--s) 42%, var(--s-lo));
  box-shadow: 0 10px 22px -14px rgb(var(--shadow-color) / .85), 0 2px 5px -1px rgb(var(--shadow-color) / .35);
  color: #fff; font: inherit; text-align: left;
}
.uc-card.zaffiro { --s: var(--uc-zaffiro); --s-hi: var(--uc-zaffiro-hi); --s-lo: var(--uc-zaffiro-lo); }
.uc-card.smeraldo { --s: var(--uc-smeraldo); --s-hi: var(--uc-smeraldo-hi); --s-lo: var(--uc-smeraldo-lo); }
.uc-card.ambra { --s: var(--uc-ambra); --s-hi: var(--uc-ambra-hi); --s-lo: var(--uc-ambra-lo); }
.uc-card.wild { background: conic-gradient(from 225deg, var(--uc-rubino), var(--uc-ambra), var(--uc-smeraldo), var(--uc-zaffiro), var(--uc-rubino)); }
.uc-card .ph { position: absolute; inset: 3.6cqw 3.6cqw 17cqw; border-radius: 5cqw; overflow: hidden; background: #140a0e; }
.uc-card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
.uc-card .ph::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, 0) 34%), linear-gradient(0deg, rgba(0, 0, 0, .22), rgba(0, 0, 0, 0) 30%);
}
.uc-card.act .ph::after { background: linear-gradient(180deg, rgba(0, 0, 0, .5), rgba(0, 0, 0, .28) 40%, rgba(0, 0, 0, .5)); }
.uc-card .num {
  position: absolute; z-index: 2; top: 4.2cqw; left: 7.5cqw; display: flex; align-items: flex-start; gap: 2cqw;
  font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 34cqw; line-height: .9; color: #fff;
  text-shadow: 0 1cqw 4cqw rgba(0, 0, 0, .45); font-variation-settings: "opsz" 96;
}
.uc-card .num .gem { width: 9cqw; height: 9cqw; margin-top: 4cqw; fill: #fff; flex: none; }
.uc-card .num .ico { width: 21cqw; height: 21cqw; margin-top: 1.5cqw; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.uc-card .center { position: absolute; z-index: 2; inset: 3.6cqw 3.6cqw 17cqw; display: grid; place-items: center; }
.uc-card .center .ico { width: 46cqw; height: 46cqw; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1cqw 3cqw rgba(0, 0, 0, .55)); }
.uc-card .center .big { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 46cqw; line-height: 1; color: #fff; text-shadow: 0 1cqw 5cqw rgba(0, 0, 0, .55); }
.uc-card .band {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 17cqw; display: flex; align-items: center; justify-content: space-between; gap: 2cqw;
  padding: 0 7cqw 1cqw; color: #fff; font-size: 7.4cqw; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; white-space: nowrap; overflow: hidden;
}
.uc-card .band span { overflow: hidden; text-overflow: clip; }
.uc-card .band b { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 11cqw; letter-spacing: 0; text-transform: none; }
.uc-card .band .gem { width: 7.5cqw; height: 7.5cqw; fill: #fff; flex: none; }
.uc-card.wild .band { background: linear-gradient(180deg, rgba(20, 6, 12, 0), rgba(20, 6, 12, .28)); }
@container (max-width: 64px) { .uc-card .band span { visibility: hidden; } .uc-card .center { display: none; } }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqw; width: 30cqw; transform: rotate(45deg); filter: drop-shadow(0 1cqw 3cqw rgba(0, 0, 0, .5)); }
.num .quad { width: 15cqw; gap: 1.4cqw; margin: 3cqw 0 0 2cqw; }
.quad i { aspect-ratio: 1; border-radius: 30%; border: .8cqw solid rgba(255, 255, 255, .92); }
.quad i:nth-child(1) { background: var(--uc-rubino); } .quad i:nth-child(2) { background: var(--uc-ambra); }
.quad i:nth-child(3) { background: var(--uc-zaffiro); } .quad i:nth-child(4) { background: var(--uc-smeraldo); }
.uc-back { position: relative; display: block; width: var(--cw, 90px); aspect-ratio: 5 / 7; flex: none; container-type: inline-size; }
.uc-back .ub {
  position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: 7.5cqw;
  box-shadow: 0 10px 22px -14px rgb(var(--shadow-color) / .85), 0 2px 5px -1px rgb(var(--shadow-color) / .35);
}
.uc-fly { position: fixed; z-index: 54; pointer-events: none; perspective: 1000px; will-change: transform; }
.uc-fly-in { position: absolute; inset: 0; transform-style: preserve-3d; }
.uc-fly-in > * { position: absolute; inset: 0; width: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.uc-fly-in > .f-back { transform: rotateY(180deg); }

/* ---------- Ultima carta: table ---------- */
.ucs {
  --hw: 84px; --pw: 110px;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "head" "opps" "table" "foot"; gap: 6px; overflow: hidden;
  padding: max(8px, env(safe-area-inset-top, 0px)) clamp(12px, 3vw, 32px) max(10px, env(safe-area-inset-bottom, 0px));
  background: radial-gradient(ellipse 90% 45% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
}
.uc-head { grid-area: head; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; }
.uc-titles { display: grid; gap: 1px; min-width: 0; }
.uc-title { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uc-sub { font: 500 12px var(--font-num); letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
.uc-stats { display: none; gap: 26px; margin-right: 8px; }
.uc-opps { grid-area: opps; display: flex; justify-content: space-around; align-items: flex-start; gap: 6px; min-width: 0; }
.opp { position: relative; display: grid; justify-items: center; gap: 4px; min-width: 0; text-align: center; }
.opp .avatar {
  width: 54px; height: 54px; display: grid; place-items: center; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--line-strong); box-shadow: 0 8px 18px -12px rgb(var(--shadow-color) / .8);
  transition: border-color .25s, box-shadow .25s;
}
.opp .avatar svg { width: 72%; height: 72%; }
.opp.turn .avatar { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(226, 191, 108, .38), 0 8px 18px -12px rgb(var(--shadow-color) / .8); animation: pulse 1.6s ease-in-out infinite; }
.opp .o-info { display: grid; justify-items: center; gap: 4px; min-width: 0; }
.opp .name { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 17px; line-height: 1; white-space: nowrap; }
.opp .mini { display: flex; height: 22px; }
.opp .mini i { width: 15px; height: 22px; margin-left: -9px; border-radius: 3px; background: var(--wine); box-shadow: inset 0 0 0 1px var(--gold-soft), 0 2px 4px -2px rgb(var(--shadow-color) / .6); }
.opp .mini i:first-child { margin-left: 0; }
.opp .count { font: 500 12px var(--font-num); color: var(--muted); white-space: nowrap; }
.shout { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--on-gold); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.opp .shout.danger { background: var(--danger); color: #fff; }
.uc-table { grid-area: table; position: relative; display: grid; place-items: center; min-height: 0; min-width: 0; padding: 14px 0 54px; }
.uc-felt {
  position: absolute; inset: 4px 0; border-radius: 34px; border: 1px solid var(--line);
  background: radial-gradient(circle, var(--felt-ink) 0 1.2px, transparent 1.6px) 0 0 / 16px 16px, var(--felt);
}
.uc-dir { position: absolute; inset: 9% 7%; pointer-events: none; color: var(--gold); }
.uc-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.uc-ring ellipse { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1 9; opacity: .75; animation: flow 4s linear infinite; }
.uc-dir.ccw .uc-ring ellipse { animation-direction: reverse; }
.uc-arrow { position: absolute; right: 2%; top: -2%; width: 26px; height: 26px; transition: transform .5s cubic-bezier(.3, 1.5, .5, 1); }
.uc-dir.ccw .uc-arrow { transform: scaleX(-1); }
.uc-center { position: relative; display: flex; align-items: center; gap: calc(var(--pw) * .34); }
.uc-draw { position: relative; width: calc(var(--pw) + 6px); aspect-ratio: 5 / 7; padding: 0; border: 0; background: none; cursor: pointer; border-radius: calc(var(--pw) * .08); }
.uc-draw:disabled { cursor: default; }
.uc-stack .uc-back { position: absolute; left: 0; top: 0; --cw: var(--pw); }
.uc-stack .uc-back:nth-child(1) { transform: translate(6px, 6px); }
.uc-stack .uc-back:nth-child(2) { transform: translate(3px, 3px); }
.uc-draw.ready .uc-stack .uc-back:last-child .ub { box-shadow: 0 0 0 3px var(--gold-soft), 0 12px 24px -12px rgb(var(--shadow-color) / .9); }
.uc-count {
  position: absolute; z-index: 3; top: -9px; right: -12px; min-width: 28px; padding: 2px 7px; border-radius: 999px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); font: 500 11px/1.4 var(--font-num); color: var(--muted); box-shadow: 0 4px 10px -6px rgb(var(--shadow-color) / .6);
}
.uc-discard { position: relative; width: var(--pw); aspect-ratio: 5 / 7; --ring: transparent; }
.uc-discard::before {
  content: ""; position: absolute; inset: calc(var(--pw) * -.09); border-radius: calc(var(--pw) * .15); pointer-events: none;
  box-shadow: 0 0 0 3px var(--ring), 0 0 30px 6px color-mix(in srgb, var(--ring) 55%, transparent);
  transition: box-shadow .45s ease;
}
.uc-discard .uc-card { position: absolute; inset: 0; --cw: var(--pw); }
.uc-table .color-chip {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  padding: 5px 12px 5px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted);
}
.color-chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--line-strong); box-shadow: 0 0 0 2px rgba(255, 255, 255, .8); transition: background-color .4s; }
.uc-foot { grid-area: foot; display: grid; gap: 4px; min-width: 0; }
.uc-status { margin: 0; min-height: 2.9em; display: grid; place-content: center; text-align: center; font-size: 15px; line-height: 1.45; color: var(--muted); text-wrap: balance; }
.ucs.wide .uc-status { display: block; min-height: 0; }
.uc-status b { color: var(--ink); font-weight: 600; }
.uc-status.bad { color: var(--danger); }
.uc-hand {
  position: relative; height: calc(var(--hw) * 1.4 + 46px); min-width: 0;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.uc-hand::-webkit-scrollbar { display: none; }
.uc-hand .uc-card {
  --cw: var(--hw); position: absolute; left: 0; bottom: 16px; cursor: pointer; transform-origin: 50% 130%;
  transform: translate(var(--x, 0), var(--y, 0)) rotate(var(--r, 0deg));
  transition: transform .28s cubic-bezier(.2, .9, .3, 1.1), box-shadow .2s ease;
}
.uc-hand .uc-card.can { transform: translate(var(--x, 0), calc(var(--y, 0px) - 16px)) rotate(var(--r, 0deg)); box-shadow: 0 0 0 3px var(--gold-soft), 0 16px 26px -14px rgb(var(--shadow-color) / .9); }
.uc-hand .uc-card.cannot .ph img { filter: saturate(.55) brightness(.8); }
.uc-hand .uc-card.fresh { animation: ucIn .45s cubic-bezier(.2, .9, .3, 1.2); }
.uc-hand .uc-card.shake { animation: ucShake .42s cubic-bezier(.36, .07, .19, .97); }
.uc-hand .uc-card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.uc-actions { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
.uc-actions .btn { min-width: 112px; }
.btn.gold {
  border-color: transparent; color: var(--on-gold);
  background: linear-gradient(120deg, #c99a35, var(--gold-soft) 45%, var(--sheen-hi) 55%, var(--gold-soft) 70%, #c99a35);
  font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 19px; letter-spacing: 0;
}
.btn.gold:disabled { opacity: .42; cursor: default; filter: saturate(.6); }
.btn.gold.pulse { animation: pulse .8s ease-in-out infinite; }
.btn.gold.done { box-shadow: 0 0 0 3px var(--gold); }
.btn.catch { border-color: transparent; background: var(--danger); color: #fff; font-weight: 600; animation: pulse .9s ease-in-out infinite; }
.btn:disabled { cursor: default; }
.uc-actions #uc-draw-btn:disabled { opacity: .5; }
.ucs.compact .opp .avatar { width: 40px; height: 40px; }
.ucs.compact .opp .mini { display: none; }
.ucs.compact .opp .name { font-size: 15px; }
.ucs.compact .uc-title { font-size: 21px; }
.ucs.compact .uc-actions .btn { min-height: 42px; padding-block: 8px; }
.ucs.compact .uc-table .color-chip { bottom: 8px; font-size: 12px; padding: 3px 10px 3px 6px; }

.ucp-btn {

/* ---------- Puzzle ---------- */
.pzs {
  --pz-slot: rgba(110, 17, 41, .2);
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: max(8px, env(safe-area-inset-top, 0px));
  background: radial-gradient(ellipse 90% 45% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pzs { --pz-slot: rgba(235, 200, 119, .17); } }
:root[data-theme="dark"] .pzs { --pz-slot: rgba(235, 200, 119, .17); }
.pz-head { display: flex; align-items: center; gap: 12px; padding: 0 clamp(14px, 3vw, 30px); min-height: 48px; flex: none; }
.pz-head .uc-titles { flex: 1 1 auto; }
.pz-stats { display: flex; gap: clamp(14px, 3vw, 28px); flex: none; }
.pz-tools { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pzs.wide .pz-head .uc-titles { flex: 0 1 auto; }
.pzs.wide .pz-stats { margin-left: clamp(14px, 3vw, 44px); }
.pzs.wide #pz-tools-head { margin-left: auto; }
.pzs:not(.wide) #pz-tools-head { display: none; }
.pz-aids { display: flex; align-items: center; gap: 8px; }
.pz-progress { height: 4px; margin: 8px clamp(14px, 3vw, 30px) 0; border-radius: 4px; background: var(--line); overflow: hidden; flex: none; }
.pz-progress i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); transition: width .4s ease; }
.pz-stage { position: relative; flex: 1 1 auto; min-height: 0; touch-action: none; }
.pzs.wide .pz-stage { background-image: radial-gradient(var(--felt-ink) 1.2px, transparent 1.5px); background-size: 18px 18px; }
.pz-board { position: absolute; border-radius: 10px; background: var(--felt); box-shadow: inset 0 0 0 1px var(--line), 0 20px 40px -26px rgb(var(--shadow-color) / .9); transition: box-shadow .6s ease; }
.pz-board > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: inherit; pointer-events: none; }
.pz-ghost, .pz-final { object-fit: cover; max-width: none; opacity: 0; }
.pz-ghost { transition: opacity .4s ease; }
.pz-board.guide .pz-ghost { opacity: .24; }
.pz-final { transition: opacity .7s ease; }
.pz-final.show { opacity: 1; }
#pz-fx { opacity: 0; }
#pz-fx.flash { animation: pzFlash .8s ease-out; }
.pzs.won .pz-board { box-shadow: 0 0 0 3px var(--gold-soft), 0 0 42px 4px rgba(226, 191, 108, .45), 0 24px 44px -20px rgb(var(--shadow-color) / .9); }
.pz-layer { position: absolute; inset: 0; pointer-events: none; }
.pz-piece { position: absolute; display: block; pointer-events: auto; cursor: grab; transform-origin: 0 0; -webkit-user-drag: none; }
.pz-piece.sel { filter: drop-shadow(0 0 1.5px var(--gold-soft)) drop-shadow(0 0 5px var(--gold-soft)); }
.pz-msg { position: absolute; left: 0; right: 0; top: 44%; margin: 0; text-align: center; color: var(--muted); font-size: 16px; }
.pz-drag { position: fixed; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
.pz-clone { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; will-change: transform; }
.pz-clone.lift { filter: drop-shadow(0 14px 12px rgb(var(--shadow-color) / .42)); }
.pz-drawer { display: none; flex: none; }
.pzs:not(.wide) .pz-drawer {
  display: grid; gap: 2px; margin-top: 10px; padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line);
  box-shadow: 0 -16px 34px -26px rgb(var(--shadow-color) / .9);
}
.pz-tray-bar { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 16px; }
.pz-left { font-size: 14px; color: var(--muted); white-space: nowrap; }
.pz-left b { color: var(--ink); font: 500 15px var(--font-num); }
#pz-tools-tray { margin-left: auto; }
.pz-tray {
  position: relative; height: var(--tray-h, 184px); overflow-x: auto; overflow-y: hidden; touch-action: pan-x;
  overscroll-behavior-x: contain; scrollbar-width: thin;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 34px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 34px), transparent);
}
.pz-tray.at-end { -webkit-mask-image: none; mask-image: none; }
.pz-tray-in { position: relative; height: 100%; min-width: 100%; }
.pz-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 500 14px var(--font-ui);
  transition: background-color .2s, color .2s, border-color .2s;
}
.pz-chip[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
.pz-chip svg.i { width: 17px; height: 17px; }
.pz-chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
.pz-wait { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font: 500 13px var(--font-num); white-space: nowrap; }
.pz-wait svg.i { width: 15px; height: 15px; }
#result.pz { background: rgba(20, 7, 12, .3); }
@media (min-width: 900px) { #result.pz { justify-items: end; padding-right: max(24px, 4vw); } }
@media (max-width: 899px) { #result.pz { align-items: end; } }
@media (max-width: 380px) {
  .pz-head { gap: 8px; }
  .pz-head .icon-btn { width: 38px; height: 38px; }
  .pzs .uc-title { font-size: 21px; }
  .pzs .st-val { font-size: 17px; }
  .pz-stats { gap: 12px; }
  .pz-chip { padding: 0 10px; font-size: 13px; }
}
@keyframes pzFlash { 0% { opacity: 1; } 55% { opacity: .9; } 100% { opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -100; } }
@keyframes ucIn { 0% { opacity: 0; translate: 0 30px; } 100% { opacity: 1; translate: 0 0; } }
@keyframes ucShake { 10%, 90% { translate: -1px 0; } 20%, 80% { translate: 3px 0; } 30%, 50%, 70% { translate: -6px 0; } 40%, 60% { translate: 6px 0; } }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
@keyframes sheen { from { background-position: 0% 0; } to { background-position: 260% 0; } }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.06); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6) rotate(-4deg); } 16% { opacity: 1; transform: translate(-50%, -50%) scale(1.06) rotate(1deg); } 26% { transform: translate(-50%, -50%) scale(1) rotate(0); } 78% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(.96); } }
@keyframes count { 0% { opacity: 0; transform: scale(1.8); } 30% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(.85); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes miniIn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes starPop { 0% { transform: scale(.2) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes panelIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes shuffle { 0%, 100% { transform: translateX(0) rotate(0); z-index: 1; } 25% { transform: translateX(-26px) rotate(-10deg); } 50% { transform: translateX(0) rotate(0); z-index: 3; } 75% { transform: translateX(26px) rotate(10deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes unfold { 0% { opacity: 0; transform: perspective(700px) rotateX(-75deg) scaleY(.6); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes drawPath { to { stroke-dashoffset: 0; } }
@keyframes lidPop { 0% { transform: translateY(18px) scaleY(.3); } 100% { transform: none; } }
@keyframes twinkle { 0%, 100% { transform: scale(.4) rotate(0deg); opacity: .2; } 50% { transform: scale(1.15) rotate(45deg); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .inner, .fan-card, .lift, .card, .switch::after, .board.shuffling .card { transition-duration: .01ms !important; }
  .card.shake .lift, .card.flash .front::before, .card.golden .front::after, .float, .countdown span, .sp-rays, .rays,
  .panel, .overlay, .stars .on svg, .res-record, .combo.pop, .shuffle i, .mini-board i, .medal, .letter.unfold, .m-mask.draw,
  .peek-btn.bump, .finale .lid-open, .finale .coins, .chest .spark, .uc-ring ellipse, .opp.turn .avatar, .btn.gold.pulse, .btn.catch,
  .pz-chip.pop, .uc-hand .uc-card.fresh, .uc-hand .uc-card.shake { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  .uc-hand .uc-card, .uc-arrow { transition-duration: .01ms !important; }
  .banner { animation: none; opacity: 1; }
}

      const b = document.createElement('button'); b.type = 'button';
      b.setAttribute('aria-label', t('openPhoto', { i: i + 1, n: lbList.length }));
      const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; img.src = cardSrc(p);
      b.appendChild(img); b.addEventListener('click', () => openLightbox(i));
      grid.appendChild(b);
    });
    $('#gallery').hidden = false; $('#gal-close').focus();
  }
  function openLightbox(i) { lbIndex = i; renderLb(); lastFocus = document.activeElement; $('#lightbox').hidden = false; $('#lb-close').focus(); }
  function renderLb() {
    const p = lbList[lbIndex], img = $('#lb-img');
    img.src = fullSrc(p); img.width = p.fw; img.height = p.fh;
    $('#lb-count').textContent = (lbIndex + 1) + ' / ' + lbList.length;
  }
  function lbNav(d) { const n = lbList.length; lbIndex = (lbIndex + d + n) % n; renderLb(); }
  function closeLightbox() { $('#lightbox').hidden = true; if (lastFocus) lastFocus.focus({ preventScroll: true }); }

  /* ---------- wiring ---------- */
  document.addEventListener('pointerdown', () => { AudioCore.get(); Music.start(); }, { once: true });
  document.addEventListener('keydown', () => { AudioCore.get(); Music.start(); }, { once: true });
  $$('.seg button').forEach((b) => b.addEventListener('click', () => { setMode(b.dataset.mode); Sound.flip(); }));
  $$('.lang button').forEach((b) => b.addEventListener('click', () => { setLang(b.dataset.lang); Sound.flip(); }));
  $('#count').addEventListener('input', (e) => { const before = cards; setCards(e.target.value); if (cards !== before) Sound.tick2(); });
  $('#count-minus').addEventListener('click', () => { setCards(cards - 2); Sound.tick2(); });
  $('#count-plus').addEventListener('click', () => { setCards(cards + 2); Sound.tick2(); });
  $('#timed').checked = timed;
  $('#timed').addEventListener('change', (e) => { timed = e.target.checked; store.set('hm-timed', timed); renderRecordLine(); Sound.flip(); });
  $('#specials').checked = specialsOn;
  $('#specials').addEventListener('change', (e) => { specialsOn = e.target.checked; store.set('hm-specials', specialsOn); Sound.flip(); });
  $('#goldback').addEventListener('change', (e) => { store.set('hm-goldback-on', e.target.checked); applyGoldBack(); Sound.flip(); });
  $('#btn-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); startGame(makeConfig(cards, timed, mode === 'duo', specialsOn)); });
  $('#btn-hunt').addEventListener('click', () => { AudioCore.get(); Sound.flip(); if (!hunt || hunt.done) newHunt(); showMap(); });
  const savedNames = store.get('hm-names', ['', '']);
  $('#p1').value = savedNames[0] || ''; $('#p2').value = savedNames[1] || '';
  ['#p1', '#p2'].forEach((id) => $(id).addEventListener('input', () => store.set('hm-names', [$('#p1').value, $('#p2').value])));
  $('#fan').addEventListener('click', () => { Sound.flip(); fillFan(true); });
  $('#sfx-home').addEventListener('click', () => { Sound.setOn(!Sound.on); renderAudio(); });
  $('#music-home').addEventListener('click', () => { Music.setOn(!Music.on); renderAudio(); });
  $$('.audio-btn').forEach((b) => b.addEventListener('click', toggleAll));
  $('#btn-exit').addEventListener('click', requestExit);
  $('#btn-peek').addEventListener('click', peek);
  $('#cf-stay').addEventListener('click', () => { $('#confirm').hidden = true; if (lastFocus) lastFocus.focus({ preventScroll: true }); });
  $('#cf-leave').addEventListener('click', leaveGame);
  $('#btn-again').addEventListener('click', () => {
    if (resultAction === 'uc') { ucStart(false); return; }
    if (resultAction === 'pz') { pzStart(pzSurprise(P && P.photo)); return; }
    if (resultAction === 'map') { showMap(); return; }
    if (S) startGame(S.cfg);
  });
  $('#btn-menu').addEventListener('click', goHome);
  $('#btn-photos').addEventListener('click', openGallery);
  $('#gal-close').addEventListener('click', () => { $('#gallery').hidden = true; $('#btn-photos').focus({ preventScroll: true }); });
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-prev').addEventListener('click', () => lbNav(-1));
  $('#lb-next').addEventListener('click', () => lbNav(1));
  $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
  $('#map-back').addEventListener('click', goHome);
  $('#btn-stop-play').addEventListener('click', () => { if (!hunt) return; if (hunt.done) { newHunt(); renderMap(false); return; } startHuntStop(); });
  $('#fin-try').addEventListener('click', () => { closeOverlays(); startGame(makeConfig(cards, false, false, specialsOn)); });
  $('#fin-new').addEventListener('click', () => { newHunt(); showMap(); });
  $('#fin-menu').addEventListener('click', goHome);
  $$('.gp-tile').forEach((b) => b.addEventListener('click', () => { if (b.dataset.game !== gameSel) { setGameSel(b.dataset.game); Sound.flip(); } }));
  $$('.uc-opp-pick button').forEach((b) => b.addEventListener('click', () => { ucOpp = +b.dataset.opp; store.set('hm-uc-opp', ucOpp); ucRenderSetup(); Sound.tick2(); }));
  $('#btn-uc-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); ucStart(true); });
  $('#uc-exit').addEventListener('click', ucRequestExit);
  $('#btn-pz-play').addEventListener('click', () => { AudioCore.get(); Sound.flip(); pzStart(pzSel === 'surprise' ? pzSurprise() : PHOTOS.find((p) => p.id === pzSel)); });
  $('#pz-more').addEventListener('click', () => { pzChoices = pzPickChoices(pzChoices ? pzChoices.map((p) => p.id) : []); if (pzSel !== 'surprise') pzSel = pzChoices[0].id; pzRenderSetup(); Sound.flip(); });
  $('#pz-exit').addEventListener('click', pzRequestExit);
  $('#pz-edges').addEventListener('click', () => pzToggle('edges'));
  $('#pz-guide').addEventListener('click', () => pzToggle('guide'));
  $('#pz-tidy').addEventListener('click', pzTidy);
  pzStage.addEventListener('pointerdown', pzPointerDown);
  pzTray.addEventListener('pointerdown', pzPointerDown);
  window.addEventListener('pointermove', pzPointerMove);
  window.addEventListener('pointerup', pzPointerUp);
  window.addEventListener('pointercancel', pzPointerCancel);
  pzEl.addEventListener('touchmove', (e) => { if (P && P.drag && P.drag.started) e.preventDefault(); }, { passive: false });
  pzTray.addEventListener('scroll', pzTrayEdge, { passive: true });
  pzTray.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { pzTray.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  pzEl.addEventListener('contextmenu', (e) => { if (e.target.closest('.pz-stage, .pz-tray')) e.preventDefault(); });
  $('#uc-draw').addEventListener('click', ucDrawBtn);
  $('#uc-draw-btn').addEventListener('click', ucDrawBtn);
  $('#uc-call').addEventListener('click', ucCall);
  $('#uc-catch').addEventListener('click', ucCatch);
  $$('.ucp-btn').forEach((b) => b.addEventListener('click', () => { if (ucPickDone) ucPickDone(b.dataset.suit); Sound.flip(); }));
  $('#ucp-cancel').addEventListener('click', () => { if (ucPickDone) ucPickDone(null); });
  (() => {
    let x0 = null;
    const lb = $('#lightbox');
    lb.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
    lb.addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1); });
  })();
  document.addEventListener('keydown', (e) => {
    if (!$('#lightbox').hidden) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') lbNav(-1);
      else if (e.key === 'ArrowRight') lbNav(1);
      return;
    }
    if (e.key !== 'Escape') return;
    if (!$('#uc-pick').hidden) { if (ucPickDone) ucPickDone(null); return; }
    if (!$('#gallery').hidden) { $('#gallery').hidden = true; $('#btn-photos').focus({ preventScroll: true }); }
    else if (!$('#confirm').hidden) $('#cf-stay').click();
  });
  let rsz = 0;
  window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { layoutBoard(); ucLayout(); if (!pzEl.hidden) pzLayout(); if (!home.hidden) { renderCount(); pzRenderSetup(); } }, 80); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) AudioCore.suspend(); else AudioCore.resume();
    if (P && P.phase === 'play') {
      if (document.hidden) { if (P.running) { pzStopClock(); P.autoPaused = true; } }
      else if (P.autoPaused) { P.autoPaused = false; pzStartClock(); }
    }
    if (!S || S.phase !== 'play') return;
    if (document.hidden) { if (S.running) { stopClock(); S.autoPaused = true; } }
    else if (S.autoPaused) { S.autoPaused = false; startClock(); }
  });

  /* ---------- boot ---------- */
  buildMap();
  applyGoldBack();
  applyLang();
  setMode(mode);
  setGameSel(gameSel);
  fillFan(false);
  requestAnimationFrame(() => setTimeout(() => $('#fan').classList.remove('closed'), reduceMotion.matches ? 0 : 250));
})();
</script>
</body>
</html>
